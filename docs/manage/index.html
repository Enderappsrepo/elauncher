<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>ELauncher — Remote</title>
  <link rel="icon" href="../icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <style>
    * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
    [hidden] { display: none !important; }
    :root {
      --bg: #0a0a0f;
      --card: #121218;
      --card-2: #16161d;
      --line: rgba(255, 255, 255, 0.07);
      --line-strong: rgba(255, 255, 255, 0.12);
      --text: #f4f5fa;
      --dim: #a0a3b6;
      --faint: #64677a;
      --accent: #7c6cff;
      --accent-2: #22d3ee;
      --accent-soft: rgba(124, 108, 255, 0.14);
      --green: #34d399;
      --green-soft: rgba(52, 211, 153, 0.11);
      --red: #fb7185;
      --red-soft: rgba(251, 113, 133, 0.12);
      --amber: #fbbf24;
      --amber-soft: rgba(251, 191, 36, 0.12);
      --radius: 18px;
    }
    html { background: var(--bg); }
    body {
      background:
        radial-gradient(52% 34% at 18% -6%, rgba(124, 108, 255, 0.16), transparent 70%),
        radial-gradient(44% 30% at 88% -4%, rgba(34, 211, 238, 0.1), transparent 70%),
        radial-gradient(38% 26% at 55% -8%, rgba(217, 70, 239, 0.07), transparent 70%),
        var(--bg);
      background-attachment: fixed;
      color: var(--text);
      min-height: 100dvh;
      font: 15px/1.5 'Inter', -apple-system, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; cursor: pointer; border: 0; background: none; color: inherit; }
    input { font: inherit; }
    .shell { max-width: 540px; margin: 0 auto; padding: 0 16px calc(40px + env(safe-area-inset-bottom)); }

    /* ---------- header ---------- */
    .top {
      position: sticky; top: 0; z-index: 20;
      display: flex; align-items: center; gap: 11px;
      padding: calc(12px + env(safe-area-inset-top)) 2px 12px;
      margin: 0 -16px 18px; padding-left: 18px; padding-right: 14px;
      background: rgba(10, 10, 15, 0.72);
      backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--line);
    }
    .top img { width: 30px; height: 30px; border-radius: 9px; }
    .wordmark { font-weight: 800; font-size: 16.5px; letter-spacing: -0.02em; white-space: nowrap; }
    @media (max-width: 360px) { .live { display: none; } }
    .wordmark span {
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .live { margin-left: auto; display: flex; align-items: center; gap: 7px; font-size: 11.5px; color: var(--faint); }
    .live .dot { width: 6px; height: 6px; border-radius: 99px; background: var(--green); animation: pulse 2s infinite; }
    .iconbtn {
      display: grid; place-items: center; width: 38px; height: 38px; border-radius: 12px;
      color: var(--dim); border: 1px solid transparent; transition: 0.15s;
    }
    .iconbtn:active { background: var(--card-2); border-color: var(--line); transform: scale(0.94); }
    .iconbtn.on { color: var(--accent); }

    /* ---------- login ---------- */
    .login { padding-top: 9dvh; display: flex; flex-direction: column; align-items: center; text-align: center; }
    .halo { position: relative; width: 92px; height: 92px; margin-bottom: 22px; }
    .halo::before {
      content: ''; position: absolute; inset: -26px;
      background: radial-gradient(closest-side, rgba(124, 108, 255, 0.4), rgba(34, 211, 238, 0.12), transparent);
      filter: blur(14px); border-radius: 50%;
    }
    .halo img { position: relative; width: 92px; height: 92px; border-radius: 24px; }
    .login h1 { font-size: 27px; font-weight: 800; letter-spacing: -0.03em; }
    .login h1 span {
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .login p { color: var(--dim); font-size: 13.5px; margin: 8px 0 26px; max-width: 300px; }
    .panel {
      width: 100%; background: var(--card); border: 1px solid var(--line);
      border-radius: var(--radius); padding: 20px; text-align: left;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
    }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 11.5px; font-weight: 650; color: var(--faint); letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 7px; }
    .field input {
      width: 100%; padding: 13px 14px; border-radius: 13px;
      background: var(--card-2); border: 1px solid var(--line); color: var(--text); outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .field input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .cta {
      width: 100%; padding: 14px; border-radius: 13px; font-weight: 700; color: #fff;
      background: linear-gradient(135deg, var(--accent), #5f8bff 55%, var(--accent-2));
      box-shadow: 0 10px 26px rgba(124, 108, 255, 0.35);
      transition: 0.15s;
    }
    .cta:active { transform: translateY(1px) scale(0.99); }
    .cta:disabled { opacity: 0.55; }
    .err { color: var(--red); font-size: 13px; min-height: 18px; margin: 10px 2px 2px; }

    /* ---------- server cards ---------- */
    .card {
      background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 16px; margin-bottom: 14px; box-shadow: 0 14px 40px rgba(0, 0, 0, 0.35);
    }
    .card.offline { opacity: 0.78; }
    .head { display: flex; align-items: center; gap: 13px; }
    .tile {
      position: relative; width: 46px; height: 46px; border-radius: 14px; flex: none;
      display: grid; place-items: center; font-weight: 800; font-size: 19px; color: #fff;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.4);
    }
    .tile .st {
      position: absolute; right: -3px; bottom: -3px; width: 13px; height: 13px; border-radius: 99px;
      border: 3px solid var(--card); background: var(--faint);
    }
    .tile .st.on { background: var(--green); animation: pulse 2s infinite; }
    .tile .st.warm { background: var(--amber); }
    .tile .st.dead { background: var(--red); }
    .who { min-width: 0; flex: 1; }
    .who .nm { font-weight: 750; font-size: 16.5px; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .who .ln { font-size: 12.5px; color: var(--dim); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chip {
      flex: none; font-size: 11px; font-weight: 700; letter-spacing: 0.03em;
      padding: 5px 10px; border-radius: 99px; border: 1px solid var(--line-strong); color: var(--dim);
    }
    .chip.on { color: var(--green); border-color: rgba(52, 211, 153, 0.35); background: var(--green-soft); }
    .chip.warm { color: var(--amber); border-color: rgba(251, 191, 36, 0.35); background: var(--amber-soft); }
    .chip.dead { color: var(--red); border-color: rgba(251, 113, 133, 0.3); background: var(--red-soft); }
    .chip.acc { color: var(--accent); border-color: rgba(124, 108, 255, 0.35); background: var(--accent-soft); }

    .pills { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 13px; }
    .pill {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 12px; color: var(--dim); padding: 6px 11px;
      background: var(--card-2); border: 1px solid var(--line); border-radius: 99px;
    }
    .pill svg { width: 12px; height: 12px; color: var(--faint); }
    .pill b { color: var(--text); font-weight: 650; }

    .addr {
      display: flex; align-items: center; gap: 9px; width: 100%;
      margin-top: 12px; padding: 11px 13px; border-radius: 13px;
      background: rgba(124, 108, 255, 0.07); border: 1px dashed rgba(124, 108, 255, 0.35);
      color: var(--text); font: 12.5px ui-monospace, Menlo, Consolas, monospace;
    }
    .addr svg { width: 14px; height: 14px; color: var(--accent); flex: none; }
    .addr .a { flex: 1; min-width: 0; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .addr .c { color: var(--faint); font-size: 11px; font-family: 'Inter', -apple-system, sans-serif; }

    .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-top: 13px; }
    .acts.single { grid-template-columns: 1fr; }
    .btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 13px; border-radius: 13px; font-weight: 700; font-size: 14px;
      border: 1px solid var(--line-strong); background: var(--card-2); color: var(--text);
      transition: 0.15s;
    }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.5; }
    .btn svg { width: 15px; height: 15px; }
    .btn.start { background: var(--green-soft); border-color: rgba(52, 211, 153, 0.4); color: var(--green); }
    .btn.stop { background: var(--red-soft); border-color: rgba(251, 113, 133, 0.35); color: var(--red); }

    .conbtn {
      width: 100%; display: flex; align-items: center; gap: 8px; margin-top: 12px;
      color: var(--faint); font-size: 12.5px; font-weight: 650; padding: 4px 2px;
    }
    .conbtn svg { width: 13px; height: 13px; transition: transform 0.2s; }
    .conbtn.open svg { transform: rotate(90deg); }
    .console {
      display: none; margin-top: 10px; padding: 12px; border-radius: 13px;
      background: #0a0a10; border: 1px solid var(--line);
      font: 11px/1.55 ui-monospace, Menlo, Consolas, monospace; color: #b9c0d4;
      max-height: 250px; overflow-y: auto; white-space: pre-wrap; word-break: break-word;
    }
    .console.open { display: block; }
    .cmdrow { display: none; gap: 8px; margin-top: 9px; }
    .cmdrow.open { display: flex; }
    .cmdrow input {
      flex: 1; min-width: 0; padding: 11px 13px; border-radius: 12px;
      background: var(--card-2); border: 1px solid var(--line); color: var(--text); outline: none;
      font: 12.5px ui-monospace, Menlo, Consolas, monospace;
    }
    .cmdrow input:focus { border-color: var(--accent); }
    .cmdrow button {
      display: grid; place-items: center; width: 44px; border-radius: 12px;
      background: var(--accent-soft); border: 1px solid rgba(124, 108, 255, 0.35); color: var(--accent);
    }
    .cmdrow button svg { width: 15px; height: 15px; }

    .hintline { margin-top: 11px; font-size: 12px; color: var(--faint); }
    .hintline b { color: var(--text); }
    .home-head { font-size: 12px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase;
      color: var(--faint); margin: 22px 2px 10px; }

    /* ---------- control-panel sheet ---------- */
    .sheet-bg { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.55);
      backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); animation: fade .2s; }
    @keyframes fade { from { opacity: 0; } }
    .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-height: 92dvh;
      background: var(--bg); border-top-left-radius: 22px; border-top-right-radius: 22px;
      border-top: 1px solid var(--line-strong); box-shadow: 0 -20px 60px rgba(0,0,0,.6);
      display: flex; flex-direction: column; animation: slideup .26s cubic-bezier(.22,1,.36,1);
      max-width: 540px; margin: 0 auto; }
    @keyframes slideup { from { transform: translateY(100%); } }
    .sheet-grip { width: 38px; height: 4px; border-radius: 99px; background: var(--line-strong); margin: 9px auto 4px; flex: none; }
    .sheet-top { display: flex; align-items: center; gap: 10px; padding: 4px 16px 12px; border-bottom: 1px solid var(--line); }
    .sheet-top .tile { width: 38px; height: 38px; border-radius: 11px; font-size: 16px; }
    .sheet-top .nm { font-weight: 750; font-size: 16px; }
    .sheet-top .sub { font-size: 12px; color: var(--faint); }
    .sheet-tabs { display: flex; gap: 4px; padding: 10px 12px; overflow-x: auto; border-bottom: 1px solid var(--line); flex: none; }
    .sheet-tabs button { flex: none; padding: 8px 14px; border-radius: 10px; font-size: 13px; font-weight: 650; color: var(--dim); white-space: nowrap; }
    .sheet-tabs button.on { background: var(--accent-soft); color: var(--accent); }
    .sheet-body { padding: 16px; overflow-y: auto; flex: 1; }
    .frow { margin-bottom: 15px; }
    .frow label { display: block; font-size: 12px; font-weight: 650; color: var(--faint); margin-bottom: 6px; }
    .frow input, .frow select { width: 100%; padding: 11px 12px; border-radius: 11px; background: var(--card-2);
      border: 1px solid var(--line); color: var(--text); outline: none; }
    .frow input:focus, .frow select:focus { border-color: var(--accent); }
    .frow .hint2 { font-size: 11.5px; color: var(--faint); margin-top: 5px; }
    .frow.check { display: flex; align-items: center; gap: 10px; }
    .frow.check input { width: auto; }
    .frow.check label { margin: 0; color: var(--text); font-size: 13.5px; font-weight: 500; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .rateseg { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .rateseg .seg { display: inline-flex; background: var(--card-2); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
    .rateseg .seg button { padding: 8px 11px; font-size: 12.5px; color: var(--dim); }
    .rateseg .seg button.on { background: var(--accent-soft); color: var(--accent); }
    .rateseg input { width: 72px; }
    .savebar { position: sticky; bottom: -16px; margin: 8px -16px -16px; padding: 12px 16px calc(14px + env(safe-area-inset-bottom));
      background: linear-gradient(transparent, var(--bg) 30%); display: flex; gap: 10px; align-items: center; }
    .savebar .cta { flex: 1; padding: 13px; }
    .plister .prow { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
    .plister .prow:first-child { border-top: 0; }
    .plister .pn { font-weight: 650; }
    .plister .pm { font-size: 12px; color: var(--faint); }
    .minibtn { padding: 7px 12px; border-radius: 9px; font-size: 12.5px; font-weight: 650; border: 1px solid var(--line-strong); background: var(--card-2); color: var(--text); }
    .minibtn.red { color: var(--red); border-color: rgba(251,113,133,.35); background: var(--red-soft); }
    .searchbar { display: flex; align-items: center; gap: 9px; padding: 10px 12px; margin-bottom: 12px; border-radius: 12px; background: var(--card-2); border: 1px solid var(--line); }
    .searchbar input { flex: 1; background: none; border: 0; color: var(--text); outline: none; }
    .searchbar svg { width: 15px; height: 15px; color: var(--faint); }
    .grouphead { font-size: 11px; font-weight: 700; letter-spacing: .4px; text-transform: uppercase; color: var(--faint); margin: 16px 0 8px; }
    .loadrow { text-align: center; color: var(--faint); padding: 28px 0; font-size: 13px; }

    /* ---------- skeletons / empty / toasts ---------- */
    .skel { height: 132px; border-radius: var(--radius); margin-bottom: 14px; border: 1px solid var(--line);
      background: linear-gradient(100deg, var(--card) 40%, var(--card-2) 50%, var(--card) 60%);
      background-size: 200% 100%; animation: shimmer 1.4s infinite linear; }
    @keyframes shimmer { to { background-position: -200% 0; } }
    .empty { text-align: center; padding: 60px 20px; color: var(--faint); }
    .empty .halo { margin: 0 auto 18px; width: 64px; height: 64px; }
    .empty .halo img { width: 64px; height: 64px; border-radius: 18px; }
    .empty b { display: block; color: var(--dim); font-size: 15px; margin-bottom: 6px; }
    #toasts { position: fixed; left: 0; right: 0; bottom: calc(18px + env(safe-area-inset-bottom)); z-index: 50;
      display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
    .toast {
      max-width: 86vw; padding: 11px 18px; border-radius: 99px; font-size: 13px; font-weight: 600;
      background: #1b1b24; color: var(--text); border: 1px solid var(--line-strong);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5); animation: rise 0.22s ease-out;
    }
    .toast.bad { border-color: rgba(251, 113, 133, 0.4); color: var(--red); }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
    @keyframes pulse { 50% { opacity: 0.35; } }
  </style>
</head>
<body>
  <div class="shell">
    <div class="top" id="topbar" hidden>
      <img src="../icon.png" alt="" />
      <div class="wordmark">ELauncher <span>Remote</span></div>
      <div class="live"><span class="dot"></span>live</div>
      <button class="iconbtn" id="bell" title="Enable notifications" aria-label="Notifications" hidden>
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      </button>
      <button class="iconbtn" id="signout" title="Sign out" aria-label="Sign out">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>

    <div class="login" id="login" hidden>

    <div id="app" hidden>

    <div style="text-align:center;margin-top:26px">
      <a href="https://github.com/sponsors/Enderappsrepo" target="_blank" rel="noreferrer"

    </div>
  </div>
  <div id="sheet"></div>
  <div id="toasts"></div>

      users: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
      clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>',
      chipIc: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><line x1="9" y1="1" x2="9" y2="4"/><line x1="15" y1="1" x2="15" y2="4"/><line x1="9" y1="20" x2="9" y2="23"/><line x1="15" y1="20" x2="15" y2="23"/><line x1="20" y1="9" x2="23" y2="9"/><line x1="20" y1="14" x2="23" y2="14"/><line x1="1" y1="9" x2="4" y2="9"/><line x1="1" y1="14" x2="4" y2="14"/></svg>',
      tag: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>',
      sliders: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>',
      x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>'
    }

    function toast(message, bad = false) {
      const el = document.createElement('div')
      el.className = `toast${bad ? ' bad' : ''}`
      el.textContent = message
      $('toasts').appendChild(el)
      setTimeout(() => el.remove(), 2600)
    }

    const hueOf = (id) => [...String(id)].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7) % 360
    const gradOf = (id) => {
      const h = hueOf(id)
      return `linear-gradient(135deg, hsl(${h} 68% 55%), hsl(${(h + 46) % 360} 74% 45%))`
    }

    function fmtUptime(ms) {
      const m = Math.floor(ms / 60_000)
      const h = Math.floor(m / 60)
      const d = Math.floor(h / 24)
      return d > 0 ? `${d}d ${h % 24}h` : h > 0 ? `${h}h ${m % 60}m` : `${Math.max(0, m)}m`
    }

    /** serverId -> owning account (yours, or the friend who shared it with you) */
    const ownerOf = new Map()

    async function queue(serverId, action, payload = '') {
      const { error } = await supabase.from('server_commands').insert({
        server_id: serverId, owner_id: ownerOf.get(serverId) ?? me, sender_id: me, sender_name: myName, action, payload
      })
      if (error) throw new Error(error.message)
    }

    async function fetchServers() {
      // your servers + servers other people shared with you (Access tab in the launcher)
      const [mineRes, sharesRes] = await Promise.all([
        supabase.from('server_status').select('*').eq('owner_id', me),
        supabase.from('server_shares').select('server_id, server_name, owner_id').eq('grantee_id', me)
      ])
      if (mineRes.error) throw new Error(mineRes.error.message)
      const mine = (mineRes.data ?? []).map((row) => ({ ...row, _owner: null }))
      mine.forEach((row) => ownerOf.set(row.server_id, me))

      const shares = sharesRes.error ? [] : (sharesRes.data ?? [])
      let shared = []
      if (shares.length) {
        const ids = shares.map((s) => s.server_id)
        const ownerIds = [...new Set(shares.map((s) => s.owner_id))]
        const [stRes, ownersRes] = await Promise.all([
          supabase.from('server_status').select('*').in('server_id', ids),
          supabase.from('profiles').select('id, username').in('id', ownerIds)
        ])
        const stMap = new Map((stRes.data ?? []).map((row) => [row.server_id, row]))
        const names = new Map((ownersRes.data ?? []).map((p) => [p.id, p.username]))
        const mineIds = new Set(mine.map((row) => row.server_id))
        shared = shares
          .filter((s) => !mineIds.has(s.server_id))
          .map((s) => {
            ownerOf.set(s.server_id, s.owner_id)
            const st = stMap.get(s.server_id)
            return {
              ...(st ?? { server_id: s.server_id, name: s.server_name, state: 'stopped', players: [], console: '', updated_at: '' }),
              name: (st && st.name) || s.server_name,
              _owner: names.get(s.owner_id) ?? 'friend'
            }
          })
      }
      return [...mine, ...shared].sort((a, b) => (a.name || '').localeCompare(b.name || ''))
    }

    async function waitForState(serverId, wanted, timeoutMs) {
      const until = Date.now() + timeoutMs
      while (Date.now() < until) {
        await new Promise((r) => setTimeout(r, 4000))
        const rows = await fetchServers().catch(() => [])
        const row = rows.find((r) => r.server_id === serverId)
        if (row && row.state === wanted) return true
      }
      return false
    }

    window.act = async (serverId, action) => {
      if ((action === 'stop' || action === 'restart') && !confirm(`${action === 'stop' ? 'Stop' : 'Restart'} this server?`)) return
      try {
        if (action === 'restart') {
          restarting.add(serverId)
          render(await fetchServers().catch(() => []))
          toast('Restarting — saving and stopping first…')
          await queue(serverId, 'stop')
          if (await waitForState(serverId, 'stopped', 120_000)) {
            await queue(serverId, 'start')
            toast('Starting back up')
          } else toast('The server did not stop in time', true)
          restarting.delete(serverId)
        } else {
          await queue(serverId, action)
          toast(action === 'start' ? 'Start request sent' : 'Stop request sent')
        }
        void refresh()
      } catch (e) {
        restarting.delete(serverId)
        toast(e.message ?? 'Command failed', true)
      }
    }

    window.sendCmd = async (serverId, inputId) => {
      const input = $(inputId)
      const value = input.value.trim()
      if (!value) return
      try {
        await queue(serverId, 'command', value)
        input.value = ''
        toast('Command sent')
      } catch (e) {
        toast(e.message ?? 'Command failed', true)
      }
    }

    window.copyAddr = (address) => {
      navigator.clipboard?.writeText(address).then(
        () => toast('Address copied'),
        () => toast('Could not copy', true)
      )
    }

    window.toggleConsole = (serverId) => {
      if (openConsoles.has(serverId)) openConsoles.delete(serverId)
      else openConsoles.add(serverId)
      const con = $(`con-${serverId}`)
      const row = $(`cmdw-${serverId}`)
      const btn = $(`conbtn-${serverId}`)
      const open = openConsoles.has(serverId)
      con?.classList.toggle('open', open)
      row?.classList.toggle('open', open)
      btn?.classList.toggle('open', open)
      if (open && con) con.scrollTop = con.scrollHeight
    }

    function pill(icon, html) {
      return `<span class="pill">${icon}<span>${html}</span></span>`
    }

    function render(rows) {
      const wrap = $('servers')
      rowsById.clear()
      rows.forEach((r) => rowsById.set(r.server_id, r))
      if (!rows.length) {
        wrap.innerHTML = `<div class="empty">
          <div class="halo"><img src="../icon.png" alt="" /></div>
          <b>No servers yet</b>
          Open ELauncher on your PC — its servers appear here automatically.
        </div>`
        return
      }
      wrap.innerHTML = rows.map((row) => {
        const fresh = Date.now() - new Date(row.updated_at).getTime() < HEARTBEAT_MS * 4
        const state = fresh ? row.state : 'offline'
        const busy = restarting.has(row.server_id)
        const running = state === 'running'
        const transit = state === 'starting' || state === 'stopping'
        const stClass = running ? 'on' : transit ? 'warm' : state === 'offline' ? 'dead' : ''
        const chipText = running ? 'Online' : state === 'starting' ? 'Starting…' : state === 'stopping' ? 'Stopping…' : state === 'offline' ? 'PC offline' : 'Stopped'
        const players = fresh ? (row.players ?? []) : []
        const line = state === 'offline'
          ? 'Open ELauncher on your PC to reconnect'
          : running
            ? (players.length ? `${players.length} playing — ${players.join(', ')}` : 'Online — nobody on yet')
            : state === 'stopped' ? 'Ready when you are' : 'Working on it…'

        const pills = []
        if (row._owner) pills.push(pill(icons.users, `${esc(row._owner)}&#8217;s PC`))
        if (fresh && row.started_at && running) pills.push(pill(icons.clock, `<b>${fmtUptime(Date.now() - new Date(row.started_at).getTime())}</b>`))
        if (fresh && row.memory_mb != null && running) pills.push(pill(icons.chipIc, `<b>${(row.memory_mb / 1024).toFixed(1)} GB</b>${row.cpu_percent != null ? ` · ${row.cpu_percent}%` : ''}`))
        if (fresh && running) pills.push(pill(icons.users, `<b>${players.length}</b> online`))
        if (row.version) pills.push(pill(icons.tag, esc(row.version)))

        const addr = fresh && row.address
          ? `<button class="addr" onclick="copyAddr('${esc(row.address)}')">${icons.globe}<span class="a">${esc(row.address)}</span><span class="c">tap to copy</span></button>`
          : ''

        const acts = state === 'offline'
          ? ''
          : running || transit
            ? `<div class="acts">
                <button class="btn stop" onclick="act('${row.server_id}','stop')" ${busy || transit ? 'disabled' : ''}>${icons.stop} Stop</button>
                <button class="btn" onclick="act('${row.server_id}','restart')" ${busy || transit ? 'disabled' : ''}>${icons.redo} ${busy ? 'Restarting…' : 'Restart'}</button>
              </div>`
            : `<div class="acts single">
                <button class="btn start" onclick="act('${row.server_id}','start')" ${busy ? 'disabled' : ''}>${icons.play} Start server</button>
              </div>`

        const manage = state === 'offline' ? '' :
          `<button class="conbtn" onclick="openSheet('${row.server_id}')">${icons.sliders} Open control panel</button>`

        return `<div class="card${state === 'offline' ? ' offline' : ''}">
          <div class="head">
            <div class="tile" style="background:${gradOf(row.server_id)}">${esc((row.name || '?').charAt(0).toUpperCase())}<span class="st ${stClass}"></span></div>
            <div class="who">
              <div class="nm">${esc(row.name || 'Server')}</div>
              <div class="ln">${esc(line)}</div>
            </div>
            <span class="chip ${stClass}">${chipText}</span>
          </div>
          ${pills.length ? `<div class="pills">${pills.join('')}</div>` : ''}
          ${addr}
          ${acts}
          ${manage}
        </div>`
      }).join('')

      for (const id of openConsoles) {
        const con = $(`con-${id}`)
        if (con) con.scrollTop = con.scrollHeight
      }
    }

    // design/debug hook: paints mock cards without auth (read-only UI, commands stay gated)
    window.__renderPreview = (rows) => {
      $('login').hidden = true
      $('topbar').hidden = false
      $('app').hidden = false
      render(rows)
    }
    window.__previewHosting = (html) => {
      $('login').hidden = true
      $('topbar').hidden = false
      $('app').hidden = false
      $('hosting').innerHTML = html
    }

    // ---------- control-panel sheet (settings, players, automation over the relay) ----------
    const rowsById = new Map()
    let sheetId = null, sheetInfo = null, sheetTab = 'console', dirty = {}

    // two-way request: queue it, wait for the launcher to answer
    async function request(serverId, action, params = {}, timeoutMs = 22000) {
      const ownerId = ownerOf.get(serverId) ?? me
      const { data, error } = await supabase.from('server_requests')
        .insert({ server_id: serverId, owner_id: ownerId, requester_id: me, action, params }).select('id').single()
      if (error) throw new Error(error.message)
      const until = Date.now() + timeoutMs
      while (Date.now() < until) {
        await new Promise((r) => setTimeout(r, 1200))
        const { data: row } = await supabase.from('server_requests').select('done,response,error').eq('id', data.id).maybeSingle()
        if (row?.done) {
          if (row.error) throw new Error(row.error)
          return row.response
        }
      }
      throw new Error('The PC did not answer — is the launcher running?')
    }

    const PAL_ENUMS = {
      Difficulty: ['None', 'Casual', 'Normal', 'Hard'],
      DeathPenalty: ['None', 'Item', 'ItemAndEquipment', 'All']
    }
    const PAL_ESS = [
      ['ServerName', 'Server name', 'text'], ['ServerDescription', 'Description', 'text'],
      ['ServerPassword', 'Join password', 'text'], ['ServerPlayerMaxNum', 'Max players', 'num'],
      ['Difficulty', 'Difficulty', 'enum'], ['DeathPenalty', 'Death penalty', 'enum'],
      ['ExpRate', 'XP rate', 'num'], ['PalCaptureRate', 'Capture rate', 'num'],
      ['DayTimeSpeedRate', 'Day speed', 'num'], ['NightTimeSpeedRate', 'Night speed', 'num'],
      ['bEnablePlayerToPlayerDamage', 'PvP damage', 'bool'], ['bEnableInvaderEnemy', 'Raids', 'bool']
    ]
    const MC_ENUMS = { gamemode: ['survival', 'creative', 'adventure'], difficulty: ['peaceful', 'easy', 'normal', 'hard'] }
    const MC_ESS = [
      ['motd', 'MOTD', 'text'], ['max-players', 'Max players', 'num'], ['gamemode', 'Game mode', 'enum'],
      ['difficulty', 'Difficulty', 'enum'], ['view-distance', 'View distance', 'num'],
      ['pvp', 'PvP', 'bool'], ['white-list', 'Whitelist only', 'bool']
    ]
    const isPal = () => sheetInfo?.game === 'palworld'
    const boolTrue = (v) => /^true$/i.test(v)
    const boolStr = (on) => (isPal() ? (on ? 'True' : 'False') : (on ? 'true' : 'false'))

    window.openSheet = async (serverId) => {
      sheetId = serverId; sheetTab = 'console'; dirty = {}; sheetInfo = null
      paintSheet('<div class="loadrow">Loading control panel…</div>')
      try { sheetInfo = await request(serverId, 'info') } catch (e) { toast(e.message, true); return closeSheet() }
      renderTab()
    }
    window.closeSheet = () => { sheetId = null; $('sheet').innerHTML = '' }
    window.sheetGo = (tab) => { if (Object.keys(dirty).length && !confirm('Discard unsaved changes?')) return; sheetTab = tab; dirty = {}; renderTab() }
    window.setDirty = (k, v) => { dirty[k] = v }

    function paintSheet(bodyHtml) {
      const row = rowsById.get(sheetId) || {}
      const tabs = ['console', 'settings', isPal() ? 'players' : 'players', 'automation']
      const label = { console: 'Console', settings: 'Settings', players: 'Players', automation: 'Automation' }
      $('sheet').innerHTML = `<div class="sheet-bg" onclick="closeSheet()"></div>
        <div class="sheet">
          <div class="sheet-grip"></div>
          <div class="sheet-top">
            <div class="tile" style="background:${gradOf(sheetId)}">${esc((row.name || '?').charAt(0).toUpperCase())}</div>
            <div style="flex:1;min-width:0"><div class="nm">${esc(row.name || 'Server')}</div>
              <div class="sub">${sheetInfo ? (isPal() ? 'Palworld' : 'Minecraft ' + esc(sheetInfo.minecraftVersion || '')) + ' · port ' + sheetInfo.port : ''}</div></div>
            <button class="iconbtn" onclick="closeSheet()">${icons.x}</button>
          </div>
          <div class="sheet-tabs">${tabs.map((t) => `<button class="${t === sheetTab ? 'on' : ''}" onclick="sheetGo('${t}')">${label[t]}</button>`).join('')}</div>
          <div class="sheet-body" id="sheetBody">${bodyHtml}</div>
        </div>`
    }

    async function renderTab() {
      paintSheet('<div class="loadrow">Loading…</div>')
      const body = $('sheetBody')
      try {
        if (sheetTab === 'console') return renderConsole(body)
        if (sheetTab === 'settings') return renderSettings(body, await request(sheetId, 'getProps'))
        if (sheetTab === 'players') return isPal() ? renderPalPlayers(body, await request(sheetId, 'players')) : renderMcPlayers(body)
        if (sheetTab === 'automation') return renderAutomation(body, sheetInfo.automation || {})
      } catch (e) {
        body.innerHTML = `<div class="loadrow" style="color:var(--red)">${esc(e.message)}</div>`
      }
    }

    function renderConsole(body) {
      const row = rowsById.get(sheetId) || {}
      const running = row.state === 'running'
      body.innerHTML = `<div class="console open" style="max-height:46dvh">${esc(row.console || 'No output yet.')}</div>
        <div class="cmdrow open" style="margin-top:10px">
          <input id="sheetCmd" placeholder="${running ? 'say hi · save · kick <id>' : 'start the server to send commands'}" ${running ? '' : 'disabled'}
            onkeydown="if(event.key==='Enter')sendCmd('${sheetId}','sheetCmd')" />
          <button onclick="sendCmd('${sheetId}','sheetCmd')" ${running ? '' : 'disabled'}>${icons.send}</button>
        </div>
        <div class="frow" style="margin-top:8px"><div class="hint2">The console refreshes every few seconds while this panel is open.</div></div>`
      const con = body.querySelector('.console'); if (con) con.scrollTop = con.scrollHeight
    }

    function ctrl(key, labelText, type, value, enums) {
      if (type === 'bool') {
        return `<div class="frow check"><input type="checkbox" id="f-${key}" ${boolTrue(value) ? 'checked' : ''}
          onchange="setDirty('${key}', this.checked ? '${boolStr(true)}' : '${boolStr(false)}')"><label for="f-${key}">${labelText}</label></div>`
      }
      let input
      if (type === 'enum') input = `<select onchange="setDirty('${key}', this.value)">${(enums || []).map((o) => `<option ${o === value ? 'selected' : ''}>${o}</option>`).join('')}</select>`
      else input = `<input type="${type === 'num' ? 'number' : 'text'}" step="any" value="${esc(String(value ?? ''))}" oninput="setDirty('${key}', this.value)">`
      return `<div class="frow"><label>${labelText}</label>${input}</div>`
    }

    function renderSettings(body, props) {
      const ess = isPal() ? PAL_ESS : MC_ESS
      const enums = isPal() ? PAL_ENUMS : MC_ENUMS
      const defaults = isPal() ? { ServerPlayerMaxNum: '16', ExpRate: '1', DeathPenalty: 'All' } : { 'max-players': '10', gamemode: 'survival', difficulty: 'normal', 'view-distance': '10' }
      const essKeys = new Set(ess.map((e) => e[0]))
      const essHtml = ess.map(([k, l, t]) => ctrl(k, l, t, props[k] ?? defaults[k] ?? (t === 'bool' ? boolStr(false) : ''), enums[k])).join('')
      const rest = Object.keys(props).filter((k) => !essKeys.has(k)).sort()
      body.innerHTML = `<div class="grouphead">Essentials</div>${essHtml}
        <div class="grouphead">All settings</div>
        <div class="searchbar">${icons.chipIc}<input id="setSearch" placeholder="Search settings…" oninput="filterSettings(this.value)"></div>
        <div id="allSettings">${rest.map((k) => {
          const v = props[k]; const t = /^(true|false)$/i.test(v) ? 'bool' : (/^-?\d+(\.\d+)?$/.test(v) ? 'num' : 'text')
          return `<div class="setwrap" data-k="${esc(k.toLowerCase())}">${ctrl(k, k, t, v, null)}</div>`
        }).join('')}</div>
        <div class="savebar"><button class="cta" onclick="saveSettings()">Save settings</button></div>`
    }
    window.filterSettings = (q) => {
      q = q.trim().toLowerCase()
      document.querySelectorAll('#allSettings .setwrap').forEach((el) => { el.style.display = !q || el.dataset.k.includes(q) ? '' : 'none' })
    }
    window.saveSettings = async () => {
      if (!Object.keys(dirty).length) return toast('Nothing changed')
      try { await request(sheetId, 'setProps', { updates: dirty }); dirty = {}; toast('Saved — applies on next restart') }
      catch (e) { toast(e.message, true) }
    }

    function renderPalPlayers(body, players) {
      const list = players || []
      body.innerHTML = `<div class="grouphead">Online now (${list.length})</div>
        <div class="plister">${list.length ? list.map((p) => `<div class="prow">
          <div style="flex:1;min-width:0"><div class="pn">${esc(p.name)}</div><div class="pm">lvl ${p.level ?? '?'} · ${esc(p.userId || 'no id')}</div></div>
          <button class="minibtn" onclick="palMod('kick','${esc(p.userId || '')}','${esc(p.name)}')">Kick</button>
          <button class="minibtn red" onclick="palMod('ban','${esc(p.userId || '')}','${esc(p.name)}')">Ban</button>
        </div>`).join('') : '<div class="loadrow">Nobody online.</div>'}</div>
        <div class="grouphead">Broadcast</div>
        <div class="cmdrow open"><input id="palSay" placeholder="Message to everyone…"><button onclick="palSay()">${icons.send}</button></div>
        <div class="grouphead">Unban</div>
        <div class="cmdrow open"><input id="palUnban" placeholder="steam_7656…"><button class="minibtn" onclick="palUnban()">Unban</button></div>`
    }
    window.palMod = async (action, userId, name) => {
      if (!userId) return toast('No platform id yet — try again in a moment', true)
      if (!confirm(`${action === 'ban' ? 'Ban' : 'Kick'} ${name}?`)) return
      try { await request(sheetId, 'moderate', { action, target: userId }); toast(`${name} ${action === 'ban' ? 'banned' : 'kicked'}`); renderTab() }
      catch (e) { toast(e.message, true) }
    }
    window.palSay = async () => {
      const m = $('palSay').value.trim(); if (!m) return
      try { await request(sheetId, 'moderate', { action: 'announce', target: m }); $('palSay').value = ''; toast('Broadcast sent') } catch (e) { toast(e.message, true) }
    }
    window.palUnban = async () => {
      const id = $('palUnban').value.trim(); if (!id) return
      try { await request(sheetId, 'moderate', { action: 'unban', target: id }); $('palUnban').value = ''; toast('Unbanned ' + id) } catch (e) { toast(e.message, true) }
    }

    function renderMcPlayers(body) {
      const row = rowsById.get(sheetId) || {}
      const online = (row.players || [])
      body.innerHTML = `<div class="grouphead">Online now (${online.length})</div>
        <div class="plister">${online.length ? online.map((n) => `<div class="prow"><div class="pn" style="flex:1">${esc(n)}</div>
          <button class="minibtn" onclick="mcCmd('kick ${esc(n)}')">Kick</button>
          <button class="minibtn" onclick="mcCmd('op ${esc(n)}')">Op</button>
          <button class="minibtn red" onclick="mcCmd('ban ${esc(n)}')">Ban</button></div>`).join('') : '<div class="loadrow">Nobody online.</div>'}</div>
        <div class="grouphead">Whitelist</div>
        <div class="cmdrow open"><input id="mcWl" placeholder="PlayerName"><button class="minibtn" onclick="mcCmd('whitelist add '+document.getElementById('mcWl').value.trim())">Add</button></div>
        <div class="frow"><div class="hint2">Runs the matching server command. The server must be online.</div></div>`
    }
    window.mcCmd = async (cmd) => {
      if (!cmd.trim()) return
      try { await queue(sheetId, 'command', cmd); toast('Command sent') } catch (e) { toast(e.message, true) }
    }

    function autoRow(html) { return `<div class="frow">${html}</div>` }
    function renderAutomation(body, a) {
      const sel = (key, opts, val) => `<select onchange="setAuto('${key}', this.value)">${opts.map(([v, l]) => `<option value="${v}" ${String(val) === v ? 'selected' : ''}>${l}</option>`).join('')}</select>`
      window.__auto = { ...a }
      window.setAuto = (k, v) => { window.__auto[k] = k === 'restartMode' || k === 'restartDailyAt' ? v : Number(v); }
      window.setAutoBool = (k, v) => { window.__auto[k] = v }
      body.innerHTML = `
        <div class="frow"><label>Auto-save world</label>${sel('saveIntervalMin', [['0', 'Off'], ['5', 'Every 5 min'], ['10', 'Every 10 min'], ['15', 'Every 15 min'], ['30', 'Every 30 min'], ['60', 'Every hour']], a.saveIntervalMin || 0)}</div>
        <div class="frow"><label>Scheduled restart</label>${sel('restartMode', [['off', 'Off'], ['interval', 'Every N hours'], ['daily', 'Daily at a time']], a.restartMode || 'off')}</div>
        <div class="grid2">
          <div class="frow"><label>Restart every (hours)</label><input type="number" value="${a.restartEveryHours || 6}" oninput="setAuto('restartEveryHours', this.value)"></div>
          <div class="frow"><label>Daily time</label><input type="time" value="${a.restartDailyAt || '04:00'}" onchange="setAuto('restartDailyAt', this.value)"></div>
        </div>
        <div class="frow"><label>Warn players (min)</label><input type="number" value="${a.restartWarningMin ?? 5}" oninput="setAuto('restartWarningMin', this.value)"></div>
        <div class="frow"><label>World backups</label>${sel('backupIntervalHours', [['0', 'Off'], ['1', 'Hourly'], ['3', 'Every 3h'], ['6', 'Every 6h'], ['12', 'Every 12h'], ['24', 'Daily']], a.backupIntervalHours || 0)}</div>
        <div class="frow"><label>Restart above memory</label>${sel('restartAboveMemoryMB', [['0', 'Off'], ['4096', '4 GB'], ['8192', '8 GB'], ['12288', '12 GB'], ['16384', '16 GB']], a.restartAboveMemoryMB || 0)}</div>
        <div class="frow check"><input type="checkbox" id="a-crash" ${a.restartOnCrash ? 'checked' : ''} onchange="setAutoBool('restartOnCrash', this.checked)"><label for="a-crash">Restart automatically after a crash</label></div>
        <div class="frow check"><input type="checkbox" id="a-boot" ${a.autoStart ? 'checked' : ''} onchange="setAutoBool('autoStart', this.checked)"><label for="a-boot">Start with the launcher</label></div>
        <div class="savebar"><button class="cta" onclick="saveAuto()">Save automation</button></div>`
    }
    window.saveAuto = async () => {
      try { await request(sheetId, 'setAutomation', { automation: window.__auto }); sheetInfo.automation = window.__auto; toast('Automation saved') }
      catch (e) { toast(e.message, true) }
    }

    async function refresh() {
      if (!me || document.hidden) return
      try {
        render(await fetchServers())
        // keep an open console tab live without disturbing other tabs' edits
        if (sheetId && sheetTab === 'console') {
          const con = document.querySelector('#sheetBody .console')
          if (con) {
            const stick = con.scrollHeight - con.scrollTop - con.clientHeight < 40
            con.textContent = (rowsById.get(sheetId) || {}).console || 'No output yet.'
            if (stick) con.scrollTop = con.scrollHeight
          }
        }
      } catch (e) {
        $('servers').innerHTML = `<div class="empty"><b>Could not reach the cloud</b>${esc(e.message)}</div>`
      }
    }

    /** "PC as a host" card — the launcher publishes its specs + per-game report. */
    async function loadHostCard() {
      try {
        const { data } = await supabase.from('host_specs').select('report').eq('owner_id', me).maybeSingle()
        const report = data?.report
        if (!report?.specs) return
        const verdictChip = { great: ['on', 'Great'], good: ['acc', 'Good'], tight: ['warm', 'Tight'], no: ['dead', 'Not recommended'] }
        const rows = (report.games ?? []).map((g) => {
          const [cls, label] = verdictChip[g.verdict] ?? ['', g.verdict]
          return `<div class="row" style="gap:8px;padding:7px 0;border-top:1px solid var(--line)">
            <div style="flex:1;min-width:0">
              <div style="font-weight:650;font-size:13.5px">${esc(g.game)}</div>
              ${g.verdict !== 'no' ? `<div class="faint" style="font-size:12px">${esc(g.players)} players</div>` : ''}
            </div>
            <span class="chip ${cls}">${esc(label)}</span>
          </div>`
        }).join('')
        $('host').innerHTML = `<div class="card">
          <div class="row" style="gap:8px">
            <b style="font-size:14.5px;flex:1">Home PC as a host</b>
            <span class="pill">${esc(report.specs.cpuModel)} · ${esc(String(report.specs.ramGB))} GB · ${esc(report.specs.diskType)}</span>
          </div>
          ${rows}
        </div>`
      } catch {
        // card is optional — table may not be migrated yet
      }
    }

    // ---------- hosting: plans, orders, admin approval ----------
    let isAdmin = false
    const REF = () => 'ELH-' + Math.random().toString(36).slice(2, 7).toUpperCase()
    const money = (n, c) => `${c === 'USD' ? '$' : ''}${Number(n).toFixed(2)}${c === 'USD' ? '' : ' ' + c}`
    const STATUS_LABEL = {
      awaiting_payment: ['warm', 'Awaiting payment'], pending_review: ['warm', 'Payment under review'],
      active: ['on', 'Active'], past_due: ['dead', 'Past due'], rejected: ['dead', 'Rejected'], cancelled: ['', 'Cancelled']
    }

    window.orderPlan = async (planId) => {
      const name = (prompt('Name your server') || '').trim()
      if (!name) return
      const reference = REF()
      const { error } = await supabase.from('hosting_orders').insert({ user_id: me, plan_id: planId, server_name: name, reference })
      if (error) return toast(error.message, true)
      toast('Order created — follow the payment steps')
      void loadHosting()
    }
    window.markPaid = async (orderId) => {
      const { error } = await supabase.rpc('hosting_mark', { order_id: orderId, new_status: 'pending_review' })
      if (error) return toast(error.message, true)
      toast('Thanks — your payment is under review')
      void loadHosting()
    }
    window.cancelOrder = async (orderId) => {
      if (!confirm('Cancel this order?')) return
      await supabase.rpc('hosting_mark', { order_id: orderId, new_status: 'cancelled' })
      void loadHosting()
    }
    window.adminApprove = async (orderId) => {
      const days = parseInt(prompt('Approve for how many days?', '30') || '', 10)
      if (!days || days < 1) return
      const until = new Date(Date.now() + days * 86400000).toISOString()
      const { error } = await supabase.from('hosting_orders').update({ status: 'active', paid_until: until }).eq('id', orderId)
      if (error) return toast(error.message, true)
      toast('Approved — your launcher will provision it within a minute')
      void loadHosting()
    }
    window.adminReject = async (orderId) => {
      if (!confirm('Reject this order?')) return
      await supabase.from('hosting_orders').update({ status: 'rejected' }).eq('id', orderId)
      void loadHosting()
    }

    function payBlock(order, plan, settings) {
      if (!plan) return ''
      const memo = encodeURIComponent(order.reference)
      const pp = settings.paypal_me
        ? `https://paypal.me/${settings.paypal_me}/${plan.price_monthly}`
        : ''
      const links = []
      if (pp) links.push(`<a class="btn start" style="text-decoration:none" href="${pp}" target="_blank" rel="noreferrer">Pay ${money(plan.price_monthly, plan.currency)} with PayPal</a>`)
      if (plan.stripe_link) links.push(`<a class="btn" style="text-decoration:none" href="${esc(plan.stripe_link)}" target="_blank" rel="noreferrer">Pay by card</a>`)
      if (!links.length) return `<div class="hintline">Payment isn't set up yet — contact the host.</div>`
      return `<div class="hintline">Send exactly <b>${money(plan.price_monthly, plan.currency)}</b> and put your reference <b>${esc(order.reference)}</b> in the payment note.</div>
        <div class="acts">${links.join('')}</div>
        <div class="acts single"><button class="btn" onclick="markPaid('${order.id}')">I've paid — submit for review</button></div>`
    }

    async function loadHosting() {
      try {
        const [{ data: prof }, { data: plans }, { data: settings }, { data: myOrders }] = await Promise.all([
          supabase.from('profiles').select('is_admin').eq('id', me).maybeSingle(),
          supabase.from('hosting_plans').select('*').eq('active', true).order('sort'),
          supabase.from('hosting_settings').select('*').eq('id', 1).maybeSingle(),
          supabase.from('hosting_orders').select('*').order('created_at', { ascending: false })
        ])
        isAdmin = Boolean(prof?.is_admin)
        const planList = plans ?? []
        const planMap = new Map(planList.map((p) => [p.id, p]))
        const cfg = settings ?? { paypal_me: '' }
        const orders = (myOrders ?? []).filter((o) => o.user_id === me)
        let html = ''

        // customer: my orders
        const liveOrders = orders.filter((o) => o.status !== 'cancelled' && o.status !== 'rejected')
        if (liveOrders.length) {
          html += `<div class="home-head">Your hosting</div>`
          html += liveOrders.map((o) => {
            const plan = planMap.get(o.plan_id)
            const [cls, label] = STATUS_LABEL[o.status] ?? ['', o.status]
            const until = o.paid_until ? ` · renews ${new Date(o.paid_until).toLocaleDateString()}` : ''
            const pay = (o.status === 'awaiting_payment' || o.status === 'past_due') ? payBlock(o, plan, cfg) : ''
            const cancel = (o.status === 'awaiting_payment' || o.status === 'pending_review') ? `<button class="conbtn" onclick="cancelOrder('${o.id}')">Cancel order</button>` : ''
            return `<div class="card">
              <div class="head"><div class="who"><div class="nm">${esc(o.server_name)}</div><div class="ln">${plan ? esc(plan.name) : o.plan_id}${until}</div></div><span class="chip ${cls}">${label}</span></div>
              ${o.note ? `<div class="hintline" style="color:var(--red)">${esc(o.note)}</div>` : ''}
              ${pay}${cancel}
            </div>`
          }).join('')
        }

        // customer: order a new server
        if (planList.length) {
          html += `<div class="home-head">${liveOrders.length ? 'Add another server' : 'Get a game server'}</div>`
          html += `<div class="card">` + planList.map((p) => `
            <div class="head" style="padding:8px 0;border-top:1px solid var(--line)">
              <div class="who"><div class="nm">${esc(p.name)}</div><div class="ln">${p.game === 'palworld' ? 'Palworld' : 'Minecraft'} · ${p.max_players} players · ${(p.memory_mb/1024)} GB</div></div>
              <button class="btn start" style="width:auto;padding:9px 14px" onclick="orderPlan('${p.id}')">${money(p.price_monthly, p.currency)}/mo</button>
            </div>`).join('') + `</div>`
        }

        // admin: orders needing action
        if (isAdmin) {
          const queue = (myOrders ?? []).filter((o) => o.status === 'pending_review' || o.status === 'active' || o.status === 'past_due')
          html += `<div class="home-head">Admin · orders</div>`
          if (!cfg.paypal_me) html += `<div class="card"><div class="hintline" style="color:var(--amber)">Set your PayPal.me handle in Supabase → hosting_settings so customers can pay.</div></div>`
          html += queue.length ? queue.map((o) => {
            const plan = planMap.get(o.plan_id)
            const [cls, label] = STATUS_LABEL[o.status] ?? ['', o.status]
            const actions = o.status === 'pending_review'
              ? `<div class="acts"><button class="btn start" onclick="adminApprove('${o.id}')">Approve</button><button class="btn stop" onclick="adminReject('${o.id}')">Reject</button></div>`
              : o.status === 'past_due'
                ? `<div class="acts single"><button class="btn start" onclick="adminApprove('${o.id}')">Renew</button></div>`
                : ''
            return `<div class="card"><div class="head"><div class="who"><div class="nm">${esc(o.server_name)}</div><div class="ln">${plan ? esc(plan.name) : o.plan_id} · ref ${esc(o.reference)}</div></div><span class="chip ${cls}">${label}</span></div>${actions}</div>`
          }).join('') : `<div class="card"><div class="hintline">No orders waiting.</div></div>`
        }

        $('hosting').innerHTML = html
      } catch {
        // tables not migrated yet — hosting section stays empty
      }
    }

    async function enter(session) {
      me = session.user.id
      const { data } = await supabase.from('profiles').select('username').eq('id', me).maybeSingle()
      if (data?.username) myName = `${data.username} (phone)`
      $('login').hidden = true
      $('topbar').hidden = false
      $('app').hidden = false
      $('servers').innerHTML = '<div class="skel"></div><div class="skel"></div>'
      void refresh()
      void refreshBell()
      void loadHostCard()
      void loadHosting()
      clearInterval(timer)
      timer = setInterval(refresh, 8000)
    }

    let signupMode = false
    $('modeToggle').addEventListener('click', () => {
      signupMode = !signupMode
      $('userField').hidden = !signupMode
      $('loginBtn').textContent = signupMode ? 'Create account' : 'Sign in'
      $('modeToggle').textContent = signupMode ? 'Have an account? Sign in' : 'New here? Create an account'
    })

    $('loginBtn').addEventListener('click', async () => {
      $('loginErr').textContent = ''
      $('loginBtn').disabled = true
      const email = $('email').value.trim()
      const password = $('password').value
      if (signupMode) {
        const username = $('username').value.trim()
        if (!username) {
          $('loginBtn').disabled = false
          $('loginErr').textContent = 'Pick a username first.'
          return
        }
        const { data, error } = await supabase.auth.signUp({ email, password, options: { data: { username } } })
        $('loginBtn').disabled = false
        if (error) $('loginErr').textContent = error.message
        else if (data.session) void enter(data.session)
        else $('loginErr').textContent = 'Almost there — confirm the email we just sent, then sign in.'
        return
      }
      const { data, error } = await supabase.auth.signInWithPassword({ email, password })
      $('loginBtn').disabled = false
      if (error) $('loginErr').textContent = error.message
      else void enter(data.session)
    })
    $('password').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('loginBtn').click() })

    $('signout').addEventListener('click', async () => {
      await supabase.auth.signOut()
      location.reload()
    })

    // ---------- push notifications ----------
    function urlB64(base64) {
      const padding = '='.repeat((4 - (base64.length % 4)) % 4)
      const raw = atob((base64 + padding).replace(/-/g, '+').replace(/_/g, '/'))
      return Uint8Array.from([...raw].map((c) => c.charCodeAt(0)))
    }

    async function refreshBell() {
      if (!('serviceWorker' in navigator) || !('PushManager' in window) || !me) return
      const bell = $('bell')
      bell.hidden = false
      try {
        const reg = await navigator.serviceWorker.ready
        const sub = await reg.pushManager.getSubscription()
        bell.classList.toggle('on', Boolean(sub))
        bell.title = sub ? 'Notifications on — tap to turn off' : 'Enable notifications'
      } catch {}
    }

    $('bell').addEventListener('click', async () => {
      try {
        const reg = await navigator.serviceWorker.ready
        const existing = await reg.pushManager.getSubscription()
        if (existing) {
          await supabase.from('push_subscriptions').delete().eq('endpoint', existing.endpoint)
          await existing.unsubscribe()
          toast('Notifications off')
          return
        }
        const perm = await Notification.requestPermission()
        if (perm !== 'granted') return toast('Notifications were blocked by the browser', true)
        const { data: cfg } = await supabase.from('push_config').select('public_key').eq('owner_id', me).maybeSingle()
        if (!cfg) return toast('Open ELauncher on your PC once, then try again', true)
        const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlB64(cfg.public_key) })
        const { error } = await supabase.from('push_subscriptions').upsert(
          { owner_id: me, endpoint: sub.endpoint, subscription: sub.toJSON(), label: navigator.userAgent.slice(0, 120) },
          { onConflict: 'endpoint' }
        )
        if (error) throw new Error(error.message)
        toast('Notifications on — this phone gets server alerts')
      } catch (e) {
        toast(e.message ?? 'Could not enable notifications', true)
      } finally {
        void refreshBell()
      }
    })

    document.addEventListener('visibilitychange', () => { if (!document.hidden) void refresh() })

    // installable app shell (Android turns this into a real WebAPK on install)
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {})

    const { data: { session } } = await supabase.auth.getSession()
    if (session) void enter(session)
    else $('login').hidden = false
  </script>
</body>
</html>
