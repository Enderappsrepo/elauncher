    // two-way request: queue it, wait for the launcher to answer. Realtime settles
    // it the moment the PC replies; the poll only backstops clouds without realtime.
    const pendingReqs = new Map() // request id -> { resolve, reject }
    function settleRequest(row) {
      if (!row?.done) return
      const p = pendingReqs.get(row.id)
      if (!p) return
      pendingReqs.delete(row.id)
      if (row.error) p.reject(new Error(row.error))
      else p.resolve(row.response)
    }
    async function request(serverId, action, params = {}, timeoutMs = 22000) {
      // design/debug hook (same family as __renderPreview): lets every tab render offline
      if (window.__mockRelay && action in window.__mockRelay) {
        const mock = window.__mockRelay[action]
        return typeof mock === 'function' ? mock(params) : structuredClone(mock)
      }
      if (!serverId) throw new Error('No server selected — pick the server again and retry.')
      const ownerId = ownerOf.get(serverId) ?? me
      const { data, error } = await supabase.from('server_requests')
        .insert({ server_id: serverId, owner_id: ownerId, requester_id: me, action, params }).select('id').single()
      if (error) throw new Error(error.message)
      return await new Promise((resolve, reject) => {
        pendingReqs.set(data.id, { resolve, reject })
        const poll = async () => {
          if (!pendingReqs.has(data.id)) return
          const { data: row } = await supabase.from('server_requests').select('id,done,response,error').eq('id', data.id).maybeSingle()
          if (row?.done) return settleRequest(row)
          setTimeout(poll, rtLive ? 3000 : 1100)
        }
        setTimeout(poll, rtLive ? 2600 : 900)
        setTimeout(() => {
          if (pendingReqs.delete(data.id)) reject(new Error('The PC did not answer — is the launcher running?'))
        }, timeoutMs)
      })
    }

    // per-server info cache: reopening a control panel is instant; freshness heals in the background
    const infoCache = new Map()
    async function loadInfo(serverId) {
      const cached = infoCache.get(serverId)
      if (cached) {
        void request(serverId, 'info').then((i) => infoCache.set(serverId, i)).catch(() => {})

      const info = await request(serverId, 'info')
      infoCache.set(serverId, info)
      return info

    const canManage = (serverId) => isAdmin || ownerOf.get(serverId) === me
    const boolTrue = (v) => /^true$/i.test(v)
    const boolStr = (on) => (isPal() ? (on ? 'True' : 'False') : (on ? 'true' : 'false'))

    window.setDirty = (k, v) => { dirty[k] = v }

    const isModdable = () => sheetInfo && sheetInfo.game === 'minecraft' && ['paper', 'fabric', 'forge', 'neoforge'].includes(sheetInfo.kind)
    // Access is the one tab that isn't about the game: it's there for whoever can
    // hand this panel to someone else — the host, an admin, or the customer whose
    // server it is. The host decides that (info.canShare); a friend they invited
    // simply never sees the tab.
    const tabList = () => ['overview', 'console', 'settings', 'players', ...(isModdable() ? ['mods'] : []), 'files', 'network', 'automation', ...(sheetInfo?.canShare ? ['access'] : [])]
    const tabLabels = () => ({ overview: 'Overview', console: 'Console', settings: 'Settings', players: 'Players', mods: sheetInfo?.kind === 'paper' ? 'Plugins' : 'Mods', files: 'Files', network: 'Network', automation: 'Automation', access: 'Access' })
    const tabIcons = () => ({ overview: icons.sliders, console: icons.term, settings: icons.sliders, players: icons.users, mods: icons.puzzle, files: icons.folder, network: icons.globe, automation: icons.zap, access: icons.shield })
    // shared by the mobile modal and the desktop detail pane
    async function runTab(body) {
      body.innerHTML = '<div class="loadrow">Loading…</div>'
      try {
        if (sheetTab === 'overview') return renderOverview(body)
        if (sheetTab === 'console') return renderConsole(body)
        if (sheetTab === 'settings') return renderSettings(body, await request(sheetId, 'getProps'))
        if (sheetTab === 'players') {
          if (isPal()) return renderPalPlayers(body, await request(sheetId, 'players'))
          if (sheetInfo.game === 'valheim' || sheetInfo.game === 'sdtd') return renderSteamPlayers(body)
          return renderMcPlayers(body)
        }
        if (sheetTab === 'mods') return renderMods(body, await request(sheetId, 'mods'))
        if (sheetTab === 'files') return renderFiles(body)
        if (sheetTab === 'network') return renderNetwork(body, await request(sheetId, 'ports'))
        if (sheetTab === 'automation') return renderAutomation(body, sheetInfo.automation || {})
        if (sheetTab === 'access') return renderAccess(body, await request(sheetId, 'shares'))
      } catch (e) {
        body.innerHTML = `<div class="loadrow" style="color:var(--red)">${esc(e.message)}</div>`
      }
    }
    /** One destination now — the detail pane, at every breakpoint. */
    async function renderTab() {
      return renderDetail()
    }

    // ---------- overview ----------
    // The landing tab for a server. Console was the old default, which is right
    // for a running server and wrong for a stopped one — you'd open it to a wall
    // of the last crash. This adapts to what the server is actually doing.

    /** Last contiguous ERROR block in the buffer, for the crash card. */
    function lastErrorBlock(raw) {
      const lines = String(raw ?? '').split('\n')
      let end = -1
      for (let i = lines.length - 1; i >= 0; i--) {
        if (/\b(ERROR|SEVERE|FATAL)\b/.test(lines[i]) || /^(Caused by|\s+at [\w.$])/.test(lines[i])) { end = i; break }
      }
      if (end === -1) return null
      let start = end
      while (start > 0 && (/\b(ERROR|SEVERE|FATAL)\b/.test(lines[start - 1]) || /^(Caused by|\s+at [\w.$])/.test(lines[start - 1]))) start--
      return lines.slice(start, end + 1).join('\n').trim() || null
    }

    /** Tail of the console as plain rows, for the preview card. */
    function consolePreview(raw, count) {
      const lines = String(raw ?? '').split('\n').filter((l) => l.trim()).slice(-count)
      if (!lines.length) return '<div class="ov-empty">No output yet.</div>'
      let prev = null
      return lines.map((l) => { const p = parseLine(l, prev); prev = p; return conLineHtml({ ...p, count: 1 }) }).join('')
    }

    window.ovBackup = async (id) => {
      const btn = $('ovBackupBtn')
      if (btn) { btn.disabled = true; btn.textContent = 'Backing up…' }
      try {
        const res = await request(id, 'backups', { op: 'make' })
        toast(`World backed up (${res.stamp})`)
      } catch (e) {
        toast(e.message, true)
      } finally {
        if (btn) { btn.disabled = false; btn.textContent = 'Back up now' }
      }
    }
    window.ovCopyReport = (id) => {
      const row = rowsById.get(id) || {}
      const block = lastErrorBlock(row.console) || ''
      const header = [
        `ELauncher server report`,
        `server: ${row.name || id}`,
        sheetInfo ? `game: ${gameLabel(sheetInfo.game)}${sheetInfo.game === 'minecraft' ? ` ${sheetInfo.kind} ${sheetInfo.minecraftVersion || ''}` : ''}` : '',
        `state: ${row.state || 'unknown'}`,
        ''
      ].filter(Boolean).join('\n')
      navigator.clipboard.writeText(header + block).then(
        () => toast('Report copied'),
        () => toast('Could not copy', true)
      )
    }

    function renderOverview(body) {
      const row = rowsById.get(sheetId) || {}
      const fresh = Date.now() - new Date(row.updated_at).getTime() < HEARTBEAT_MS * 4
      const running = fresh && row.state === 'running'
      const starting = fresh && row.state === 'starting'
      const stopped = fresh && row.state === 'stopped'
      const players = running ? (row.players ?? []) : []
      const crash = stopped ? lastErrorBlock(row.console) : null

      // a stopped server's console is the tail of its LAST run — say so, rather
      // than letting it read as current output
      const previewTitle = running || starting ? 'Live output' : 'Last run'
      const quick = [
        `<button class="ov-act" onclick="goTab('console')">${icons.term}<b>Open console</b><i>Full log and commands</i></button>`,
        `<button class="ov-act" onclick="goTab('files')">${icons.folder}<b>Browse files</b><i>Configs, logs, worlds</i></button>`,
        isModdable() ? `<button class="ov-act" onclick="goTab('mods')">${icons.puzzle}<b>Manage ${sheetInfo?.kind === 'paper' ? 'plugins' : 'mods'}</b><i>Install and remove</i></button>` : '',
        `<button class="ov-act" onclick="goTab('automation')">${icons.zap}<b>Automation</b><i>Restarts and backups</i></button>`,
        `<button class="ov-act" id="ovBackupBtn" onclick="ovBackup('${sheetId}')">${icons.clock}<b>Back up now</b><i>Copy the world aside</i></button>`
      ].filter(Boolean).join('')

      body.innerHTML = `
        ${crash ? `<div class="ov-crash">
          <div class="ov-crash-head">${icons.zap}<b>This server stopped after an error</b></div>
          <pre class="ov-crash-log">${esc(crash.split('\n').slice(0, 6).join('\n'))}</pre>
          <div class="ov-crash-acts">
            <button class="dbtn start" onclick="act('${sheetId}','start')">${icons.play} Start again</button>
            <button class="dbtn" onclick="ovCopyReport('${sheetId}')">Copy report</button>
            <button class="dbtn" onclick="goTab('console')">See full log</button>
          </div>
        </div>` : ''}

        <div class="ov-grid">
          <div class="ov-card">
            <div class="ov-head">${previewTitle}<button class="ov-more" onclick="goTab('console')">Open console ${icons.chev}</button></div>
            <div class="ov-console con-log" style="max-height:210px">${consolePreview(row.console, 8)}</div>
          </div>

          <div class="ov-card">
            <div class="ov-head">Who's on</div>
            ${running
              ? (players.length
                ? `<div class="ov-players">${players.map((p) => `<span class="ov-player"><span class="ov-av" style="background:${gradOf(p)}">${esc(p.charAt(0).toUpperCase())}</span>${esc(p)}</span>`).join('')}</div>`
                : `<div class="ov-empty">Online, but nobody has joined yet.</div>`)
              : `<div class="ov-empty">${starting ? 'Still starting up.' : !fresh ? 'The hosting PC is offline.' : 'The server is stopped.'}</div>`}
          </div>
        </div>

        <div class="grouphead">Quick actions</div>
        <div class="ov-acts">${quick}</div>`
    }

    // ---------- console ----------
    // The relay heartbeat carries an 80-line tail; the host buffers 1000 and the
    // `logs` action pages over it. So the pane keeps its own line buffer: the
    // beat appends to it, "Load earlier" prepends to it.

    /** `[02:55:04] [Server thread/INFO] [source]: message` — vanilla, Paper and Forge */
    const MC_LINE = /^\[(\d{2}:\d{2}:\d{2})\] \[([^\]]*?)\/(\w+)\](?: \[([^\]]*?)\])?:? ?([\s\S]*)$/
    /** java.util.logging, which Forge mods drop into: a header line then `LEVEL: msg` */
    const JUL_HEAD = /^\w{3} \d{1,2}, \d{4} \d{1,2}:\d{2}:\d{2} [AP]M (\S+) (\S+)$/
    const JUL_BODY = /^(INFO|WARNING|SEVERE|CONFIG|FINE): ([\s\S]*)$/
    const FRAME = /^\s+at [\w.$/<>]+\(/
    const CAUSED = /^(Caused by|\t\.\.\. \d+ more)/
    const JOIN = /\b(joined the game|logged in with entity id)\b/
    const LEAVE = /\b(left the game|lost connection)\b/
    const READY = /\bDone \(([\d.]+)s\)!/

    const LEVELS = { INFO: 'info', WARN: 'warn', WARNING: 'warn', ERROR: 'error', SEVERE: 'error', FATAL: 'error', DEBUG: 'debug', TRACE: 'debug', CONFIG: 'debug', FINE: 'debug' }

    /** Console pane state, reset whenever a different server is opened. */
    let conState = { id: null, lines: [], filter: 'all', follow: true, query: '', start: null, atStart: false, busy: false }
    const CON_KEEP = 2000

    function conReset(id) {
      conState = { id, lines: [], filter: 'all', follow: true, query: '', start: null, atStart: false, busy: false }
    }

    /**
     * Fold the heartbeat's tail into the buffer. The tail overlaps whatever we
     * already have, so find the overlap rather than appending blind.
     */
    function conMergeTail(raw) {
      const tail = String(raw ?? '').split('\n')
      const buf = conState.lines
      if (!buf.length) { conState.lines = tail; return }
      for (let k = Math.min(tail.length, buf.length); k > 0; k--) {
        if (buf.slice(-k).join('\n') === tail.slice(0, k).join('\n')) {
          if (k < tail.length) conState.lines = buf.concat(tail.slice(k))
          return
        }
      }
      // no overlap at all: the server restarted, or we fell far enough behind
      // that the whole tail is new
      conState.lines = buf.concat(tail)
      if (conState.lines.length > CON_KEEP) conState.lines = conState.lines.slice(-CON_KEEP)
    }

    function parseLine(raw, prev) {
      const line = String(raw ?? '')
      if (FRAME.test(line) || CAUSED.test(line)) return { level: prev?.level ?? 'error', msg: line, frame: true }
      let m = MC_LINE.exec(line)
      if (m) {
        const level = LEVELS[m[3].toUpperCase()] ?? 'info'
        return { ts: m[1], thread: m[2], level, src: m[4] || '', msg: m[5] }
      }
      m = JUL_BODY.exec(line)
      if (m) return { level: LEVELS[m[1]] ?? 'info', msg: m[2] }
      if (JUL_HEAD.test(line)) return { level: prev?.level ?? 'info', msg: line, faint: true }
      return { level: 'info', msg: line, bare: true }
    }

    function conHighlight(text) {
      const q = conState.query.trim()
      if (!q) return esc(text)
      const parts = String(text).split(new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig'))
      return parts.map((p, i) => (i % 2 ? `<span class="hi">${esc(p)}</span>` : esc(p))).join('')
    }

    /** Rows the filter lets through, with consecutive stack frames folded into one. */
    function conVisible() {
      const q = conState.query.trim().toLowerCase()
      const out = []
      let prev = null
      for (const raw of conState.lines) {
        const p = parseLine(raw, prev)
        prev = p
        if (conState.filter !== 'all' && p.level !== conState.filter) continue
        if (q && !String(raw).toLowerCase().includes(q)) continue
        // a Forge crash dump is mostly frames; collapse runs of them
        if (p.frame && out.length && out[out.length - 1].frame) { out[out.length - 1].count++; continue }
        out.push({ ...p, count: 1 })
      }
      return out
    }

    function conLineHtml(p) {
      if (p.frame && p.count > 1) {
        return `<div class="ln fold" onclick="this.classList.toggle('open')"><span class="msg">▸ ${p.count} more stack frames</span></div>`
      }
      const ready = READY.exec(p.msg || '')
      if (ready) return `<div class="ln ready"><span class="msg">server ready in ${esc(ready[1])}s</span></div>`
      const kind = JOIN.test(p.msg || '') ? ' join' : LEAVE.test(p.msg || '') ? ' leave' : ''
      const ts = p.ts ? `<span class="ts">${esc(p.ts)}</span>` : ''
      const lv = p.bare || p.faint || p.frame ? '' : `<span class="lv">${esc((p.level || '').toUpperCase())}</span>`
      const src = p.src ? `<span class="src">[${esc(p.src)}]</span>` : ''
      return `<div class="ln ${p.level}${kind}${p.faint ? ' faintln' : ''}">${ts}${lv}${src}<span class="msg">${conHighlight(p.msg ?? '')}</span></div>`
    }

    function paintConsole() {
      const log = $('conLog')
      if (!log) return
      const rows = conVisible()
      log.innerHTML =
        (conState.atStart ? '<div class="con-start">— start of buffered log —</div>' : `<button class="con-more" onclick="conLoadEarlier()" ${conState.busy ? 'disabled' : ''}>${conState.busy ? 'Loading…' : 'Load earlier'}</button>`) +
        (rows.length ? rows.map(conLineHtml).join('') : '<div class="con-empty">Nothing matches that filter.</div>')
      const meta = $('conMeta')
      if (meta) meta.textContent = `${conState.lines.length} lines${conState.filter !== 'all' || conState.query ? ` · ${rows.length} shown` : ''}`
      if (conState.follow) log.scrollTop = log.scrollHeight
    }

    window.conSetFilter = (f) => { conState.filter = f; document.querySelectorAll('#conSeg button').forEach((b) => b.classList.toggle('on', b.dataset.f === f)); paintConsole() }
    window.conSetQuery = (v) => { conState.query = v; paintConsole() }
    window.conToggleFollow = () => {
      conState.follow = !conState.follow
      $('conFollow')?.classList.toggle('on', conState.follow)
      if (conState.follow) { const l = $('conLog'); if (l) l.scrollTop = l.scrollHeight }
    }
    /** Scrolling up drops follow; returning to the bottom picks it back up. */
    window.conScrolled = (el) => {
      const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 30
      if (atBottom !== conState.follow) { conState.follow = atBottom; $('conFollow')?.classList.toggle('on', atBottom) }
    }
    window.conLoadEarlier = async () => {
      if (conState.busy || conState.atStart) return
      conState.busy = true
      paintConsole()
      try {
        const res = await request(sheetId, 'logs', conState.start == null ? { lines: 300 } : { lines: 300, before: conState.start })
        const older = res.lines ?? []
        // first call returns the tail we already have; keep only what's above it
        conState.lines = conState.start == null && conState.lines.length ? older.concat(conState.lines.slice(-0)) : older.concat(conState.lines)
        if (conState.lines.length > CON_KEEP * 2) conState.lines = conState.lines.slice(-CON_KEEP * 2)
        conState.start = res.start ?? 0
        conState.atStart = Boolean(res.atStart)
      } catch (e) {
        toast(e.message, true)
      } finally {
        conState.busy = false
        const wasFollow = conState.follow
        conState.follow = false
        paintConsole()
        conState.follow = wasFollow
      }
    }
    window.conDownload = () => {
      const blob = new Blob([conState.lines.join('\n')], { type: 'text/plain' })
      const a = document.createElement('a')
      a.href = URL.createObjectURL(blob)
      a.download = `${(rowsById.get(sheetId)?.name || 'server').replace(/[^\w-]+/g, '-')}-console.txt`
      a.click()
      setTimeout(() => URL.revokeObjectURL(a.href), 5000)
    }

    // ---------- command input ----------
    /** Per-server command history, oldest first. */
    const cmdHistKey = (id) => `elauncher.cmdhist.${id}`
    function cmdHistory(id) {
      try { return JSON.parse(localStorage.getItem(cmdHistKey(id)) || '[]') } catch { return [] }
    }
    function pushHistory(id, cmd) {
      const list = cmdHistory(id).filter((c) => c !== cmd)
      list.push(cmd)
      try { localStorage.setItem(cmdHistKey(id), JSON.stringify(list.slice(-60))) } catch { /* storage blocked */ }
    }
    let histAt = -1

    /** Command vocabulary per game, with argument hints. Static — no backend. */
    const COMMANDS = {
      minecraft: [
        ['list', ''], ['say', '<message>'], ['tell', '<player> <message>'], ['kick', '<player> [reason]'],
        ['ban', '<player> [reason]'], ['pardon', '<player>'], ['op', '<player>'], ['deop', '<player>'],
        ['whitelist add', '<player>'], ['whitelist remove', '<player>'], ['whitelist list', ''], ['whitelist reload', ''],
        ['save-all', ''], ['save-off', ''], ['save-on', ''], ['stop', ''],
        ['time set', 'day|night|noon|midnight'], ['weather', 'clear|rain|thunder'],
        ['difficulty', 'peaceful|easy|normal|hard'], ['gamemode', '<mode> [player]'],
        ['gamerule', '<rule> [value]'], ['tp', '<player> <target>'], ['give', '<player> <item> [count]'],
        ['effect give', '<player> <effect>'], ['xp add', '<player> <amount>'], ['seed', ''],
        ['difficulty', ''], ['defaultgamemode', '<mode>'], ['setworldspawn', ''], ['spawnpoint', '<player>'],
        ['forceload add', '<from> <to>'], ['datapack list', ''], ['reload', '']
      ],
      palworld: [['save', ''], ['players', ''], ['broadcast', '<message>'], ['kick', '<steamid>'], ['ban', '<steamid>'], ['unban', '<steamid>'], ['shutdown', '<seconds> <message>'], ['info', '']],
      sdtd: [['saveworld', ''], ['lp', ''], ['say', '<message>'], ['settime', 'day|night'], ['kick', '<player>'], ['ban add', '<player>'], ['shutdown', '']],
      valheim: []
    }
    function commandsFor(game) { return COMMANDS[game] ?? COMMANDS.minecraft }

    window.conInputKey = (input, event) => {
      const id = sheetId
      if (event.key === 'ArrowUp' || event.key === 'ArrowDown') {
        const list = cmdHistory(id)
        if (!list.length) return
        event.preventDefault()
        if (histAt === -1) histAt = list.length
        histAt += event.key === 'ArrowUp' ? -1 : 1
        histAt = Math.max(0, Math.min(histAt, list.length))
        input.value = histAt >= list.length ? '' : list[histAt]
        conAutocomplete(input)
        return
      }
      if (event.key === 'Enter') {
        const pick = document.querySelector('#conAc .on')
        if (pick && input.value.trim() && !pick.dataset.exact) {
          event.preventDefault()
          input.value = pick.dataset.cmd + ' '
          conAutocomplete(input)
          return
        }
        const value = input.value.trim()
        if (!value) return
        pushHistory(id, value)
        histAt = -1
        sendCmd(id, input.id)
        conAutocomplete(input)
        return
      }
      if (event.key === 'Tab') {
        const pick = document.querySelector('#conAc .on')
        if (pick) { event.preventDefault(); input.value = pick.dataset.cmd + ' '; conAutocomplete(input) }
        return
      }
      if (event.key === 'Escape') { const ac = $('conAc'); if (ac) ac.innerHTML = '' }
      setTimeout(() => conAutocomplete(input), 0)
    }

    window.conAutocomplete = (input) => {
      const ac = $('conAc')
      if (!ac) return
      const raw = input.value.replace(/^\//, '')
      if (!raw.trim()) { ac.innerHTML = ''; return }
      const matches = commandsFor(sheetInfo?.game).filter(([c]) => c.startsWith(raw.toLowerCase())).slice(0, 6)
      const exact = matches.length === 1 && matches[0][0] === raw.toLowerCase()
      ac.innerHTML = matches.length && !exact
        ? matches.map(([c, hint], i) => `<div class="${i === 0 ? 'on' : ''}" data-cmd="${esc(c)}" onclick="conPick('${esc(c)}')">${esc(c)}<i>${esc(hint)}</i></div>`).join('')
        : ''
    }
    window.conPick = (cmd) => {
      const input = $('sheetCmd')
      if (!input) return
      input.value = cmd + ' '
      input.focus()
      conAutocomplete(input)
    }

    function renderConsole(body) {
      const row = rowsById.get(sheetId) || {}
      const running = row.state === 'running'
      const noConsole = sheetInfo?.game === 'valheim'
      if (conState.id !== sheetId) conReset(sheetId)
      conMergeTail(row.console || '')

      body.innerHTML = `<div class="con-wrap">
          <div class="con-head">
            <div class="seg" id="conSeg">
              ${['all', 'info', 'warn', 'error'].map((f) => `<button data-f="${f}" class="${f === conState.filter ? 'on' : ''} ${f}" onclick="conSetFilter('${f}')">${f.toUpperCase()}</button>`).join('')}
            </div>
            <button class="conbtn ${conState.follow ? 'on' : ''}" id="conFollow" onclick="conToggleFollow()" title="Follow new output">
              <span class="cdot ${running ? 'on' : ''}"></span>Follow
            </button>
            <input class="con-find" id="conFind" type="search" placeholder="Find…" aria-label="Find in log"
                   value="${esc(conState.query)}" oninput="conSetQuery(this.value)" />
            <span class="con-meta" id="conMeta"></span>
            <button class="conbtn" onclick="conDownload()" title="Download log">${icons.down || '⭳'}</button>
          </div>
          <div class="con-log" id="conLog" onscroll="conScrolled(this)"></div>
        </div>
        <div class="con-ac" id="conAc"></div>
        <div class="cmdrow open" style="margin-top:10px">
          <input id="sheetCmd" autocomplete="off" spellcheck="false"
            placeholder="${noConsole ? 'Valheim has no admin console — output only' : running ? 'Type a command…  ↑ for history' : 'start the server to send commands'}"
            ${running && !noConsole ? '' : 'disabled'}
            onkeydown="conInputKey(this, event)" />
          <button onclick="sendCmd('${sheetId}','sheetCmd')" ${running && !noConsole ? '' : 'disabled'} aria-label="Send command">${icons.send}</button>
        </div>
        ${noConsole ? '<div class="frow" style="margin-top:10px"><div class="hint2">Valheim ships no admin console, so commands cannot be sent to it from anywhere — this pane is read-only for that game.</div></div>' : ''}`
      paintConsole()
    }
    const trimNum = (v) => { const n = Number(v); return Number.isFinite(n) ? String(n) : v }
    const isRate = (key) => /Rate$/.test(key)

    function rateEditor(key, value) {
      const cur = Number(value)
      const presets = [0.5, 1, 2, 3].map((p) => `<button class="${Math.abs(cur - p) < 0.001 ? 'on' : ''}" onclick="setRate('${key}',${p},this)">×${p}</button>`).join('')
      return `<div class="rate"><div class="seg">${presets}</div><input type="number" step="0.1" min="0" value="${esc(trimNum(value))}"
        oninput="setDirty('${key}',this.value);this.closest('.rate').querySelectorAll('.seg button').forEach(b=>b.classList.remove('on'))"></div>`
    }
    window.setRate = (key, p, btn) => {
      setDirty(key, String(p))
      btn.parentElement.querySelectorAll('button').forEach((b) => b.classList.toggle('on', b === btn))
      const input = btn.closest('.rate').querySelector('input'); if (input) input.value = String(p)
    }

    const PLATFORMS = ['Steam', 'Xbox', 'PS5', 'Mac']
    function crossplayEditor(key, value) {
      const active = new Set(String(value).replace(/[()]/g, '').split(',').map((s) => s.trim()).filter(Boolean))
      return `<div class="platgrid" id="cp-${key}">${PLATFORMS.map((p) => `<label><input type="checkbox" ${active.has(p) ? 'checked' : ''} onchange="setCrossplay('${key}')">${p}</label>`).join('')}</div>`
    }
    window.setCrossplay = (key) => {
      const box = document.getElementById('cp-' + key)
      const on = PLATFORMS.filter((p, i) => box.querySelectorAll('input')[i].checked)
      setDirty(key, `(${on.join(',')})`)
    }

    function settingControl(key, value) {
      if (key === 'CrossplayPlatforms') return crossplayEditor(key, value)
      if (ENUM_OPTIONS[key]) return `<select onchange="setDirty('${key}',this.value)">${ENUM_OPTIONS[key].map(([v, l]) => `<option value="${v}" ${v === value ? 'selected' : ''}>${l}</option>`).join('')}</select>`
      if (isPal() && isRate(key) && /^-?\d/.test(value)) return rateEditor(key, value)
      if (/^-?\d+(\.\d+)?$/.test(value)) return `<input type="number" step="any" value="${esc(trimNum(value))}" oninput="setDirty('${key}',this.value)">`
      return `<input value="${esc(String(value ?? ''))}" oninput="setDirty('${key}',this.value)">`
    }
    function settingRow(key, value, forcedLabel) {
      const label = forcedLabel || labelFor(key)
      const hint = HINTS[key] ? `<div class="h">${esc(HINTS[key])}</div>` : ''
      const dk = esc((key + ' ' + label + ' ' + (HINTS[key] || '')).toLowerCase())
      // plan-locked player slots: hosted customers see the cap, not an editor
      const planMax = sheetInfo?.limits?.maxPlayers
      if (planMax && !sheetInfo?.owner && (key === 'ServerPlayerMaxNum' || key === 'max-players')) {
        return `<div class="setrow" data-k="${dk}"><label>${label}</label>

        return `<div class="setrow check" data-k="${dk}"><input type="checkbox" ${boolTrue(value) ? 'checked' : ''}
          onchange="setDirty('${key}',this.checked?'${boolStr(true)}':'${boolStr(false)}')"><div><label>${label}</label>${hint}</div></div>`
      }
      return `<div class="setrow" data-k="${dk}"><label>${label}</label>${settingControl(key, value)}${hint}</div>`
    }

    function renderSettings(body, props) {
      const ESS_BY_GAME = { palworld: PAL_ESS, valheim: VAL_ESS, sdtd: SDTD_ESS, zomboid: PZ_ESS, tmodloader: TML_ESS }
      const ess = ESS_BY_GAME[sheetInfo.game] ?? MC_ESS
      const groups = isPal() ? PAL_GROUPS : sheetInfo.game === 'minecraft' ? MC_GROUPS : sheetInfo.game === 'valheim' ? VAL_GROUPS : []

      const essHtml = ess.map(([k, l]) => {
        const v = props[k] ?? ''

      // group the remaining keys
      const grouped = {}, order = []
      for (const [t] of groups) { grouped[t] = []; order.push(t) }
      grouped.Other = []; order.push('Other')
      for (const k of Object.keys(props).filter((k) => !essKeys.has(k)).sort()) {
        const g = groups.find(([, , re]) => re.test(k))
        grouped[g ? g[0] : 'Other'].push(k)
      }
      const groupsHtml = order.filter((t) => grouped[t].length).map((t) => {
        const group = groups.find((x) => x[0] === t) || [, '⚙️']
        // a group can carry a note explaining when its settings actually bite
        const note = typeof group[3] === 'function' ? group[3]() : ''
        return `<div class="setgroup">
          <div class="gh" onclick="this.parentElement.classList.toggle('open')"><span class="gi">${group[1]}</span>${t}<span class="cnt">${grouped[t].length}</span><span class="chev">${icons.chev}</span></div>
          <div class="body">${note}${grouped[t].map((k) => settingRow(k, props[k])).join('')}</div>
        </div>`
      }).join('')

      const rebuildZone = sheetInfo.game !== 'minecraft' ? '' : `<div class="grouphead" style="color:var(--red);margin-top:24px">Change loader &amp; version</div>
        <div class="dangerzone">
          <div class="hint2" style="color:var(--red);margin-bottom:10px">⚠ Rebuilding wipes the world, mods, and every file on this server, then reinstalls it fresh. There is no undo.</div>
          <div class="grid2">
            <div class="frow"><label>Loader</label><select id="rbLoader">${['paper', 'vanilla', 'fabric', 'neoforge', 'forge'].map((k) => `<option value="${k}" ${sheetInfo.kind === k ? 'selected' : ''}>${k[0].toUpperCase() + k.slice(1)}</option>`).join('')}</select></div>
            <div class="frow"><label>Version</label><select id="rbVersion"></select></div>
          </div>
          <button class="minibtn red" onclick="rebuildServer()">Rebuild server — delete all files</button>
        </div>`
      // archive/delete are owner-or-admin only (the host enforces it server-side too);
      // no sheetId means a design preview, which renders as the owner
      const showLifecycle = !sheetId || canManage(sheetId)
      const lifecycleZones = `<div class="grouphead" style="color:var(--amber);margin-top:24px">Archive this server</div>
        <div class="dangerzone" style="border-color:rgba(251,191,36,.35);background:rgba(251,191,36,.05)">
          <div class="hint2" style="margin-bottom:10px">Stops the server and puts it in cold storage on the host. The world and every file are kept, and it can be restored any time — use this when a customer stops paying. Anyone it was shared with loses panel access until you share it again.</div>
          <button class="minibtn" style="border-color:rgba(251,191,36,.45);color:var(--amber)" onclick="archiveServer()">Archive server</button>
        </div>
        <div class="grouphead" style="color:var(--red);margin-top:24px">Delete this server</div>
        <div class="dangerzone">
          <div class="hint2" style="color:var(--red);margin-bottom:10px">⚠ Deleting stops the server and removes it from the host — the world and every file go with it. There is no undo.</div>
          <button class="minibtn red" onclick="deleteServer()">Delete server permanently</button>
        </div>`
      // admin-only: lift this server past its plan. The host re-reads is_admin on
      // every request, so this block is a convenience, not the enforcement point.
      const ovr = sheetInfo.limitsOverride || {}
      const planCaps = sheetInfo.limitsPlan || {}
      const planNote = planCaps.memoryMb
        ? ` Plan allows ${(planCaps.memoryMb / 1024).toFixed(1)} GB${planCaps.cpuCores ? ` and ${planCaps.cpuCores} core${planCaps.cpuCores === 1 ? '' : 's'}` : ''}.`
        : ''
      const overrideZone = !isAdmin || !sheetInfo.limits ? '' : `<div class="grouphead" style="color:var(--accent);margin-top:24px">Admin · resource override</div>
        <div class="dangerzone" style="border-color:rgba(124,108,255,.4);background:var(--accent-soft)">
          <div class="hint2" style="margin-bottom:10px">Raises this server above its plan allowance.${planNote} Leave a field blank to keep the plan value. Applies on the next restart.</div>
          <div class="grid2">
            <div class="frow"><label>RAM (GB)</label><input id="ovRam" type="number" min="1" step="0.5" value="${ovr.memoryMb ? ovr.memoryMb / 1024 : ''}" placeholder="${planCaps.memoryMb ? planCaps.memoryMb / 1024 : 'plan'}"></div>
            <div class="frow"><label>CPU cores</label><input id="ovCores" type="number" min="1" step="1" value="${ovr.cpuCores || ''}" placeholder="${planCaps.cpuCores || 'all'}"></div>
          </div>
          <button class="minibtn acc" onclick="saveLimitsOverride()">Apply override</button>
          ${ovr.memoryMb || ovr.cpuCores ? '<button class="minibtn" onclick="clearLimitsOverride()">Reset to plan</button>' : ''}
        </div>`
      const danger = `${rebuildZone}${overrideZone}${showLifecycle ? lifecycleZones : ''}`

      // palworld visibility: -publiclobby is a launch flag on the record, not an ini
      // setting, so it gets its own always-open block above the ini essentials
      const community = isPal() ? `<div class="setgroup open" style="margin-bottom:16px">
          <div class="gh" style="cursor:default"><span class="gi">🌐</span>Community server browser<span class="cnt">${sheetInfo.communityServer ? 'Listed' : 'Private'}</span></div>
          <div class="body"><div class="setrow check">
            <input type="checkbox" id="cm-toggle" ${sheetInfo.communityServer ? 'checked' : ''} onchange="setCommunity(this.checked)">
            <div><label for="cm-toggle">List this server in Palworld's official community browser</label>
            <div class="h">Players can find and join it from the in-game server list — no address needed. The host announces its public address automatically; make sure UDP port ${sheetInfo.port} is reachable. Applies on the next restart.</div></div>
          </div></div>
        </div>` : ''

      body.innerHTML = `
        <div class="set-hero"><h3>${gameLabel(sheetInfo.game)} settings</h3><p>The essentials are up top; every other option is grouped below with a plain-English note. Changes apply on the next server restart.</p></div>
        ${community}
        <div class="essgrid">${essHtml}</div>
        <div class="grouphead" style="margin-top:22px">Advanced settings</div>
        <div class="searchbar">${icons.chipIc}<input placeholder="Search every setting…" oninput="filterSettings(this.value)"></div>
        <div id="allGroups">${groupsHtml}</div>
        ${danger}
        <div class="savebar"><button class="cta" onclick="saveSettings()">Save settings</button></div>`
      if (!isPal()) {
        loadMcVersions().then((vers) => {
          const sel = $('rbVersion'); if (!sel) return
          sel.innerHTML = vers.map((v) => `<option ${v === sheetInfo.minecraftVersion ? 'selected' : ''}>${v}</option>`).join('')
        })
      }
      wireMotdPreview(body, props)
    }

    /** Minecraft's legacy section-code palette, as the client renders it. */
    const MOTD_COLORS = {
      0: '#000', 1: '#0000AA', 2: '#00AA00', 3: '#00AAAA', 4: '#AA0000', 5: '#AA00AA', 6: '#FFAA00', 7: '#AAAAAA',
      8: '#555', 9: '#5555FF', a: '#55FF55', b: '#55FFFF', c: '#FF5555', d: '#FF55FF', e: '#FFFF55', f: '#FFF'
    }
    /** Render §-codes the way the multiplayer list does. Two lines max, like the real client. */
    function motdHtml(raw) {
      const text = String(raw ?? '').replace(/\\n/g, '\n')
      if (!text.trim()) return '<span style="color:#777">A Minecraft Server</span>'
      return text.split('\n').slice(0, 2).map((line) => {
        let out = ''
        let style = {}
        const flush = (chunk) => {
          if (!chunk) return
          const css = [
            style.color ? `color:${style.color}` : '',
            style.bold ? 'font-weight:700' : '',
            style.italic ? 'font-style:italic' : '',
            style.under || style.strike ? `text-decoration:${[style.under ? 'underline' : '', style.strike ? 'line-through' : ''].filter(Boolean).join(' ')}` : ''
          ].filter(Boolean).join(';')
          out += css ? `<span style="${css}">${esc(chunk)}</span>` : esc(chunk)
        }
        const parts = line.split(/§(.)/)
        flush(parts[0])
        for (let i = 1; i < parts.length; i += 2) {
          const code = String(parts[i]).toLowerCase()
          if (code === 'r') style = {}
          else if (MOTD_COLORS[code]) style = { color: MOTD_COLORS[code] }
          else if (code === 'l') style.bold = true
          else if (code === 'o') style.italic = true
          else if (code === 'n') style.under = true
          else if (code === 'm') style.strike = true
          flush(parts[i + 1])
        }
        return `<div class="motd-line">${out || '&nbsp;'}</div>`
      }).join('')
    }

    /**
     * Live preview under the MOTD field. §-codes are the single most-asked-about
     * setting and there is nowhere else to see what they do short of restarting
     * the server and opening the game.
     */
    function wireMotdPreview(body, props) {
      if (sheetInfo?.game !== 'minecraft') return
      const row = [...body.querySelectorAll('.setrow')].find((r) => (r.dataset.k || '').startsWith('motd '))
      const input = row?.querySelector('input, textarea')
      if (!row || !input) return
      const name = (rowsById.get(sheetId) || {}).name || 'Server'
      const preview = document.createElement('div')
      preview.className = 'motd-preview'
      const paint = () => {
        preview.innerHTML = `<div class="motd-icon"></div>
          <div class="motd-body">
            <div class="motd-name">${esc(name)}</div>
            <div class="motd-text">${motdHtml(input.value)}</div>
          </div>
          <div class="motd-ping">${icons.users}<span>0/${esc(String(props['max-players'] ?? 20))}</span></div>`
      }
      paint()
      input.addEventListener('input', paint)
      row.appendChild(preview)
    }
    window.filterSettings = (q) => {
      q = q.trim().toLowerCase()
      document.querySelectorAll('#allGroups .setgroup').forEach((g) => {
        let any = false
        g.querySelectorAll('.setrow').forEach((r) => {
          const match = !q || (r.dataset.k || '').includes(q)
          r.style.display = match ? '' : 'none'
          if (match) any = true
        })
        g.style.display = any ? '' : 'none'
        g.classList.toggle('open', Boolean(q) && any)
      })
    }
    window.saveSettings = async () => {
      if (!Object.keys(dirty).length) return toast('Nothing changed')
      try { await request(sheetId, 'setProps', { updates: dirty }); dirty = {}; toast('Saved — applies on next restart') }
      catch (e) { toast(e.message, true) }
    }
    /** Valheim: modifiers only bite at world creation, so changing them means making a new world. */
    window.regenerateWorld = async () => {
      const id = sheetId
      const name = (rowsById.get(id) || {}).name || 'this server'
      // only the modifier picks travel — other edits still go through Save settings
      const modifiers = Object.fromEntries(Object.entries(dirty).filter(([k]) => /^(Modifier|Key)/.test(k)))
      if (!confirm(`Regenerate the world on "${name}"?\n\nThe current world is deleted and a new one is generated with the modifiers above. A backup is taken first, but everything built on the old world goes with it.`)) return
      if (prompt('This deletes the current Valheim world. Type REGENERATE to confirm.') !== 'REGENERATE') return toast('Regenerate cancelled')
      toast('Backing up and regenerating — the server restarts on a fresh world')
      try {
        // stop + backup + delete + start: a graceful stop alone can take a minute
        const res = await request(id, 'regenerateWorld', { modifiers }, 150000)
        dirty = {}
        infoCache.delete(id)
        sheetInfo = null
        toast(res?.stamp ? `New world generating — the old one is in backups/${res.stamp}` : 'New world generating')
        renderTab()
      } catch (e) { toast(e.message, true) }
    }
    window.setCommunity = async (on) => {
      try {
        await request(sheetId, 'setCommunity', { on })
        sheetInfo.communityServer = on
        infoCache.set(sheetId, { ...sheetInfo })
        toast(on ? 'Community listing on — applies on the next restart' : 'Community listing off — applies on the next restart')
      } catch (e) {
        toast(e.message, true)
      }
      renderTab()
    }
    window.rebuildServer = async () => {
      const loader = $('rbLoader').value, version = $('rbVersion').value
      const name = (rowsById.get(sheetId) || {}).name || 'this server'
      if (!confirm(`Rebuild "${name}" as ${loader} ${version}?\n\nThis DELETES the world, mods, and every file on the server, then reinstalls it fresh. There is no undo.`)) return
      if (prompt('This permanently deletes all server files. Type REBUILD to confirm.') !== 'REBUILD') return toast('Rebuild cancelled')
      toast('Rebuilding — this downloads a fresh server, give it a few minutes')
      try {
        await request(sheetId, 'rebuild', { loader, version }, 60000)
        infoCache.delete(sheetId); sheetInfo = null; toast('Server rebuilt — it is starting fresh'); renderTab()
      } catch (e) { toast(e.message, true) }
    }
    window.deleteServer = async () => {
      const id = sheetId
      const name = (rowsById.get(id) || {}).name || 'this server'
      if (!confirm(`Delete "${name}"?\n\nThis stops the server and permanently deletes its world and every file from the host. There is no undo.`)) return
      if (prompt('This permanently deletes the server and all of its files. Type DELETE to confirm.') !== 'DELETE') return toast('Delete cancelled')
      toast('Deleting the server — stopping it first can take a minute')
      try {
        await request(id, 'delete', {}, 90000) // a graceful stop alone can take up to a minute
        infoCache.delete(id); rowsById.delete(id); ownerOf.delete(id)
        sheetInfo = null; dirty = {}
        closeSheet()
        schedulePaint()
        toast('Server deleted')
        void refresh()
      } catch (e) { toast(e.message, true) }
    }
    /** Admin: lift this server above its plan allowance, or clear the lift. */
    async function applyLimitsOverride(override, note) {
      const id = sheetId
      try {
        const res = await request(id, 'setLimits', { override })
        // the caps in force changed on the host — drop the cache so a reopen re-reads
        infoCache.delete(id)
        if (sheetInfo) {
          sheetInfo.limits = res.limits
          sheetInfo.limitsOverride = override.memoryMb || override.cpuCores ? override : null
        }
        toast(note)
      } catch (e) { toast(e.message, true) }
    }
    window.saveLimitsOverride = () => {
      const gb = parseFloat($('ovRam')?.value)
      const cores = parseInt($('ovCores')?.value, 10)
      const override = {}
      if (Number.isFinite(gb) && gb > 0) override.memoryMb = Math.round(gb * 1024)
      if (Number.isFinite(cores) && cores > 0) override.cpuCores = cores
      if (!override.memoryMb && !override.cpuCores) return toast('Set RAM or CPU cores first', true)
      return applyLimitsOverride(override, 'Override applied — restart the server to use it')
    }
    window.clearLimitsOverride = () => applyLimitsOverride({}, 'Back to the plan allowance — restart to apply')
    window.archiveServer = async () => {
      const id = sheetId
      const name = (rowsById.get(id) || {}).name || 'this server'
      if (!confirm(`Archive "${name}"?\n\nThis stops the server and takes it offline. The world and every file are kept, and you can restore it any time. Anyone it was shared with loses panel access.`)) return
      toast('Archiving — stopping the server first can take a minute')
      try {
        await request(id, 'archive', {}, 90000)
        infoCache.delete(id); sheetInfo = null; dirty = {}

        if (row) { row.state = 'archived'; row.updated_at = new Date().toISOString() }
        closeSheet()
        schedulePaint()

        void refresh()
      } catch (e) { toast(e.message, true) }
    }
    window.restoreServer = async (id) => {
      const name = (rowsById.get(id) || {}).name || 'this server'
      if (!confirm(`Restore "${name}" from the archive?\n\nIt returns to the server list stopped, ready to start. Re-share it to give a customer access again.`)) return
      toast('Restoring the server…')
      try {
        await request(id, 'restore', {}, 60000)
        const row = rowsById.get(id)
        if (row) { row.state = 'stopped'; row.updated_at = new Date().toISOString() }
        schedulePaint()
        if (DESK() && deskSel === id) deskSelect(id) // bring the control-panel tabs back
        toast('Server restored')
        refreshSoon(); void refresh()
      } catch (e) { toast(e.message, true) }
    }
    window.deleteArchived = async (id) => {
      const name = (rowsById.get(id) || {}).name || 'this server'
      if (!confirm(`Delete the archived server "${name}" permanently?\n\nThis destroys the stored world and files. There is no undo.`)) return
      if (prompt('This permanently deletes the archived server. Type DELETE to confirm.') !== 'DELETE') return toast('Delete cancelled')
      toast('Deleting the archive…')
      try {
        await request(id, 'delete', {}, 60000)
        rowsById.delete(id); ownerOf.delete(id); infoCache.delete(id)
        if (deskSel === id) deskSel = null
        schedulePaint()
        toast('Server deleted')
        void refresh()
      } catch (e) { toast(e.message, true) }
    }

    function renderPalPlayers(body, players) {
      const list = players || []
      body.innerHTML = `<div class="grouphead">Online now (${list.length})</div>
        <div class="plister">${list.length ? list.map((p) => `<div class="prow">
          <span class="avatar" style="background:${gradOf(p.name)}">${esc((p.name || '?').charAt(0).toUpperCase())}</span>

          <button class="minibtn" onclick="palMod('kick','${esc(p.userId || '')}','${esc(p.name)}')">Kick</button>

        <div class="grouphead">Broadcast</div>

        <div class="grouphead">Unban</div>
        <div class="cmdrow open"><input id="palUnban" placeholder="steam_7656…"><button class="minibtn" onclick="palUnban()">Unban</button></div>`
    }
    window.palMod = async (action, userId, name) => {
      if (!userId) return toast('No platform id yet — try again in a moment', true)
      if (!confirm(`${action === 'ban' ? 'Ban' : 'Kick'} ${name}?`)) return

    // Minecraft head renders, same posture as the existing Mojang and Modrinth
    // fetches. Falls back to the initial tile if the service is unreachable.
    const headUrl = (name) => `https://mc-heads.net/avatar/${encodeURIComponent(name)}/40`
    function avatarHtml(name, cls = 'avatar') {

    const ROSTER_TABS = [['whitelist', 'Whitelist'], ['ops', 'Operators'], ['banned-players', 'Banned']]
    let rosterTab = 'whitelist'

    async function renderMcPlayers(body) {

          ? online.map((n) => `<div class="prow">
              ${avatarHtml(n)}
              <div class="pn" style="flex:1;min-width:0">${esc(n)}</div>

              <button class="minibtn" onclick="rosterEdit('ops','add','${esc(n)}')">Op</button>

            </div>`).join('')
          : `<div class="loadrow">${running ? 'Nobody online.' : 'The server is stopped.'}</div>`}</div>

    window.rosterGo = (tab) => {

      document.querySelectorAll('.rtabs button').forEach((b) => b.classList.toggle('on', b.textContent.startsWith(ROSTER_TABS.find(([k]) => k === tab)[1])))

    function paintRoster() {
      const el = $('rosterBody')
      if (!el || !rosterData) return
      for (const [k] of ROSTER_TABS) {
        const c = $('ct-' + k)
        if (c) c.textContent = String((rosterData[k] || []).length)
      }
      const list = rosterData[rosterTab] || []
      const label = ROSTER_TABS.find(([k]) => k === rosterTab)[1]
      const verb = rosterTab === 'banned-players' ? 'Unban' : 'Remove'
      el.innerHTML = `
        <div class="cmdrow open" style="margin-bottom:10px">
          <input id="rosterAdd" placeholder="PlayerName" autocomplete="off"
                 onkeydown="if(event.key==='Enter')rosterEdit('${rosterTab}','add',this.value)">
          <button class="minibtn" onclick="rosterEdit('${rosterTab}','add',document.getElementById('rosterAdd').value)">Add</button>
        </div>
        <div class="plister">${list.length
          ? list.map((p) => `<div class="prow">
              ${avatarHtml(p.name)}
              <div class="pn" style="flex:1;min-width:0">${esc(p.name)}${p.uuid ? `<i>${esc(p.uuid)}</i>` : ''}</div>
              <button class="minibtn ${rosterTab === 'banned-players' ? '' : 'red'}" onclick="rosterEdit('${rosterTab}','remove','${esc(p.name)}')">${verb}</button>
            </div>`).join('')
          : `<div class="loadrow">${label} is empty.</div>`}</div>
        <div class="frow"><div class="hint2">Edits apply whether the server is running or stopped — a running server is told over its console, a stopped one has its <code>${esc(rosterTab)}.json</code> edited directly.</div></div>`
    }

    window.rosterEdit = async (list, op, name) => {
      const trimmed = String(name || '').trim()
      if (!trimmed) return toast('Enter a player name.', true)
      try {
        rosterData = await request(sheetId, 'rosterEdit', { list, op, name: trimmed })
        rosterTab = list
        document.querySelectorAll('.rtabs button').forEach((b) => b.classList.toggle('on', b.textContent.startsWith(ROSTER_TABS.find(([k]) => k === list)[1])))
        paintRoster()
        toast(op === 'add' ? `${trimmed} added to ${list.replace('-players', '')}` : `${trimmed} removed`)
      } catch (e) {
        toast(e.message, true)
      }
    }

    window.mcCmd = async (cmd) => {
      if (!cmd.trim()) return
      try { await queue(sheetId, 'command', cmd); toast('Command sent') } catch (e) { toast(e.message, true) }
    }
    // valheim / 7dtd: names stream from the host's log or telnet polling
    function renderSteamPlayers(body) {
      const row = rowsById.get(sheetId) || {}
      const online = row.players || []
      const canKick = sheetInfo.game === 'sdtd'
      body.innerHTML = `<div class="grouphead">Online now (${online.length})</div>
        <div class="plister">${online.length ? online.map((n) => `<div class="prow">
          <span class="avatar" style="background:${gradOf(n)}">${esc(n.charAt(0).toUpperCase())}</span>
          <div class="pn" style="flex:1;min-width:0">${esc(n)}</div>
          ${canKick ? `<button class="minibtn" onclick="mcCmd('kick ${esc(n)}')">Kick</button>
          <button class="minibtn red" onclick="mcCmd('ban add ${esc(n)} 10 years')">Ban</button>` : ''}
        </div>`).join('') : '<div class="loadrow">Nobody online.</div>'}</div>
        <div class="frow"><div class="hint2">${sheetInfo.game === 'valheim'
          ? 'Valheim has no admin console — control access with the join password in Settings.'
          : 'Moderation runs 7DTD console commands over the server\'s admin telnet.'}</div></div>`
    }

    // paper servers install Bukkit-family plugins; modded servers install loader mods
    const modNoun = () => (sheetInfo?.kind === 'paper' ? 'plugin' : 'mod')
    function renderMods(body, installed) {
      const list = installed || []
      const noun = modNoun()
      body.innerHTML = `<div class="grouphead">Installed (${list.length})</div>
        <div class="plister" id="modInstalled">${list.length ? list.map((m) => `<div class="prow">
          ${m.iconUrl ? `<img src="${esc(m.iconUrl)}" style="width:30px;height:30px;border-radius:7px">` : ''}
          <div style="flex:1;min-width:0"><div class="pn">${esc(m.title || m.fileName)}</div><div class="pm">${esc(m.versionNumber || m.fileName)}</div></div>
          <button class="minibtn red" onclick="removeMod('${esc(m.fileName)}')">Remove</button></div>`).join('') : `<div class="loadrow">No ${noun}s yet — search below.</div>`}</div>
        <div class="grouphead">Add ${noun}s · ${esc(sheetInfo.kind)} ${esc(sheetInfo.minecraftVersion || '')}</div>
        <div class="searchbar">${icons.chipIc}<input placeholder="Search Modrinth ${noun}s…" oninput="modSearch(this.value)"></div>
        <div id="modResults" class="plister"><div class="loadrow">Type to search.</div></div>`
    }
    window.modSearch = async (q) => {
      const box = $('modResults'); if (!box) return
      if (!q.trim()) { box.innerHTML = '<div class="loadrow">Type to search.</div>'; return }
      box.innerHTML = '<div class="loadrow">Searching…</div>'
      try {
        const hits = await modrinthSearch(q, modNoun() === 'plugin' ? 'plugin' : 'mod', sheetInfo.minecraftVersion, sheetInfo.kind)
        box.innerHTML = hits.map((h) => `<div class="prow">
          ${h.icon_url ? `<img src="${esc(h.icon_url)}" style="width:30px;height:30px;border-radius:7px">` : ''}
          <div style="flex:1;min-width:0"><div class="pn">${esc(h.title)}</div><div class="pm">${(h.downloads || 0).toLocaleString()} downloads</div></div>
          <button class="minibtn" onclick="installMod('${h.project_id}', this)">Install</button></div>`).join('') || `<div class="loadrow">No ${modNoun()}s found.</div>`
      } catch { box.innerHTML = '<div class="loadrow" style="color:var(--red)">Search failed.</div>' }
    }
    window.installMod = async (projectId, btn) => {
      if (btn) { btn.disabled = true; btn.textContent = 'Installing…' }
      try { await request(sheetId, 'installMod', { projectId }, 40000); toast('Installed — restart the server to apply'); renderTab() }
      catch (e) { toast(e.message, true); if (btn) { btn.disabled = false; btn.textContent = 'Install' } }
    }
    window.removeMod = async (fileName) => {
      if (!confirm(`Remove this ${modNoun()}?`)) return
      try { await request(sheetId, 'removeMod', { fileName }); toast('Removed'); renderTab() } catch (e) { toast(e.message, true) }
    }

    // ---------- files tab (a small explorer over the relay) ----------
    // Bytes travel base64'd inside a request row, so transfers are sliced: a few
    // slices stay in flight at once because the host drains 20 requests a tick,
    // and a separate commit is what moves a finished upload into place.
    const XFER_CHUNK = 256 * 1024
    const XFER_PARALLEL = 3
    const XFER_TIMEOUT = 60_000
    const PREVIEW_MAX = 8 * 1048576

    let filesRel = ''
    let fileView = null // { rel, content, dirty } while the editor is open
    let filePreview = null // { rel, name, url } while an image is open
    let fileEntries = [] // the folder as the host last reported it
    let fileShown = [] // the filtered + sorted slice actually painted; row handlers index into this
    let fileSel = new Set() // selected names — names survive re-sorting, indices don't
    let fileQuery = ''
    let fileSort = { key: 'name', dir: 1 }
    let fileGrid = localStorage.getItem('fm.grid') === '1'
    let fileAnchor = -1 // last row clicked, for shift-range selection
    let transfers = [] // { id, name, sent, total, state, error }
    let fileMenuEl = null

    const fmtBytes = (n) => (n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB' : n >= 1024 ? (n / 1024).toFixed(0) + ' KB' : n + ' B')
    const fmtWhen = (ms) => {
      const diff = Date.now() - ms
      if (diff < 60_000) return 'just now'
      if (diff < 3_600_000) return `${Math.floor(diff / 60_000)} min ago`
      if (diff < 86_400_000) return `${Math.floor(diff / 3_600_000)}h ago`
      if (diff < 6 * 86_400_000) return `${Math.floor(diff / 86_400_000)}d ago`
      return new Date(ms).toLocaleDateString(undefined, { month: 'short', day: 'numeric' })
    }
    const relOf = (name) => (filesRel ? `${filesRel}/${name}` : name)
    const extOf = (name) => (name.includes('.') ? name.split('.').pop().toLowerCase() : '')
    const isImage = (name) => ['png', 'jpg', 'jpeg', 'gif', 'webp', 'bmp', 'ico'].includes(extOf(name))
    const chevIcon = icons.chev.replace('<svg ', '<svg class="chev" ')

    /** What a file looks like at a glance — the chip's glyph and tint. */
    const FILE_KINDS = [
      ['img', 'image', ['png', 'jpg', 'jpeg', 'gif', 'webp', 'bmp', 'ico', 'svg']],
      ['zip', 'archive', ['zip', 'jar', 'gz', 'tgz', 'tar', 'rar', '7z', 'mrpack']],
      ['code', 'code', ['json', 'json5', 'yml', 'yaml', 'toml', 'xml', 'properties', 'cfg', 'conf', 'ini', 'sh', 'bat', 'mcmeta', 'snbt']],
      ['world', 'database', ['dat', 'dat_old', 'mca', 'mcr', 'db', 'sqlite', 'nbt', 'fwl', 'fld', 'old']]
    ]
    function kindOf(entry) {
      if (entry.isDir) return { cls: 'fold', icon: icons.folder }
      const ext = extOf(entry.name)
      for (const [cls, icon, exts] of FILE_KINDS) if (exts.includes(ext)) return { cls, icon: icons[icon] }
      return { cls: '', icon: icons.file }
    }

    // ---------- painting ----------
    // renderFiles fetches; the paint* helpers repaint from what's already here, so
    // typing in the filter or ticking a checkbox never costs a round trip.

    async function renderFiles(body) {
      if (fileView) return renderFileEditor(body)
      if (filePreview) return renderFilePreview(body)
      fileEntries = (await request(sheetId, 'files', { path: filesRel })) || []
      paintFiles(body)
    }

    async function reloadFiles() {
      if (sheetTab !== 'files' || !sheetId) return
      try {
        fileEntries = (await request(sheetId, 'files', { path: filesRel })) || []
        for (const name of [...fileSel]) if (!fileEntries.some((e) => e.name === name)) fileSel.delete(name)
        paintFiles()
      } catch (e) {
        toast(e.message, true)
      }
    }

    function paintFiles(body) {
      body = body || $('tabBody')
      if (!body || sheetTab !== 'files' || fileView || filePreview) return
      body.innerHTML = `<div id="fmHead"></div>
        <div class="fmzone" id="fmZone"><div class="fmdrop">Drop to upload here</div><div id="fmList"></div></div>
        <div id="fmTray"></div>`
      wireDrop($('fmZone'))
      paintFileHead()
      paintFileList()
      paintTray()
    }

    function paintFileHead() {
      const head = $('fmHead')
      if (!head) return
      const segs = filesRel ? filesRel.split('/') : []
      const crumbs = `<div class="crumbs">
        <button class="root${segs.length ? '' : ' here'}" onclick="fileCrumb(-1)">${icons.home}${esc((rowsById.get(sheetId) || {}).name || 'server')}</button>` +
        segs.map((s, i) => `<span class="csep">›</span><button class="${i === segs.length - 1 ? 'here' : ''}" onclick="fileCrumb(${i})">${esc(s)}</button>`).join('') + `</div>`
      const bar = fileSel.size
        ? `<div class="fmsel">
            <b>${fileSel.size} selected</b>
            <button class="minibtn" onclick="fileDownloadSel()">${icons.download}Download</button>
            <button class="minibtn red" onclick="fileDeleteSel()">${icons.trash}Delete</button>
            <button class="minibtn icon" onclick="fileClearSel()" title="Clear selection">${icons.x}</button>
          </div>`
        : `<div class="fmbar">
            <button class="minibtn acc" onclick="filePick()">${icons.upload}Upload</button>
            <button class="minibtn" onclick="fileNewFolder()">${icons.folderPlus}New folder</button>
            <label class="fmsearch">${icons.search}<input id="fmQ" placeholder="Filter this folder…" value="${esc(fileQuery)}" oninput="fileFilter(this.value)"></label>
            <button class="minibtn icon" onclick="fileSortMenu(event)" title="Sort">${icons.sort}</button>
            <div class="fmseg">
              <button class="${fileGrid ? '' : 'on'}" onclick="fileSetGrid(false)" title="List">${icons.rows}</button>
              <button class="${fileGrid ? 'on' : ''}" onclick="fileSetGrid(true)" title="Tiles">${icons.grid}</button>
            </div>
          </div>`
      head.innerHTML = crumbs + bar
    }

    function paintFileList() {
      const list = $('fmList')
      if (!list) return
      const q = fileQuery.trim().toLowerCase()
      const dir = fileSort.dir
      fileShown = fileEntries
        .filter((e) => !q || e.name.toLowerCase().includes(q))
        // folders lead whichever way the sort runs, the way every file manager does it
        .sort((a, b) => Number(b.isDir) - Number(a.isDir) || dir * (
          fileSort.key === 'size' ? a.sizeBytes - b.sizeBytes
            : fileSort.key === 'date' ? a.modifiedAt - b.modifiedAt
              : a.name.localeCompare(b.name, undefined, { numeric: true })
        ))
      if (!fileShown.length) {
        list.innerHTML = `<div class="empty" style="padding:34px 20px">
          <b>${q ? 'Nothing matches that' : 'This folder is empty'}</b>
          ${q ? esc(`No file here contains “${fileQuery.trim()}”.`) : 'Drop files anywhere here, or use Upload.'}</div>`
        return
      }
      list.className = fileGrid ? 'fgrid' : 'flist'
      list.innerHTML = fileShown.map((e, i) => {
        const k = kindOf(e)
        return `<div class="fitem${fileSel.has(e.name) ? ' sel' : ''}" onclick="fileTap(event, ${i})" oncontextmenu="fileMenu(event, ${i})">
          <span class="fchk" onclick="fileToggle(event, ${i})">${icons.check}</span>
          <span class="ficon ${k.cls}">${k.icon}</span>
          <div class="fmain">
            <div class="fname">${esc(e.name)}</div>
            <div class="fmeta">${e.isDir ? 'Folder' : fmtBytes(e.sizeBytes)} · ${fmtWhen(e.modifiedAt)}</div>
          </div>
          <button class="fdots" onclick="fileMenu(event, ${i})" title="More">${icons.dots}</button>
          ${e.isDir ? chevIcon : ''}
        </div>`
      }).join('')
    }

    function paintTray() {
      const tray = $('fmTray')
      if (!tray) return
      tray.innerHTML = transfers.length
        ? `<div class="fups">${transfers.map((t) => {
          const pct = t.total ? Math.round((t.sent / t.total) * 100) : t.state === 'done' ? 100 : 0
          const label = t.state === 'bad' ? esc(t.error || 'Failed') : t.state === 'done' ? 'Done' : `${pct}%`
          return `<div class="fup ${t.state}">
            <span class="fupname">${t.state === 'down' ? '↓' : t.state === 'up' ? '↑' : ''} ${esc(t.name)}</span>
            ${t.state === 'up' || t.state === 'down' ? `<span class="fupbar"><i style="width:${pct}%"></i></span>` : ''}
            <span class="fuppct">${label}</span>
          </div>`
        }).join('')}</div>`
        : ''
    }

    // ---------- navigation and selection ----------

    /** Moving to a different server must not carry a folder, a selection or a preview across. */
    function resetFileState() {
      filesRel = ''
      fileView = null
      clearPreview()
      closeFileMenu()
      fileEntries = []
      fileShown = []
      fileSel.clear()
      fileQuery = ''
      fileAnchor = -1
      transfers = []
    }

    function goFolder(rel) {
      filesRel = rel
      fileView = null
      clearPreview()
      fileSel.clear()
      fileQuery = ''
      fileAnchor = -1
      const body = $('tabBody')
      if (body) body.innerHTML = '<div class="loadrow">Loading…</div>'
      void reloadFiles()
    }
    window.fileCrumb = (i) => {
      const segs = filesRel ? filesRel.split('/') : []
      goFolder(i < 0 ? '' : segs.slice(0, i + 1).join('/'))
    }
    window.fileFilter = (v) => { fileQuery = v; paintFileList() }
    window.fileSetGrid = (on) => {
      fileGrid = on
      localStorage.setItem('fm.grid', on ? '1' : '0')
      paintFileHead()
      paintFileList()
    }
    window.fileClearSel = () => { fileSel.clear(); paintFileHead(); paintFileList() }
    window.fileToggle = (ev, i) => {
      ev.stopPropagation()
      const e = fileShown[i]
      if (!e) return
      if (fileSel.has(e.name)) fileSel.delete(e.name)
      else fileSel.add(e.name)
      fileAnchor = i
      paintFileHead()
      paintFileList()
    }
    /** shift-click fills in everything between the last click and this one */
    function selectRange(i) {
      const from = fileAnchor < 0 ? i : fileAnchor
      for (let j = Math.min(from, i); j <= Math.max(from, i); j++) {
        if (fileShown[j]) fileSel.add(fileShown[j].name)
      }
      paintFileHead()
      paintFileList()
    }
    window.fileTap = (ev, i) => {
      const e = fileShown[i]
      if (!e) return
      if (ev.shiftKey) return selectRange(i)
      // once anything is selected, tapping keeps picking rather than navigating
      if (fileSel.size || ev.ctrlKey || ev.metaKey) return window.fileToggle(ev, i)
      fileAnchor = i
      openEntry(i, ev)
    }

    async function openEntry(i, ev) {
      const e = fileShown[i]
      if (!e) return
      if (e.isDir) return goFolder(relOf(e.name))
      if (isImage(e.name)) return window.filePreviewOpen(i)
      if (!e.isText) return window.fileMenu(ev, i) // binaries have no default action — offer the menu
      const body = $('tabBody')
      if (body) body.innerHTML = '<div class="loadrow">Opening…</div>'
      try {
        const res = await request(sheetId, 'readFile', { path: relOf(e.name) })
        fileView = { rel: relOf(e.name), content: res?.content ?? '', dirty: false }
      } catch (err) {
        toast(err.message, true)
        fileView = null
      }
      renderTab()
    }

    // ---------- the row / sort popover ----------

    function closeFileMenu() {
      fileMenuEl?.remove()
      fileMenuEl = null
    }
    /** items: { label, icon, cls?, run } — a null entry draws a separator */
    function openPopover(anchor, items) {
      closeFileMenu()
      const menu = document.createElement('div')
      menu.className = 'fmenu'
      menu.innerHTML = items.map((it, i) => it
        ? `<button class="${it.cls || ''}" data-i="${i}">${it.icon}<span>${esc(it.label)}</span></button>`
        : '<div class="msep"></div>').join('')
      document.body.appendChild(menu)
      const r = anchor.getBoundingClientRect()
      const left = Math.max(10, Math.min(r.right - menu.offsetWidth, innerWidth - menu.offsetWidth - 10))
      const below = r.bottom + 6
      menu.style.left = `${left}px`
      menu.style.top = `${below + menu.offsetHeight > innerHeight - 10 ? Math.max(10, r.top - menu.offsetHeight - 6) : below}px`
      menu.onclick = (ev) => {
        const btn = ev.target.closest('button[data-i]')
        if (!btn) return
        closeFileMenu()
        items[Number(btn.dataset.i)].run()
      }
      fileMenuEl = menu
      setTimeout(() => document.addEventListener('click', closeFileMenu, { once: true }), 0)
      // it is anchored, not attached — scrolling would leave it floating over nothing
      addEventListener('scroll', closeFileMenu, { once: true, capture: true })
    }

    window.fileMenu = (ev, i) => {
      ev.preventDefault()
      ev.stopPropagation()
      const e = fileShown[i]
      if (!e) return
      const items = []
      if (e.isDir) items.push({ label: 'Open', icon: icons.folder, run: () => goFolder(relOf(e.name)) })
      else {
        if (isImage(e.name)) items.push({ label: 'Preview', icon: icons.image, run: () => window.filePreviewOpen(i) })
        if (e.isText) items.push({ label: 'Edit', icon: icons.pencil, run: () => openEntry(i, ev) })
        items.push({ label: 'Download', icon: icons.download, run: () => downloadRel(relOf(e.name), e.name) })
      }
      items.push({ label: 'Rename', icon: icons.tag, run: () => renameEntry(e) })
      items.push({ label: fileSel.has(e.name) ? 'Deselect' : 'Select', icon: icons.check, run: () => window.fileToggle(ev, i) })
      items.push(null)
      items.push({ label: 'Delete', icon: icons.trash, cls: 'red', run: () => deletePaths([e.name]) })
      openPopover(ev.currentTarget ?? ev.target, items)
    }

    window.fileSortMenu = (ev) => {
      ev.stopPropagation()
      const pick = (key) => () => {
        fileSort = { key, dir: fileSort.key === key ? -fileSort.dir : 1 }
        paintFileList()
      }
      const mark = (key) => (fileSort.key === key ? { cls: 'on', icon: icons.check } : { cls: '', icon: icons.sort })
      openPopover(ev.currentTarget, [
        { label: `Name${fileSort.key === 'name' ? (fileSort.dir > 0 ? ' (A–Z)' : ' (Z–A)') : ''}`, ...mark('name'), run: pick('name') },
        { label: `Size${fileSort.key === 'size' ? (fileSort.dir > 0 ? ' (small first)' : ' (large first)') : ''}`, ...mark('size'), run: pick('size') },
        { label: `Modified${fileSort.key === 'date' ? (fileSort.dir > 0 ? ' (oldest)' : ' (newest)') : ''}`, ...mark('date'), run: pick('date') }
      ])
    }

    // ---------- create, rename, delete ----------

    window.fileNewFolder = async () => {
      const name = prompt('Name the new folder')?.trim()
      if (!name) return
      if (/[\\/:*?"<>|]/.test(name)) return toast('That name has characters a folder can\'t use.', true)
      try {
        await request(sheetId, 'mkdir', { path: relOf(name) })
        toast('Folder created')
        await reloadFiles()
      } catch (e) {
        toast(e.message, true)
      }
    }

    async function renameEntry(entry) {
      const name = prompt(`Rename “${entry.name}” to`, entry.name)?.trim()
      if (!name || name === entry.name) return
      if (/[\\/:*?"<>|]/.test(name)) return toast('That name has characters a file can\'t use.', true)
      try {
        await request(sheetId, 'movePath', { from: relOf(entry.name), to: relOf(name) })
        fileSel.delete(entry.name)
        toast('Renamed')
        await reloadFiles()
      } catch (e) {
        toast(e.message, true)
      }
    }

    async function deletePaths(names) {
      const what = names.length === 1 ? `“${names[0]}”` : `${names.length} items`
      if (!confirm(`Delete ${what}? Folders go with everything inside them, and this cannot be undone.`)) return
      try {
        const res = await request(sheetId, 'deleteFiles', { paths: names.map(relOf) }, 45_000)
        const failed = res?.failed?.length ?? 0
        toast(failed ? `Deleted ${res.deleted}, ${failed} could not be removed` : `Deleted ${res?.deleted ?? names.length}`, failed > 0)
        names.forEach((n) => fileSel.delete(n))
        await reloadFiles()
      } catch (e) {
        toast(e.message, true)
      }
    }
    window.fileDeleteSel = () => deletePaths([...fileSel])

    // ---------- transfers ----------

    function track(name, state) {
      const t = { id: `${name}-${transfers.length}-${performance.now()}`, name, sent: 0, total: 0, state }
      transfers.push(t)
      paintTray()
      return t
    }
    /** Successful transfers fade out of the tray; failures stay until the next one. */
    function settleTransfer(t, error) {
      t.state = error ? 'bad' : 'done'
      if (error) t.error = error
      else t.sent = t.total
      paintTray()
      if (!error) {
        setTimeout(() => {
          transfers = transfers.filter((x) => x !== t)
          paintTray()
        }, 3500)
      }
    }

    const b64Of = (blob) => new Promise((resolve, reject) => {
      const reader = new FileReader()
      reader.onload = () => {
        const url = String(reader.result)
        resolve(url.slice(url.indexOf(',') + 1))
      }
      reader.onerror = () => reject(new Error('Could not read that file'))
      reader.readAsDataURL(blob)
    })

    window.filePick = () => {
      const input = document.createElement('input')
      input.type = 'file'
      input.multiple = true
      input.onchange = () => { if (input.files?.length) void uploadFiles([...input.files]) }
      input.click()
    }

    async function uploadFiles(files) {
      const dest = filesRel
      transfers = transfers.filter((t) => t.state === 'up' || t.state === 'down') // clear the last batch's leftovers
      let ok = 0
      for (const file of files) {
        const t = track(file.name, 'up')
        t.total = file.size
        paintTray()
        try {
          await uploadOne(file, dest, t)
          settleTransfer(t)
          ok++
        } catch (e) {
          settleTransfer(t, e.message)
        }
      }
      toast(ok === files.length ? `Uploaded ${ok} file${ok === 1 ? '' : 's'}` : `Uploaded ${ok} of ${files.length}`, ok !== files.length)
      if (dest === filesRel) await reloadFiles()
    }

    async function uploadOne(file, destRel, t) {
      const path = destRel ? `${destRel}/${file.name}` : file.name
      const uploadId = (crypto.randomUUID?.() ?? `${Date.now()}${Math.random()}`).replace(/[^a-zA-Z0-9]/g, '')
      const total = file.size
      const chunks = Math.ceil(total / XFER_CHUNK)
      let next = 0
      const worker = async () => {
        for (let i = next++; i < chunks; i = next++) {
          const start = i * XFER_CHUNK
          const slice = file.slice(start, Math.min(start + XFER_CHUNK, total))
          const data = await b64Of(slice)
          await request(sheetId, 'uploadChunk', { path, uploadId, offset: start, totalBytes: total, data }, XFER_TIMEOUT)
          t.sent += slice.size
          paintTray()
        }
      }
      await Promise.all(Array.from({ length: Math.min(XFER_PARALLEL, Math.max(1, chunks)) }, worker))
      // the commit is its own round trip so it can only land after every slice has
      await request(sheetId, 'uploadChunk', { path, uploadId, totalBytes: total, final: true }, XFER_TIMEOUT)
    }

    async function fetchBlob(rel, t) {
      const parts = []
      let offset = 0
      for (;;) {
        const res = await request(sheetId, 'downloadChunk', { path: rel, offset, length: XFER_CHUNK }, XFER_TIMEOUT)
        const bytes = Uint8Array.from(atob(res?.data || ''), (c) => c.charCodeAt(0))
        parts.push(bytes)
        offset += bytes.length
        if (t) { t.total = res?.size ?? 0; t.sent = offset; paintTray() }
        if (res?.eof || bytes.length === 0) break
      }
      return new Blob(parts)
    }

    async function downloadRel(rel, name) {
      const t = track(name, 'down')
      try {
        const blob = await fetchBlob(rel, t)
        const a = document.createElement('a')
        a.href = URL.createObjectURL(blob)
        a.download = name
        a.click()
        setTimeout(() => URL.revokeObjectURL(a.href), 2000)
        settleTransfer(t)
      } catch (e) {
        settleTransfer(t, e.message)
        toast(e.message, true)
      }
    }

      if (folders.length) toast(`Folders can't be downloaded — skipping ${folders.length}`, true)
      for (const name of files) await downloadRel(relOf(name), name)
    }

    // ---------- drag-and-drop and keyboard ----------

    const dragHasFiles = (ev) => [...(ev.dataTransfer?.types ?? [])].includes('Files')
    function wireDrop(zone) {
      if (!zone) return
      let depth = 0
      const end = () => { depth = 0; zone.classList.remove('drag') }
      zone.addEventListener('dragenter', (ev) => {
        if (!dragHasFiles(ev)) return
        ev.preventDefault()
        depth++
        zone.classList.add('drag')
      })
      zone.addEventListener('dragover', (ev) => {
        if (!dragHasFiles(ev)) return
        ev.preventDefault()
        ev.dataTransfer.dropEffect = 'copy'
      })
      zone.addEventListener('dragleave', () => { if (--depth <= 0) end() })
      zone.addEventListener('drop', (ev) => {
        if (!dragHasFiles(ev)) return
        ev.preventDefault()
        end()
        // getAsFile has to run before any await — the item list empties as soon
        // as the event finishes. Dropped folders arrive as unreadable entries.
        const items = [...(ev.dataTransfer?.items ?? [])]
        let folders = 0
        const files = []
        if (items.length && items[0].webkitGetAsEntry) {
          for (const item of items) {
            if (item.webkitGetAsEntry()?.isDirectory) { folders++; continue }
            const file = item.getAsFile()
            if (file) files.push(file)
          }
        } else {
          files.push(...(ev.dataTransfer?.files ?? []))
        }
        if (folders) toast('Whole folders can\'t be dropped — zip them first.', true)
        if (files.length) void uploadFiles(files)
      })
    }

    document.addEventListener('keydown', (ev) => {

      const tag = (ev.target?.tagName || '').toLowerCase()

      if (ev.key === 'Escape') {
        if (fileMenuEl) return closeFileMenu()

      }
      if ((ev.key === 'Delete' || ev.key === 'Backspace') && fileSel.size && !fileView && !filePreview) {
