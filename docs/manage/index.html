<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07070c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>ELauncher — Remote</title>
  <link rel="icon" href="../icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..900&display=swap" />
  <style>
    /* ============================================================
       ELauncher Remote — obsidian aurora design system
       Layers: tokens → base → shell → cards → sheet/tabs → forms →
       lists → console → files → settings → states → desktop deck
       ============================================================ */
    * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
    [hidden] { display: none !important; }
    :root {
      --bg: #07070c;
      --bg-soft: #0c0c14;
      --card: #10101a;
      --card-2: #181826;
      --glass: rgba(13, 13, 21, 0.72);
      --line: rgba(255, 255, 255, 0.06);
      --line-strong: rgba(255, 255, 255, 0.13);
      --text: #f5f6fb;
      --dim: #a3a7bd;
      --faint: #676b82;
      --accent: #8b7cff;
      --accent-2: #2fd9f7;
      --accent-3: #e879f9;
      --accent-soft: rgba(139, 124, 255, 0.14);
      --green: #34d399;
      --green-soft: rgba(52, 211, 153, 0.12);
      --red: #fb7185;
      --red-soft: rgba(251, 113, 133, 0.12);
      --amber: #fbbf24;
      --amber-soft: rgba(251, 191, 36, 0.12);
      --radius: 20px;
      --radius-sm: 13px;
      --mono: ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --shadow-1: 0 18px 50px rgba(0, 0, 0, 0.45);
      --shadow-2: 0 8px 24px rgba(0, 0, 0, 0.35);
    }
    html { background: var(--bg); scrollbar-color: #2a2a3a var(--bg); }
    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      font: 15px/1.5 'Inter', -apple-system, 'Segoe UI', Roboto, sans-serif;
      font-optical-sizing: auto;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    /* aurora backdrop: two drifting light fields behind everything */
    body::before, body::after {
      content: ''; position: fixed; z-index: -1; pointer-events: none;
      width: 82vmax; height: 82vmax; border-radius: 50%;
      filter: blur(70px); opacity: 0.55; will-change: transform;
    }
    body::before {
      top: -46vmax; left: -18vmax;
      background: radial-gradient(closest-side, rgba(139, 124, 255, 0.20), rgba(232, 121, 249, 0.06) 55%, transparent 72%);
      animation: drift-a 26s ease-in-out infinite alternate;
    }
    body::after {
      top: -50vmax; right: -30vmax;
      background: radial-gradient(closest-side, rgba(47, 217, 247, 0.13), rgba(139, 124, 255, 0.05) 55%, transparent 72%);
      animation: drift-b 32s ease-in-out infinite alternate;
    }
    @keyframes drift-a { to { transform: translate(9vmax, 7vmax) scale(1.08); } }
    @keyframes drift-b { to { transform: translate(-8vmax, 9vmax) scale(0.94); } }
    ::selection { background: rgba(139, 124, 255, 0.35); }
    button { font: inherit; cursor: pointer; border: 0; background: none; color: inherit; }
    input, select, textarea { font: inherit; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-thumb { background: #23233370; border: 3px solid transparent; border-radius: 99px; background-clip: content-box; }
    ::-webkit-scrollbar-thumb:hover { background: #32324890; background-clip: content-box; border: 3px solid transparent; }
    ::-webkit-scrollbar-track { background: transparent; }
    .shell { max-width: 560px; margin: 0 auto; padding: 0 16px calc(44px + env(safe-area-inset-bottom)); }
    .row { display: flex; align-items: center; }
    .faint { color: var(--faint); }

    /* ---------- top bar ---------- */
    .top {
      position: sticky; top: 0; z-index: 20;
      display: flex; align-items: center; gap: 11px;
      padding: calc(12px + env(safe-area-inset-top)) 2px 12px;
      margin: 0 -16px 20px; padding-left: 18px; padding-right: 12px;
      background: var(--glass);
      backdrop-filter: blur(22px) saturate(1.5); -webkit-backdrop-filter: blur(22px) saturate(1.5);
      border-bottom: 1px solid var(--line);
    }
    .top img { width: 32px; height: 32px; border-radius: 10px; box-shadow: 0 4px 14px rgba(139, 124, 255, 0.3); }
    .wordmark { font-weight: 800; font-size: 17px; letter-spacing: -0.03em; white-space: nowrap; }
    .wordmark span {
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .live {
      margin-left: auto; display: flex; align-items: center; gap: 7px;
      font-size: 11px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--green);
      padding: 6px 11px; border-radius: 99px;
      background: var(--green-soft); border: 1px solid rgba(52, 211, 153, 0.25);
    }
    .live .dot { width: 6px; height: 6px; border-radius: 99px; background: var(--green); animation: pulse 2s infinite; box-shadow: 0 0 10px var(--green); }
    .live.poll { color: var(--dim); background: var(--card-2); border-color: var(--line); }
    .live.poll .dot { background: var(--dim); box-shadow: none; }
    @media (max-width: 380px) { .live { display: none; } }
    .iconbtn {
      display: grid; place-items: center; width: 38px; height: 38px; border-radius: 12px;
      color: var(--dim); border: 1px solid transparent; transition: all 0.16s var(--ease);
    }
    .iconbtn:hover { color: var(--text); background: var(--card-2); border-color: var(--line); }
    .iconbtn:active { transform: scale(0.92); }
    .iconbtn.on { color: var(--accent); background: var(--accent-soft); }

    /* ---------- login ---------- */
    .login { padding-top: 8dvh; display: flex; flex-direction: column; align-items: center; text-align: center; }
    .halo { position: relative; width: 96px; height: 96px; margin-bottom: 24px; }
    .halo::before {
      content: ''; position: absolute; inset: -34px;
      background: radial-gradient(closest-side, rgba(139, 124, 255, 0.45), rgba(47, 217, 247, 0.14), transparent);
      filter: blur(16px); border-radius: 50%; animation: pulse 4s ease-in-out infinite;
    }
    .halo img { position: relative; width: 96px; height: 96px; border-radius: 26px; box-shadow: var(--shadow-2); }
    .login h1 { font-size: 30px; font-weight: 800; letter-spacing: -0.04em; line-height: 1.15; }
    .login h1 span {
      background: linear-gradient(90deg, var(--accent), var(--accent-3) 55%, var(--accent-2));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .login p { color: var(--dim); font-size: 14px; margin: 10px 0 28px; max-width: 320px; line-height: 1.55; }
    .panel {
      width: 100%; background: var(--card); border: 1px solid var(--line);
      border-radius: var(--radius); padding: 22px; text-align: left;
      box-shadow: var(--shadow-1);
      position: relative; overflow: hidden;
    }
    .panel::before {
      content: ''; position: absolute; inset: 0 0 auto; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(139, 124, 255, 0.5), rgba(47, 217, 247, 0.4), transparent);
    }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 11px; font-weight: 700; color: var(--faint); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 7px; }
    .field input {
      width: 100%; padding: 13px 15px; border-radius: var(--radius-sm);
      background: var(--bg-soft); border: 1px solid var(--line); color: var(--text); outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .field input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); outline: none; }
    .cta {
      width: 100%; padding: 14px; border-radius: var(--radius-sm); font-weight: 750; color: #fff; letter-spacing: 0.01em;
      background: linear-gradient(135deg, var(--accent), #5f8bff 55%, var(--accent-2));
      background-size: 150% 100%;
      box-shadow: 0 10px 30px rgba(139, 124, 255, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.22);
      transition: all 0.2s var(--ease);
    }
    .cta:hover { background-position: 100% 0; box-shadow: 0 12px 36px rgba(139, 124, 255, 0.48), inset 0 1px 0 rgba(255, 255, 255, 0.22); transform: translateY(-1px); }
    .cta:active { transform: translateY(0) scale(0.99); }
    .cta:disabled { opacity: 0.55; transform: none; }
    .err { color: var(--red); font-size: 13px; min-height: 18px; margin: 10px 2px 2px; }

    /* ---------- server cards (mobile) ---------- */
    .card {
      position: relative;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.02), transparent 40%), var(--card);
      border: 1px solid var(--line); border-radius: var(--radius);
      padding: 17px; margin-bottom: 14px; box-shadow: var(--shadow-2);
      transition: border-color 0.2s var(--ease), transform 0.2s var(--ease);
    }
    .card.offline { opacity: 0.72; filter: saturate(0.7); }
    .head { display: flex; align-items: center; gap: 13px; }
    .tile {
      position: relative; width: 48px; height: 48px; border-radius: 15px; flex: none;
      display: grid; place-items: center; font-weight: 800; font-size: 20px; color: #fff;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.45);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25), 0 6px 18px rgba(0, 0, 0, 0.35);
    }
    .tile .st {
      position: absolute; right: -3px; bottom: -3px; width: 14px; height: 14px; border-radius: 99px;
      border: 3px solid var(--card); background: var(--faint);
    }
    .tile .st.on { background: var(--green); box-shadow: 0 0 10px rgba(52, 211, 153, 0.8); animation: pulse 2s infinite; }
    .tile .st.warm { background: var(--amber); box-shadow: 0 0 10px rgba(251, 191, 36, 0.6); }
    .tile .st.dead { background: var(--red); }
    .who { min-width: 0; flex: 1; }
    .who .nm { font-weight: 750; font-size: 17px; letter-spacing: -0.015em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .who .ln { font-size: 12.5px; color: var(--dim); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chip {
      flex: none; font-size: 10.5px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase;
      padding: 5px 11px; border-radius: 99px; border: 1px solid var(--line-strong); color: var(--dim);
    }
    .chip.on { color: var(--green); border-color: rgba(52, 211, 153, 0.4); background: var(--green-soft); text-shadow: 0 0 12px rgba(52, 211, 153, 0.5); }
    .chip.warm { color: var(--amber); border-color: rgba(251, 191, 36, 0.4); background: var(--amber-soft); }
    .chip.dead { color: var(--red); border-color: rgba(251, 113, 133, 0.35); background: var(--red-soft); }
    .chip.acc { color: var(--accent); border-color: rgba(139, 124, 255, 0.4); background: var(--accent-soft); }

    .pills { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 13px; }
    .pill {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 12px; color: var(--dim); padding: 6px 11px;
      background: var(--card-2); border: 1px solid var(--line); border-radius: 99px;
    }
    .pill svg { width: 12px; height: 12px; color: var(--faint); }
    .pill b { color: var(--text); font-weight: 650; }

    .addr {
      display: flex; align-items: center; gap: 9px; width: 100%;
      margin-top: 12px; padding: 12px 14px; border-radius: var(--radius-sm);
      background: linear-gradient(90deg, rgba(139, 124, 255, 0.10), rgba(47, 217, 247, 0.06));
      border: 1px dashed rgba(139, 124, 255, 0.4);
      color: var(--text); font: 12.5px var(--mono);
      transition: border-color 0.16s;
    }
    .addr:hover { border-color: rgba(139, 124, 255, 0.7); }
    .addr svg { width: 14px; height: 14px; color: var(--accent); flex: none; }
    .addr .a { flex: 1; min-width: 0; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .addr .c { color: var(--faint); font-size: 10.5px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; font-family: 'Inter', sans-serif; }

    .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-top: 13px; }
    .acts.single { grid-template-columns: 1fr; }
    .btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 13px; border-radius: var(--radius-sm); font-weight: 700; font-size: 14px;
      border: 1px solid var(--line-strong); background: var(--card-2); color: var(--text);
      transition: all 0.16s var(--ease);
    }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.45; }
    .btn svg { width: 15px; height: 15px; }
    .btn.start { background: var(--green-soft); border-color: rgba(52, 211, 153, 0.45); color: var(--green); }
    .btn.stop { background: var(--red-soft); border-color: rgba(251, 113, 133, 0.4); color: var(--red); }
    .btn.manage {
      margin-top: 10px; width: 100%;
      background: var(--accent-soft); border-color: rgba(139, 124, 255, 0.35); color: var(--accent);
    }

    .conbtn {
      width: 100%; display: flex; align-items: center; gap: 8px; margin-top: 12px;
      color: var(--faint); font-size: 12.5px; font-weight: 650; padding: 4px 2px;
      transition: color 0.15s;
    }
    .conbtn:hover { color: var(--dim); }
    .conbtn svg { width: 13px; height: 13px; transition: transform 0.2s; }
    .conbtn.open svg { transform: rotate(90deg); }

    .hintline { margin-top: 11px; font-size: 12px; color: var(--faint); line-height: 1.5; }
    .hintline b { color: var(--text); }
    .home-head {
      display: flex; align-items: center; gap: 8px;
      font-size: 11px; font-weight: 800; letter-spacing: 0.09em; text-transform: uppercase;
      color: var(--faint); margin: 26px 2px 11px;
    }
    .home-head::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--line-strong), transparent); }

    /* ---------- control-panel sheet ---------- */
    .sheet-bg { position: fixed; inset: 0; z-index: 40; background: rgba(4, 4, 8, 0.6);
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); animation: fade 0.2s; }
    @keyframes fade { from { opacity: 0; } }
    .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-height: 94dvh;
      background: linear-gradient(180deg, var(--bg-soft), var(--bg) 120px);
      border-top-left-radius: 24px; border-top-right-radius: 24px;
      border-top: 1px solid var(--line-strong); box-shadow: 0 -24px 70px rgba(0, 0, 0, 0.65);
      display: flex; flex-direction: column; animation: slideup 0.3s var(--ease);
      max-width: 560px; margin: 0 auto; }
    @keyframes slideup { from { transform: translateY(100%); } }
    .sheet-grip { width: 40px; height: 4px; border-radius: 99px; background: var(--line-strong); margin: 10px auto 5px; flex: none; }
    .sheet-top { display: flex; align-items: center; gap: 11px; padding: 4px 16px 13px; border-bottom: 1px solid var(--line); }
    .sheet-top .tile { width: 40px; height: 40px; border-radius: 12px; font-size: 17px; }
    .sheet-top .nm { font-weight: 750; font-size: 16.5px; letter-spacing: -0.01em; }
    .sheet-top .sub { font-size: 12px; color: var(--faint); margin-top: 1px; }
    .sheet-tabs { display: flex; gap: 5px; padding: 11px 14px; overflow-x: auto; border-bottom: 1px solid var(--line); flex: none; scrollbar-width: none; }
    .sheet-tabs::-webkit-scrollbar { display: none; }
    .sheet-tabs button {
      flex: none; display: inline-flex; align-items: center; gap: 7px;
      padding: 9px 14px; border-radius: 11px; font-size: 13px; font-weight: 650; color: var(--dim);
      white-space: nowrap; border: 1px solid transparent; transition: all 0.15s var(--ease);
    }
    .sheet-tabs button svg { width: 14px; height: 14px; opacity: 0.8; }
    .sheet-tabs button.on { background: var(--accent-soft); color: var(--accent); border-color: rgba(139, 124, 255, 0.25); }
    .sheet-body { padding: 16px; overflow-y: auto; flex: 1; overscroll-behavior: contain; }

    /* ---------- forms ---------- */
    .frow { margin-bottom: 15px; }
    .frow label { display: block; font-size: 12px; font-weight: 650; color: var(--faint); margin-bottom: 6px; }
    .frow input, .frow select {
      width: 100%; padding: 11px 13px; border-radius: 11px; background: var(--card-2);
      border: 1px solid var(--line); color: var(--text); outline: none; transition: border-color 0.15s, box-shadow 0.15s;
    }
    .frow input:focus, .frow select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .frow .hint2 { font-size: 11.5px; color: var(--faint); margin-top: 5px; line-height: 1.5; }
    .frow.check { display: flex; align-items: center; gap: 10px; }
    .frow.check input { width: auto; accent-color: var(--accent); }
    .frow.check label { margin: 0; color: var(--text); font-size: 13.5px; font-weight: 500; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    input[type='checkbox'] { accent-color: var(--accent); width: 17px; height: 17px; }
    .savebar {
      position: sticky; bottom: -16px; z-index: 5; margin: 10px -16px -16px;
      padding: 14px 16px calc(15px + env(safe-area-inset-bottom));
      background: linear-gradient(transparent, var(--bg) 34%);
      display: flex; gap: 10px; align-items: center;
    }
    .savebar .cta { flex: 1; padding: 13px; }

    /* ---------- lists ---------- */
    .plister .prow {
      display: flex; align-items: center; gap: 11px; padding: 11px 10px; margin: 0 -10px;
      border-top: 1px solid var(--line); transition: background 0.14s;
    }
    .plister .prow:first-child { border-top: 0; }
    .plister .prow:hover { background: rgba(255, 255, 255, 0.025); }
    .plister .pn { font-weight: 650; }
    .plister .pm { font-size: 12px; color: var(--faint); }
    .avatar {
      width: 34px; height: 34px; border-radius: 11px; flex: none;
      display: grid; place-items: center; font-weight: 800; font-size: 14px; color: #fff;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
    }
    .minibtn {
      padding: 8px 13px; border-radius: 10px; font-size: 12.5px; font-weight: 650;
      border: 1px solid var(--line-strong); background: var(--card-2); color: var(--text);
      transition: all 0.15s var(--ease);
    }
    .minibtn:active { transform: scale(0.96); }
    .minibtn.red { color: var(--red); border-color: rgba(251, 113, 133, 0.35); background: var(--red-soft); }
    .minibtn.acc { color: var(--accent); border-color: rgba(139, 124, 255, 0.4); background: var(--accent-soft); }
    .searchbar {
      display: flex; align-items: center; gap: 9px; padding: 11px 13px; margin-bottom: 12px;
      border-radius: var(--radius-sm); background: var(--card-2); border: 1px solid var(--line);
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .searchbar:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .searchbar input { flex: 1; background: none; border: 0; color: var(--text); outline: none; }
    .searchbar svg { width: 15px; height: 15px; color: var(--faint); }
    .grouphead { font-size: 11px; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase; color: var(--faint); margin: 18px 0 9px; }
    .loadrow { text-align: center; color: var(--faint); padding: 30px 0; font-size: 13px; }
    .dangerzone { border: 1px solid rgba(251, 113, 133, 0.35); background: rgba(251, 113, 133, 0.05); border-radius: 14px; padding: 15px; margin-bottom: 8px; }
    .p-tile { display: grid; place-items: center; border-radius: 9px; background: var(--card-2); color: var(--faint); font-weight: 700; }

    /* ---------- console: terminal treatment ---------- */
    .con-wrap { border: 1px solid var(--line-strong); border-radius: 14px; overflow: hidden; background: #060609; box-shadow: inset 0 2px 18px rgba(0, 0, 0, 0.5); }
    .con-head {
      display: flex; align-items: center; gap: 8px; padding: 9px 13px;
      background: rgba(255, 255, 255, 0.028); border-bottom: 1px solid var(--line);
      font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--faint);
    }
    .con-head .cdot { width: 8px; height: 8px; border-radius: 99px; background: var(--faint); }
    .con-head .cdot.on { background: var(--green); box-shadow: 0 0 8px rgba(52, 211, 153, 0.8); animation: pulse 2s infinite; }
    .console {
      display: none; padding: 13px 14px;
      font: 11.5px/1.6 var(--mono); color: #c2c8dc;
      max-height: 250px; overflow-y: auto; white-space: pre-wrap; word-break: break-word;
    }
    .console.open { display: block; }
    .con-wrap .console { display: block; max-height: 44dvh; }
    .cmdrow { display: none; gap: 8px; margin-top: 10px; }
    .cmdrow.open { display: flex; }
    .cmdrow input {
      flex: 1; min-width: 0; padding: 12px 14px; border-radius: 12px;
      background: var(--card-2); border: 1px solid var(--line); color: var(--text); outline: none;
      font: 12.5px var(--mono); transition: border-color 0.15s, box-shadow 0.15s;
    }
    .cmdrow input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .cmdrow button {
      display: grid; place-items: center; width: 46px; border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), #5f8bff); color: #fff;
      box-shadow: 0 6px 18px rgba(139, 124, 255, 0.35); transition: all 0.15s var(--ease);
    }
    .cmdrow button:active { transform: scale(0.94); }

    function toast(message, bad = false) {
      const el = document.createElement('div')
      el.className = `toast${bad ? ' bad' : ''}`
      el.textContent = message
      $('toasts').appendChild(el)
      setTimeout(() => el.remove(), 2600)
    }

    const hueOf = (id) => [...String(id)].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7) % 360
    const gradOf = (id) => {
      const h = hueOf(id)
      return `linear-gradient(135deg, hsl(${h} 68% 55%), hsl(${(h + 46) % 360} 74% 45%))`
    }

    function fmtUptime(ms) {
      const m = Math.floor(ms / 60_000)
      const h = Math.floor(m / 60)
      const d = Math.floor(h / 24)
      return d > 0 ? `${d}d ${h % 24}h` : h > 0 ? `${h}h ${m % 60}m` : `${Math.max(0, m)}m`
    }

    /** serverId -> owning account (yours, or the friend who shared it with you) */
    const ownerOf = new Map()

    async function queue(serverId, action, payload = '') {
      const { error } = await supabase.from('server_commands').insert({
        server_id: serverId, owner_id: ownerOf.get(serverId) ?? me, sender_id: me, sender_name: myName, action, payload
      })
      if (error) throw new Error(error.message)
    }

    async function fetchServers() {
      // your servers + servers other people shared with you (Access tab in the launcher)
      const [mineRes, sharesRes] = await Promise.all([
        supabase.from('server_status').select('*').eq('owner_id', me),
        supabase.from('server_shares').select('server_id, server_name, owner_id').eq('grantee_id', me)
      ])
      if (mineRes.error) throw new Error(mineRes.error.message)
      const mine = (mineRes.data ?? []).map((row) => ({ ...row, _owner: null }))
      mine.forEach((row) => ownerOf.set(row.server_id, me))

      const shares = sharesRes.error ? [] : (sharesRes.data ?? [])
      let shared = []
      if (shares.length) {
        const ids = shares.map((s) => s.server_id)
        const ownerIds = [...new Set(shares.map((s) => s.owner_id))]
        const [stRes, ownersRes] = await Promise.all([
          supabase.from('server_status').select('*').in('server_id', ids),
          supabase.from('profiles').select('id, username').in('id', ownerIds)
        ])
        const stMap = new Map((stRes.data ?? []).map((row) => [row.server_id, row]))
        const names = new Map((ownersRes.data ?? []).map((p) => [p.id, p.username]))
        const mineIds = new Set(mine.map((row) => row.server_id))
        shared = shares
          .filter((s) => !mineIds.has(s.server_id))
          .map((s) => {
            ownerOf.set(s.server_id, s.owner_id)
            const st = stMap.get(s.server_id)
            return {
              ...(st ?? { server_id: s.server_id, name: s.server_name, state: 'stopped', players: [], console: '', updated_at: '' }),
              name: (st && st.name) || s.server_name,
              _owner: names.get(s.owner_id) ?? 'friend'
            }
          })
      }
      return [...mine, ...shared].sort((a, b) => (a.name || '').localeCompare(b.name || ''))
    }

    /** Watch for a state via the live-merged rows; fetch as fallback when realtime is off. */
    async function waitForState(serverId, wanted, timeoutMs) {
      const until = Date.now() + timeoutMs
      let lastFetch = Date.now()
      while (Date.now() < until) {
        await new Promise((r) => setTimeout(r, rtLive ? 500 : 1500))
        if (!rtLive && Date.now() - lastFetch > 3500) {
          lastFetch = Date.now()
          const rows = await fetchServers().catch(() => null)
          if (rows) applyLayout(rows)
        }
        const row = rowsById.get(serverId)
        if (row && row.state === wanted) return true
      }
      return false
    }

    /** Without realtime, poll in quick bursts right after an action so the click still feels snappy. */
    function refreshSoon() {
      if (rtLive) return
      for (const ms of [1200, 3200, 6200]) setTimeout(() => void refresh(), ms)
    }

    /** Flip the card into its transitional state immediately — the heartbeat corrects it if the host disagrees. */
    function optimistic(serverId, state) {
      const row = rowsById.get(serverId)
      if (row) {
        row.state = state
        schedulePaint()
      }
    }

    window.act = async (serverId, action) => {
      if ((action === 'stop' || action === 'restart') && !confirm(`${action === 'stop' ? 'Stop' : 'Restart'} this server?`)) return
      try {
        if (action === 'restart') {
          restarting.add(serverId)
          optimistic(serverId, 'stopping')
          toast('Restarting — saving and stopping first…')
          await queue(serverId, 'stop')
          if (await waitForState(serverId, 'stopped', 120_000)) {
            await queue(serverId, 'start')
            optimistic(serverId, 'starting')
            toast('Starting back up')
          } else toast('The server did not stop in time', true)
          restarting.delete(serverId)
        } else {
          optimistic(serverId, action === 'start' ? 'starting' : 'stopping')
          await queue(serverId, action)
          toast(action === 'start' ? 'Start request sent' : 'Stop request sent')
        }
        refreshSoon()
      } catch (e) {
        restarting.delete(serverId)
        toast(e.message ?? 'Command failed', true)
        void refresh() // roll back the optimistic state
      }
    }

    window.sendCmd = async (serverId, inputId) => {
      const input = $(inputId)
      const value = input.value.trim()
      if (!value) return
      try {
        await queue(serverId, 'command', value)
        input.value = ''
        // echo into the open console right away; the host's own echo replaces it within a beat
        const con = document.querySelector('#dbody .console, #sheetBody .console')
        if (con) {
          con.textContent = (con.textContent === 'No output yet.' ? '' : con.textContent + '\n') + '> ' + value
          con.scrollTop = con.scrollHeight
        }
        refreshSoon()
      } catch (e) {
        toast(e.message ?? 'Command failed', true)
      }
    }

    window.copyAddr = (address) => {
      navigator.clipboard?.writeText(address).then(
        () => toast('Address copied'),

    window.toggleConsole = (serverId) => {
      if (openConsoles.has(serverId)) openConsoles.delete(serverId)
      else openConsoles.add(serverId)
      const con = $(`con-${serverId}`)
      const row = $(`cmdw-${serverId}`)
      const btn = $(`conbtn-${serverId}`)
      const open = openConsoles.has(serverId)
      con?.classList.toggle('open', open)
      row?.classList.toggle('open', open)
      btn?.classList.toggle('open', open)
      if (open && con) con.scrollTop = con.scrollHeight
    }

    function pill(icon, html) {
      return `<span class="pill">${icon}<span>${html}</span></span>`

    function render(rows) {
      const wrap = $('servers')
      rowsById.clear()
      rows.forEach((r) => rowsById.set(r.server_id, r))
      if (!rows.length) {
        wrap.innerHTML = `<div class="empty">
          <div class="halo"><img src="../icon.png" alt="" /></div>
          <b>No servers yet</b>
          Open ELauncher on your PC — its servers appear here automatically.
        </div>`
        return
      }
      wrap.innerHTML = rows.map((row) => {
        const fresh = Date.now() - new Date(row.updated_at).getTime() < HEARTBEAT_MS * 4
        const state = fresh ? row.state : 'offline'
        const busy = restarting.has(row.server_id)
        const running = state === 'running'
        const archived = state === 'archived'
        const transit = state === 'starting' || state === 'stopping'
        const stClass = running ? 'on' : transit ? 'warm' : state === 'offline' ? 'dead' : ''
        const chipText = archived ? 'Archived' : running ? 'Online' : state === 'starting' ? 'Starting…' : state === 'stopping' ? 'Stopping…' : state === 'offline' ? 'PC offline' : 'Stopped'
        const players = fresh ? (row.players ?? []) : []
        const line = state === 'offline'
          ? 'Open ELauncher on your PC to reconnect'
          : archived
            ? 'In cold storage — the world and files are kept'
            : running
              ? (players.length ? `${players.length} playing — ${players.join(', ')}` : 'Online — nobody on yet')
              : state === 'stopped' ? 'Ready when you are' : 'Working on it…'

        const perf = perfOf(row)
        const pills = []
        if (row._owner) pills.push(pill(icons.users, `${esc(row._owner)}&#8217;s PC`))
        if (perf) pills.push(`<span class="pill" style="color:${perf[2]}"><span style="width:7px;height:7px;border-radius:99px;background:${perf[2]};display:inline-block"></span>${perf[1]}</span>`)
        if (fresh && row.started_at && running) pills.push(pill(icons.clock, `<b>${fmtUptime(Date.now() - new Date(row.started_at).getTime())}</b>`))
        if (fresh && row.memory_mb != null && running) pills.push(pill(icons.chipIc, `<b>${(row.memory_mb / 1024).toFixed(1)} GB</b>${row.cpu_percent != null ? ` · ${row.cpu_percent}%` : ''}`))
        if (fresh && running) pills.push(pill(icons.users, `<b>${players.length}</b> online`))
        if (row.community) pills.push(`<span class="pill" style="color:var(--accent);border-color:rgba(139,124,255,.35);background:var(--accent-soft)">${icons.globe}Community</span>`)
        if (row.version) pills.push(pill(icons.tag, esc(row.version)))

        const addr = fresh && row.address
          ? `<button class="addr" onclick="copyAddr('${esc(row.address)}')">${icons.globe}<span class="a">${esc(row.address)}</span><span class="c">tap to copy</span></button>`
          : ''

        const acts = state === 'offline'
          ? ''
          : archived
            ? (canManage(row.server_id)
              ? `<div class="acts">
                  <button class="btn start" onclick="restoreServer('${row.server_id}')">${icons.play} Restore server</button>
                  <button class="btn stop" onclick="deleteArchived('${row.server_id}')">Delete</button>
                </div>`
              : '')
            : running || transit
              ? `<div class="acts">
                  <button class="btn stop" onclick="act('${row.server_id}','stop')" ${busy || transit ? 'disabled' : ''}>${icons.stop} Stop</button>
                  <button class="btn" onclick="act('${row.server_id}','restart')" ${busy || transit ? 'disabled' : ''}>${icons.redo} ${busy ? 'Restarting…' : 'Restart'}</button>
                </div>`
              : `<div class="acts single">
                  <button class="btn start" onclick="act('${row.server_id}','start')" ${busy ? 'disabled' : ''}>${icons.play} Start server</button>
                </div>`

        const manage = state === 'offline' || archived ? '' :
          `<button class="btn manage" onclick="openSheet('${row.server_id}')">${icons.sliders} Open control panel</button>`

        return `<div class="card${state === 'offline' ? ' offline' : ''}">
          <div class="head">
            <div class="tile" style="background:${gradOf(row.server_id)}">${esc((row.name || '?').charAt(0).toUpperCase())}<span class="st ${stClass}"></span></div>
            <div class="who">
              <div class="nm">${esc(row.name || 'Server')}</div>
              <div class="ln">${esc(line)}</div>
            </div>
            <span class="chip ${stClass}">${chipText}</span>
          </div>
          ${pills.length ? `<div class="pills">${pills.join('')}</div>` : ''}
          ${addr}
          ${acts}
          ${manage}
        </div>`
      }).join('')

      for (const id of openConsoles) {
        const con = $(`con-${id}`)
        if (con) con.scrollTop = con.scrollHeight
      }
    }

    // two-way request: queue it, wait for the launcher to answer. Realtime settles
    // it the moment the PC replies; the poll only backstops clouds without realtime.
    const pendingReqs = new Map() // request id -> { resolve, reject }
    function settleRequest(row) {
      if (!row?.done) return
      const p = pendingReqs.get(row.id)
      if (!p) return
      pendingReqs.delete(row.id)
      if (row.error) p.reject(new Error(row.error))
      else p.resolve(row.response)
    }
    async function request(serverId, action, params = {}, timeoutMs = 22000) {
      // design/debug hook (same family as __renderPreview): lets every tab render offline
      if (window.__mockRelay && action in window.__mockRelay) {
        const mock = window.__mockRelay[action]
        return typeof mock === 'function' ? mock(params) : structuredClone(mock)
      }
      if (!serverId) throw new Error('No server selected — pick the server again and retry.')
      const ownerId = ownerOf.get(serverId) ?? me
      const { data, error } = await supabase.from('server_requests')
        .insert({ server_id: serverId, owner_id: ownerId, requester_id: me, action, params }).select('id').single()
      if (error) throw new Error(error.message)
      return await new Promise((resolve, reject) => {
        pendingReqs.set(data.id, { resolve, reject })
        const poll = async () => {
          if (!pendingReqs.has(data.id)) return
          const { data: row } = await supabase.from('server_requests').select('id,done,response,error').eq('id', data.id).maybeSingle()
          if (row?.done) return settleRequest(row)
          setTimeout(poll, rtLive ? 3000 : 1100)
        }
        setTimeout(poll, rtLive ? 2600 : 900)
        setTimeout(() => {
          if (pendingReqs.delete(data.id)) reject(new Error('The PC did not answer — is the launcher running?'))
        }, timeoutMs)
      })
    }

    // per-server info cache: reopening a control panel is instant; freshness heals in the background
    const infoCache = new Map()
    async function loadInfo(serverId) {
      const cached = infoCache.get(serverId)
      if (cached) {
        void request(serverId, 'info').then((i) => infoCache.set(serverId, i)).catch(() => {})
        return cached
      }
      const info = await request(serverId, 'info')
      infoCache.set(serverId, info)
      return info

      return s

      ['Players & combat', '⚔️', /Player|Damage|Stamina|Stomach|Regene|AimAssist|PvP|Invader|Friendly|Poop|UNKO|Hardcore|Respawn|Enhance|Death/i],
      ['Items & drops', '🎒', /Item|Drop|Collection|Supply|Equipment|Weight|Corruption/i],
      ['Base & guilds', '🏠', /Base|Guild|Build|Building/i],
      ['World & time', '🌍', /Time|Random|Difficulty|WorkSpeed|Day|Night|Exp|Predator|Boss/i],
      ['Multiplayer', '👥', /Coop|Multiplay|Login|FastTravel|Start|Logout|Chat|ClientMod|Crossplay|Voice|Show/i],
      ['Saves & logs', '💾', /Save|Backup|Log|Reset|Alive|Interval|TTL|Cache/i],
      ['Network', '🌐', /Port|RCON|REST|Region|Auth|Ban|Lobby|IP$|Palbox/i]
    ]
    const MC_GROUPS = [
      ['Gameplay', '⚔️', /gamemode|difficulty|hardcore|pvp|force-gamemode|flight|command-block|gamerule|spawn-(monsters|animals|npcs)/i],
      ['World', '🌍', /level-|generate|max-world|nether|view-distance|simulation-distance|spawn-protection/i],
      ['Players & access', '👥', /max-players|white|online-mode|idle|op-permission|enforce|prevent-proxy|hidden/i],
      ['Network & performance', '🌐', /port|server-ip|network|rate-limit|tick|entity-broadcast|sync-chunk|native|compression|status/i]
    ]
    const GAME_LABEL = { minecraft: 'Minecraft', palworld: 'Palworld', valheim: 'Valheim', sdtd: '7 Days to Die' }
    const gameLabel = (g) => GAME_LABEL[g] || 'Minecraft'
    // per-game settings essentials for the non-minecraft, non-palworld games
    const VAL_ESS = [['name', 'Server name'], ['world', 'World name'], ['password', 'Join password'], ['public', 'Visible in server list']]
    const SDTD_ESS = [['ServerName', 'Server name'], ['ServerPassword', 'Join password'], ['ServerMaxPlayerCount', 'Max players'], ['GameDifficulty', 'Difficulty (0-5)'], ['DayNightLength', 'Day length (min)'], ['ServerDescription', 'Description']]
    const isPal = () => sheetInfo?.game === 'palworld'
    /** Destructive lifecycle controls (archive/delete/restore) are owner-or-admin only; the host enforces this too. */
    const canManage = (serverId) => isAdmin || ownerOf.get(serverId) === me
    const boolTrue = (v) => /^true$/i.test(v)
    const boolStr = (on) => (isPal() ? (on ? 'True' : 'False') : (on ? 'true' : 'false'))

    window.openSheet = async (serverId) => {
      sheetId = serverId; sheetTab = 'console'; dirty = {}; sheetInfo = null; filesRel = ''; fileView = null
      paintSheet('<div class="loadrow">Loading control panel…</div>')
      try { sheetInfo = await loadInfo(serverId) } catch (e) { toast(e.message, true); return closeSheet() }
      renderTab()
    }
    // clear the pair together: a lingering sheetInfo with a null sheetId poisons the desk view
    window.closeSheet = () => { sheetId = null; sheetInfo = null; $('sheet').innerHTML = '' }
    window.sheetGo = (tab) => { if (Object.keys(dirty).length && !confirm('Discard unsaved changes?')) return; sheetTab = tab; dirty = {}; fileView = null; renderTab() }
    window.setDirty = (k, v) => { dirty[k] = v }

    const isModdable = () => sheetInfo && sheetInfo.game === 'minecraft' && ['paper', 'fabric', 'forge', 'neoforge'].includes(sheetInfo.kind)
    const tabList = () => ['console', 'settings', 'players', ...(isModdable() ? ['mods'] : []), 'files', 'automation']
    const tabLabels = () => ({ console: 'Console', settings: 'Settings', players: 'Players', mods: sheetInfo?.kind === 'paper' ? 'Plugins' : 'Mods', files: 'Files', automation: 'Automation' })
    const tabIcons = () => ({ console: icons.term, settings: icons.sliders, players: icons.users, mods: icons.puzzle, files: icons.folder, automation: icons.zap })
    function paintSheet(bodyHtml) {
      const row = rowsById.get(sheetId) || {}
      const tabs = tabList()
      const label = tabLabels()
      const tico = tabIcons()
      $('sheet').innerHTML = `<div class="sheet-bg" onclick="closeSheet()"></div>
        <div class="sheet">
          <div class="sheet-grip"></div>
          <div class="sheet-top">
            <div class="tile" style="background:${gradOf(sheetId)}">${esc((row.name || '?').charAt(0).toUpperCase())}</div>
            <div style="flex:1;min-width:0"><div class="nm">${esc(row.name || 'Server')}</div>
              <div class="sub">${sheetInfo ? gameLabel(sheetInfo.game) + (sheetInfo.game === 'minecraft' ? ' ' + esc(sheetInfo.minecraftVersion || '') : '') + ' · port ' + sheetInfo.port : ''}</div></div>
            <button class="iconbtn" onclick="closeSheet()">${icons.x}</button>
          </div>
          <div class="sheet-tabs">${tabs.map((t) => `<button class="${t === sheetTab ? 'on' : ''}" onclick="sheetGo('${t}')">${tico[t]}<span>${label[t]}</span></button>`).join('')}</div>
          <div class="sheet-body" id="sheetBody">${bodyHtml}</div>
        </div>`
    }

    // shared by the mobile modal and the desktop detail pane
    async function runTab(body) {
      body.innerHTML = '<div class="loadrow">Loading…</div>'
      try {
        if (sheetTab === 'console') return renderConsole(body)
        if (sheetTab === 'settings') return renderSettings(body, await request(sheetId, 'getProps'))
        if (sheetTab === 'players') {
          if (isPal()) return renderPalPlayers(body, await request(sheetId, 'players'))
          if (sheetInfo.game === 'valheim' || sheetInfo.game === 'sdtd') return renderSteamPlayers(body)
          return renderMcPlayers(body)
        }
        if (sheetTab === 'mods') return renderMods(body, await request(sheetId, 'mods'))
        if (sheetTab === 'files') return renderFiles(body)
        if (sheetTab === 'automation') return renderAutomation(body, sheetInfo.automation || {})
      } catch (e) {
        body.innerHTML = `<div class="loadrow" style="color:var(--red)">${esc(e.message)}</div>`
      }
    }
    async function renderTab() {
      if (DESK()) return deskRenderDetail()
      paintSheet('<div class="loadrow">Loading…</div>')
      await runTab($('sheetBody'))
    }

    function renderConsole(body) {
      const row = rowsById.get(sheetId) || {}
      const running = row.state === 'running'
      const noConsole = sheetInfo?.game === 'valheim'
      const quick = isPal()
        ? ['save', 'players', 'say Welcome!']
        : sheetInfo?.game === 'sdtd'
          ? ['saveworld', 'lp', 'say "Welcome!"', 'settime day']
          : ['list', 'say Welcome!', 'time set day', 'weather clear']
      body.innerHTML = `<div class="con-wrap">
          <div class="con-head"><span class="cdot ${running ? 'on' : ''}"></span>Server console<span style="margin-left:auto">${running ? 'streaming' : 'offline'}</span></div>
          <div class="console open">${esc(row.console || 'No output yet.')}</div>
        </div>
        <div class="cmdrow open" style="margin-top:10px">
          <input id="sheetCmd" placeholder="${noConsole ? 'Valheim has no admin console — logs stream here' : running ? 'Type a command…' : 'start the server to send commands'}" ${running && !noConsole ? '' : 'disabled'}
            onkeydown="if(event.key==='Enter')sendCmd('${sheetId}','sheetCmd')" />
          <button onclick="sendCmd('${sheetId}','sheetCmd')" ${running && !noConsole ? '' : 'disabled'} aria-label="Send command">${icons.send}</button>
        </div>
        ${running && !noConsole ? `<div class="qchips">${quick.map((q) => `<button onclick="qcmd(this.textContent)">${esc(q)}</button>`).join('')}</div>` : ''}
        <div class="frow" style="margin-top:10px"><div class="hint2">The console updates live while this panel is open.</div></div>`
      const con = body.querySelector('.console'); if (con) con.scrollTop = con.scrollHeight
    }
    window.qcmd = (cmd) => {
      const input = $('sheetCmd')
      if (!input) return
      input.value = cmd
      input.focus()
    }

    const trimNum = (v) => { const n = Number(v); return Number.isFinite(n) ? String(n) : v }
    const isRate = (key) => /Rate$/.test(key)

    function rateEditor(key, value) {
      const cur = Number(value)
      const presets = [0.5, 1, 2, 3].map((p) => `<button class="${Math.abs(cur - p) < 0.001 ? 'on' : ''}" onclick="setRate('${key}',${p},this)">×${p}</button>`).join('')
      return `<div class="rate"><div class="seg">${presets}</div><input type="number" step="0.1" min="0" value="${esc(trimNum(value))}"
        oninput="setDirty('${key}',this.value);this.closest('.rate').querySelectorAll('.seg button').forEach(b=>b.classList.remove('on'))"></div>`
    }
    window.setRate = (key, p, btn) => {
      setDirty(key, String(p))
      btn.parentElement.querySelectorAll('button').forEach((b) => b.classList.toggle('on', b === btn))
      const input = btn.closest('.rate').querySelector('input'); if (input) input.value = String(p)
    }

    const PLATFORMS = ['Steam', 'Xbox', 'PS5', 'Mac']
    function crossplayEditor(key, value) {
      const active = new Set(String(value).replace(/[()]/g, '').split(',').map((s) => s.trim()).filter(Boolean))
      return `<div class="platgrid" id="cp-${key}">${PLATFORMS.map((p) => `<label><input type="checkbox" ${active.has(p) ? 'checked' : ''} onchange="setCrossplay('${key}')">${p}</label>`).join('')}</div>`
    }
    window.setCrossplay = (key) => {
      const box = document.getElementById('cp-' + key)
      const on = PLATFORMS.filter((p, i) => box.querySelectorAll('input')[i].checked)
      setDirty(key, `(${on.join(',')})`)
    }

    function settingControl(key, value) {
      if (key === 'CrossplayPlatforms') return crossplayEditor(key, value)
      if (ENUM_OPTIONS[key]) return `<select onchange="setDirty('${key}',this.value)">${ENUM_OPTIONS[key].map(([v, l]) => `<option value="${v}" ${v === value ? 'selected' : ''}>${l}</option>`).join('')}</select>`
      if (isPal() && isRate(key) && /^-?\d/.test(value)) return rateEditor(key, value)
      if (/^-?\d+(\.\d+)?$/.test(value)) return `<input type="number" step="any" value="${esc(trimNum(value))}" oninput="setDirty('${key}',this.value)">`
      return `<input value="${esc(String(value ?? ''))}" oninput="setDirty('${key}',this.value)">`
    }
    function settingRow(key, value, forcedLabel) {
      const label = forcedLabel || labelFor(key)
      const hint = HINTS[key] ? `<div class="h">${esc(HINTS[key])}</div>` : ''
      const dk = esc((key + ' ' + label + ' ' + (HINTS[key] || '')).toLowerCase())
      // plan-locked player slots: hosted customers see the cap, not an editor
      const planMax = sheetInfo?.limits?.maxPlayers
      if (planMax && !sheetInfo?.owner && (key === 'ServerPlayerMaxNum' || key === 'max-players')) {
        return `<div class="setrow" data-k="${dk}"><label>${label}</label>
          <input value="${planMax}" disabled style="opacity:.55;cursor:not-allowed">
          <div class="h">🔒 Your plan includes <b>${planMax} player slots</b>. Upgrade your plan to change this.</div></div>`
      }
      if (/^(true|false)$/i.test(value)) {
        return `<div class="setrow check" data-k="${dk}"><input type="checkbox" ${boolTrue(value) ? 'checked' : ''}
          onchange="setDirty('${key}',this.checked?'${boolStr(true)}':'${boolStr(false)}')"><div><label>${label}</label>${hint}</div></div>`
      }
      return `<div class="setrow" data-k="${dk}"><label>${label}</label>${settingControl(key, value)}${hint}</div>`
    }

    function renderSettings(body, props) {
      const ess = isPal() ? PAL_ESS : sheetInfo.game === 'valheim' ? VAL_ESS : sheetInfo.game === 'sdtd' ? SDTD_ESS : MC_ESS
      const groups = isPal() ? PAL_GROUPS : sheetInfo.game === 'minecraft' ? MC_GROUPS : []
      const essKeys = new Set(ess.map((e) => e[0]))
      const wideKeys = new Set(['ServerName', 'ServerDescription', 'motd', 'ServerPassword', 'level-seed', 'CrossplayPlatforms'])
      const essHtml = ess.map(([k, l]) => {
        const v = props[k] ?? ''
        const wide = wideKeys.has(k) || /^(true|false)$/i.test(v) ? ' full' : ''
        return `<div class="${wide.trim()}">${settingRow(k, v, l)}</div>`
      }).join('')

      // group the remaining keys
      const grouped = {}, order = []
      for (const [t] of groups) { grouped[t] = []; order.push(t) }
      grouped.Other = []; order.push('Other')
      for (const k of Object.keys(props).filter((k) => !essKeys.has(k)).sort()) {
        const g = groups.find(([, , re]) => re.test(k))
        grouped[g ? g[0] : 'Other'].push(k)
      }
      const groupsHtml = order.filter((t) => grouped[t].length).map((t) => {
        const icon = (groups.find((x) => x[0] === t) || [, '⚙️'])[1]
        return `<div class="setgroup">
          <div class="gh" onclick="this.parentElement.classList.toggle('open')"><span class="gi">${icon}</span>${t}<span class="cnt">${grouped[t].length}</span><span class="chev">${icons.chev}</span></div>
          <div class="body">${grouped[t].map((k) => settingRow(k, props[k])).join('')}</div>
        </div>`
      }).join('')

      const rebuildZone = sheetInfo.game !== 'minecraft' ? '' : `<div class="grouphead" style="color:var(--red);margin-top:24px">Change loader &amp; version</div>
        <div class="dangerzone">
          <div class="hint2" style="color:var(--red);margin-bottom:10px">⚠ Rebuilding wipes the world, mods, and every file on this server, then reinstalls it fresh. There is no undo.</div>
          <div class="grid2">
            <div class="frow"><label>Loader</label><select id="rbLoader">${['paper', 'vanilla', 'fabric', 'neoforge', 'forge'].map((k) => `<option value="${k}" ${sheetInfo.kind === k ? 'selected' : ''}>${k[0].toUpperCase() + k.slice(1)}</option>`).join('')}</select></div>
            <div class="frow"><label>Version</label><select id="rbVersion"></select></div>
          </div>
          <button class="minibtn red" onclick="rebuildServer()">Rebuild server — delete all files</button>
        </div>`
      // archive/delete are owner-or-admin only (the host enforces it server-side too);
      // no sheetId means a design preview, which renders as the owner
      const showLifecycle = !sheetId || canManage(sheetId)
      const lifecycleZones = `<div class="grouphead" style="color:var(--amber);margin-top:24px">Archive this server</div>
        <div class="dangerzone" style="border-color:rgba(251,191,36,.35);background:rgba(251,191,36,.05)">
          <div class="hint2" style="margin-bottom:10px">Stops the server and puts it in cold storage on the host. The world and every file are kept, and it can be restored any time — use this when a customer stops paying. Anyone it was shared with loses panel access until you share it again.</div>
          <button class="minibtn" style="border-color:rgba(251,191,36,.45);color:var(--amber)" onclick="archiveServer()">Archive server</button>
        </div>
        <div class="grouphead" style="color:var(--red);margin-top:24px">Delete this server</div>
        <div class="dangerzone">
          <div class="hint2" style="color:var(--red);margin-bottom:10px">⚠ Deleting stops the server and removes it from the host — the world and every file go with it. There is no undo.</div>
          <button class="minibtn red" onclick="deleteServer()">Delete server permanently</button>
        </div>`
      const danger = `${rebuildZone}${showLifecycle ? lifecycleZones : ''}`

      // palworld visibility: -publiclobby is a launch flag on the record, not an ini
      // setting, so it gets its own always-open block above the ini essentials
      const community = isPal() ? `<div class="setgroup open" style="margin-bottom:16px">
          <div class="gh" style="cursor:default"><span class="gi">🌐</span>Community server browser<span class="cnt">${sheetInfo.communityServer ? 'Listed' : 'Private'}</span></div>
          <div class="body"><div class="setrow check">
            <input type="checkbox" id="cm-toggle" ${sheetInfo.communityServer ? 'checked' : ''} onchange="setCommunity(this.checked)">
            <div><label for="cm-toggle">List this server in Palworld's official community browser</label>
            <div class="h">Players can find and join it from the in-game server list — no address needed. The host announces its public address automatically; make sure UDP port ${sheetInfo.port} is reachable. Applies on the next restart.</div></div>
          </div></div>
        </div>` : ''

      body.innerHTML = `
        <div class="set-hero"><h3>${gameLabel(sheetInfo.game)} settings</h3><p>The essentials are up top; every other option is grouped below with a plain-English note. Changes apply on the next server restart.</p></div>
        ${community}
        <div class="essgrid">${essHtml}</div>
        <div class="grouphead" style="margin-top:22px">Advanced settings</div>
        <div class="searchbar">${icons.chipIc}<input placeholder="Search every setting…" oninput="filterSettings(this.value)"></div>
        <div id="allGroups">${groupsHtml}</div>
        ${danger}
        <div class="savebar"><button class="cta" onclick="saveSettings()">Save settings</button></div>`
      if (!isPal()) {
        loadMcVersions().then((vers) => {
          const sel = $('rbVersion'); if (!sel) return
          sel.innerHTML = vers.map((v) => `<option ${v === sheetInfo.minecraftVersion ? 'selected' : ''}>${v}</option>`).join('')
        })
      }
    }
    window.filterSettings = (q) => {
      q = q.trim().toLowerCase()
      document.querySelectorAll('#allGroups .setgroup').forEach((g) => {
        let any = false
        g.querySelectorAll('.setrow').forEach((r) => {
          const match = !q || (r.dataset.k || '').includes(q)
          r.style.display = match ? '' : 'none'
          if (match) any = true
        })
        g.style.display = any ? '' : 'none'
        g.classList.toggle('open', Boolean(q) && any)
      })
    }
    window.saveSettings = async () => {
      if (!Object.keys(dirty).length) return toast('Nothing changed')
      try { await request(sheetId, 'setProps', { updates: dirty }); dirty = {}; toast('Saved — applies on next restart') }
      catch (e) { toast(e.message, true) }
    }
    window.setCommunity = async (on) => {
      try {
        await request(sheetId, 'setCommunity', { on })
        sheetInfo.communityServer = on
        infoCache.set(sheetId, { ...sheetInfo })
        toast(on ? 'Community listing on — applies on the next restart' : 'Community listing off — applies on the next restart')
      } catch (e) {
        toast(e.message, true)
      }
      renderTab()
    }
    window.rebuildServer = async () => {
      const loader = $('rbLoader').value, version = $('rbVersion').value
      const name = (rowsById.get(sheetId) || {}).name || 'this server'
      if (!confirm(`Rebuild "${name}" as ${loader} ${version}?\n\nThis DELETES the world, mods, and every file on the server, then reinstalls it fresh. There is no undo.`)) return
      if (prompt('This permanently deletes all server files. Type REBUILD to confirm.') !== 'REBUILD') return toast('Rebuild cancelled')
      toast('Rebuilding — this downloads a fresh server, give it a few minutes')
      try {
        await request(sheetId, 'rebuild', { loader, version }, 60000)
        infoCache.delete(sheetId); sheetInfo = null; toast('Server rebuilt — it is starting fresh'); renderTab()
      } catch (e) { toast(e.message, true) }
    }
    window.deleteServer = async () => {
      const id = sheetId
      const name = (rowsById.get(id) || {}).name || 'this server'
      if (!confirm(`Delete "${name}"?\n\nThis stops the server and permanently deletes its world and every file from the host. There is no undo.`)) return
      if (prompt('This permanently deletes the server and all of its files. Type DELETE to confirm.') !== 'DELETE') return toast('Delete cancelled')
      toast('Deleting the server — stopping it first can take a minute')
      try {
        await request(id, 'delete', {}, 90000) // a graceful stop alone can take up to a minute
        infoCache.delete(id); rowsById.delete(id); ownerOf.delete(id)
        sheetInfo = null; dirty = {}
        closeSheet()
        schedulePaint()
        toast('Server deleted')
        void refresh()
      } catch (e) { toast(e.message, true) }
    }
    window.archiveServer = async () => {
      const id = sheetId
      const name = (rowsById.get(id) || {}).name || 'this server'
      if (!confirm(`Archive "${name}"?\n\nThis stops the server and takes it offline. The world and every file are kept, and you can restore it any time. Anyone it was shared with loses panel access.`)) return
      toast('Archiving — stopping the server first can take a minute')
      try {
        await request(id, 'archive', {}, 90000)
        infoCache.delete(id); sheetInfo = null; dirty = {}
        const row = rowsById.get(id)
        if (row) { row.state = 'archived'; row.updated_at = new Date().toISOString() }
        closeSheet()
        schedulePaint()
        if (DESK()) deskSelect(id) // swap the stale settings pane for the archived view
        toast('Server archived — restore it from its card any time')
        void refresh()
      } catch (e) { toast(e.message, true) }
    }
    window.restoreServer = async (id) => {
      const name = (rowsById.get(id) || {}).name || 'this server'
      if (!confirm(`Restore "${name}" from the archive?\n\nIt returns to the server list stopped, ready to start. Re-share it to give a customer access again.`)) return
      toast('Restoring the server…')
      try {
        await request(id, 'restore', {}, 60000)
        const row = rowsById.get(id)
        if (row) { row.state = 'stopped'; row.updated_at = new Date().toISOString() }
        schedulePaint()
        if (DESK() && deskSel === id) deskSelect(id) // bring the control-panel tabs back
        toast('Server restored')
        refreshSoon(); void refresh()
      } catch (e) { toast(e.message, true) }
    }
    window.deleteArchived = async (id) => {
      const name = (rowsById.get(id) || {}).name || 'this server'
      if (!confirm(`Delete the archived server "${name}" permanently?\n\nThis destroys the stored world and files. There is no undo.`)) return
      if (prompt('This permanently deletes the archived server. Type DELETE to confirm.') !== 'DELETE') return toast('Delete cancelled')
      toast('Deleting the archive…')
      try {
        await request(id, 'delete', {}, 60000)
        rowsById.delete(id); ownerOf.delete(id); infoCache.delete(id)
        if (deskSel === id) deskSel = null
        schedulePaint()
        toast('Server deleted')
        void refresh()
      } catch (e) { toast(e.message, true) }
    }

    function renderPalPlayers(body, players) {
      const list = players || []
      body.innerHTML = `<div class="grouphead">Online now (${list.length})</div>
        <div class="plister">${list.length ? list.map((p) => `<div class="prow">
          <span class="avatar" style="background:${gradOf(p.name)}">${esc((p.name || '?').charAt(0).toUpperCase())}</span>
          <div style="flex:1;min-width:0"><div class="pn">${esc(p.name)}</div><div class="pm">lvl ${p.level ?? '?'} · ${esc(p.userId || 'no id')}</div></div>
          <button class="minibtn" onclick="palMod('kick','${esc(p.userId || '')}','${esc(p.name)}')">Kick</button>
          <button class="minibtn red" onclick="palMod('ban','${esc(p.userId || '')}','${esc(p.name)}')">Ban</button>
        </div>`).join('') : '<div class="loadrow">Nobody online.</div>'}</div>
        <div class="grouphead">Broadcast</div>
        <div class="cmdrow open"><input id="palSay" placeholder="Message to everyone…"><button onclick="palSay()">${icons.send}</button></div>
        <div class="grouphead">Unban</div>
        <div class="cmdrow open"><input id="palUnban" placeholder="steam_7656…"><button class="minibtn" onclick="palUnban()">Unban</button></div>`
    }
    window.palMod = async (action, userId, name) => {
      if (!userId) return toast('No platform id yet — try again in a moment', true)
      if (!confirm(`${action === 'ban' ? 'Ban' : 'Kick'} ${name}?`)) return
      try { await request(sheetId, 'moderate', { action, target: userId }); toast(`${name} ${action === 'ban' ? 'banned' : 'kicked'}`); renderTab() }
      catch (e) { toast(e.message, true) }
    }
    window.palSay = async () => {
      const m = $('palSay').value.trim(); if (!m) return
      try { await request(sheetId, 'moderate', { action: 'announce', target: m }); $('palSay').value = ''; toast('Broadcast sent') } catch (e) { toast(e.message, true) }
    }
    window.palUnban = async () => {
      const id = $('palUnban').value.trim(); if (!id) return
      try { await request(sheetId, 'moderate', { action: 'unban', target: id }); $('palUnban').value = ''; toast('Unbanned ' + id) } catch (e) { toast(e.message, true) }
    }

    function renderMcPlayers(body) {
      const row = rowsById.get(sheetId) || {}
      const online = (row.players || [])
      body.innerHTML = `<div class="grouphead">Online now (${online.length})</div>
        <div class="plister">${online.length ? online.map((n) => `<div class="prow">

        <div class="grouphead">Whitelist</div>

    // valheim / 7dtd: names stream from the host's log or telnet polling

    // paper servers install Bukkit-family plugins; modded servers install loader mods
    const modNoun = () => (sheetInfo?.kind === 'paper' ? 'plugin' : 'mod')
    function renderMods(body, installed) {
      const list = installed || []

          <div style="flex:1;min-width:0"><div class="pn">${esc(m.title || m.fileName)}</div><div class="pm">${esc(m.versionNumber || m.fileName)}</div></div>
          <button class="minibtn red" onclick="removeMod('${esc(m.fileName)}')">Remove</button></div>`).join('') : `<div class="loadrow">No ${noun}s yet — search below.</div>`}</div>
        <div class="grouphead">Add ${noun}s · ${esc(sheetInfo.kind)} ${esc(sheetInfo.minecraftVersion || '')}</div>
        <div class="searchbar">${icons.chipIc}<input placeholder="Search Modrinth ${noun}s…" oninput="modSearch(this.value)"></div>

    window.modSearch = async (q) => {
