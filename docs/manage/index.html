<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>ELauncher — Remote</title>
  <link rel="icon" href="../icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..900&display=swap" />
  <style>
    /* ============================================================
       ELauncher Remote — obsidian aurora design system
       Layers: tokens → base → shell → cards → sheet/tabs → forms →
       lists → console → files → settings → states → desktop deck
       ============================================================ */
    * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
    [hidden] { display: none !important; }
    /* <tokens:begin> generated from src/shared/tokens.css — do not edit by hand.
       Edit that file, then run: npm run sync:tokens */
    /* ---- shared, theme-independent tokens ---- */
    :root {
      --radius-lg: 24px;
      --radius: 18px;
      --radius-sm: 11px;
      --radius-xs: 8px;
      --sidebar-width: 256px;
      --titlebar-height: 42px;

      /* refined "Nebula" accent — violet → cyan. identical in both themes so the
         brand reads the same; only surfaces/text/glass/shadow flip per theme. */
      --accent: #7c6cff;
      --accent-2: #22d3ee;
      --accent-hover: #9a8cff;
      --accent-3: #d946ef; /* fuchsia sparkle used sparingly in ambient art */

      /* type scale */
      --fs-display: 27px;
      --fs-h1: 22px;
      --fs-h2: 16px;
      --fs-h3: 14.5px;
      --fs-body: 14px;
      --fs-small: 12.5px;

      /* the tell that a value came from a machine: addresses, ids, log lines,
         timestamps, ports, stat micro-labels */
      --mono: ui-monospace, 'Cascadia Code', 'Cascadia Mono', Menlo, Consolas, monospace;

      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
      --ease-spring: cubic-bezier(0.2, 0.9, 0.3, 1.15);
    }

    /* ---- dark (default) ---- */
    :root,
    :root[data-theme='dark'] {
      color-scheme: dark;

      /* layered surfaces, darkest to lightest */
      --bg: #0a0a0f;
      --bg-content: #0b0b11;
      --bg-elevated: #16161d;
      --bg-card: #121218;
      --bg-hover: #1d1d26;
      --bg-active: #282833;

      --border: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.15);

      --text: #f4f5fa;
      --text-dim: #a0a3b6;
      --text-faint: #64677a;

      --accent-soft: rgba(124, 108, 255, 0.14);
      --accent-glow: rgba(124, 108, 255, 0.34);
      --accent-line: rgba(124, 108, 255, 0.2);
      --focus-ring: rgba(124, 108, 255, 0.32);

      --green: #34d399;
      --green-soft: rgba(52, 211, 153, 0.11);
      --red: #fb7185;
      --red-soft: rgba(251, 113, 133, 0.12);
      --yellow: #fbbf24;
      --yellow-soft: rgba(251, 191, 36, 0.1);

      /* form fields */
      --input-bg: rgba(0, 0, 0, 0.4);
      --input-bg-focus: rgba(0, 0, 0, 0.55);

      /* floating popovers (menus, dropdowns, toasts) + inset tracks (tabs, segmented) */
      --pop-bg: rgba(24, 24, 29, 0.96);
      --track-bg: rgba(0, 0, 0, 0.35);

      /* translucent side panel over the content */
      --sidebar-bg:
        linear-gradient(180deg, rgba(124, 108, 255, 0.07), transparent 240px),
        linear-gradient(0deg, rgba(34, 211, 238, 0.035), transparent 200px),
        rgba(11, 11, 17, 0.82);

      /* ambient aurora blobs */
      --aurora-1: rgba(124, 108, 255, 0.16);
      --aurora-2: rgba(34, 211, 238, 0.1);
      --aurora-3: rgba(217, 70, 239, 0.08);

      /* glass: translucent fill + hairline top light. these are OVERLAYS — they
         layer on top of a surface and have no opacity of their own. */
      --glass: linear-gradient(180deg, rgba(255, 255, 255, 0.045), rgba(255, 255, 255, 0.012) 55%);
      --glass-strong: linear-gradient(180deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.02) 60%);
      /* ...whereas this one IS the surface: a see-through fill for sticky bars and
         sheets that sit over content with backdrop-filter. Distinct token because
         the two are not interchangeable — a gradient here loses the translucency
         that makes backdrop-filter read as glass at all. */
      --glass-bg: rgba(13, 13, 21, 0.72);

      --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.03);
      --shadow-lift: 0 16px 40px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      --shadow-pop: 0 24px 64px rgba(0, 0, 0, 0.65);
    }

    /* ---- light ---- */
    :root[data-theme='light'] {
      color-scheme: light;

      --bg: #eef0f7;
      --bg-content: #f5f6fb;
      --bg-elevated: #ffffff;
      --bg-card: #ffffff;
      --bg-hover: #eceef6;
      --bg-active: #e2e5f0;

      --border: rgba(17, 20, 45, 0.1);
      --border-strong: rgba(17, 20, 45, 0.18);

      --text: #171a2b;
      --text-dim: #565b73;
      --text-faint: #8b8fa6;

      /* deepen accents slightly for contrast on white */
      --accent: #6d5cf5;
      --accent-hover: #5b49ec;
      --accent-2: #0891b2;
      --accent-soft: rgba(109, 92, 245, 0.1);
      --accent-glow: rgba(109, 92, 245, 0.22);
      --accent-line: rgba(109, 92, 245, 0.24);
      --focus-ring: rgba(109, 92, 245, 0.22);

      --green: #059669;
      --green-soft: rgba(5, 150, 105, 0.1);
      --red: #e11d48;
      --red-soft: rgba(225, 29, 72, 0.1);
      --yellow: #b45309;
      --yellow-soft: rgba(180, 83, 9, 0.12);

      --input-bg: rgba(17, 20, 45, 0.02);
      --input-bg-focus: #ffffff;

      --pop-bg: rgba(255, 255, 255, 0.98);
      --track-bg: rgba(17, 20, 45, 0.05);

      --sidebar-bg:
        linear-gradient(180deg, rgba(109, 92, 245, 0.08), transparent 240px),
        linear-gradient(0deg, rgba(8, 145, 178, 0.05), transparent 200px),
        rgba(255, 255, 255, 0.72);

      --aurora-1: rgba(109, 92, 245, 0.12);
      --aurora-2: rgba(8, 145, 178, 0.08);
      --aurora-3: rgba(217, 70, 239, 0.05);

      --glass: linear-gradient(180deg, rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0) 60%);
      --glass-strong: linear-gradient(180deg, rgba(255, 255, 255, 0.75), rgba(255, 255, 255, 0.15) 60%);
      --glass-bg: rgba(255, 255, 255, 0.72);

      --shadow-card: 0 1px 2px rgba(17, 20, 45, 0.08), 0 1px 3px rgba(17, 20, 45, 0.04);
      --shadow-lift: 0 16px 40px rgba(17, 20, 45, 0.13);
      --shadow-pop: 0 24px 60px rgba(17, 20, 45, 0.2);
    }

    /* ------------------------------------------------------------
       Legacy aliases for docs/manage/index.html
       ------------------------------------------------------------
       The panel grew its own token vocabulary before this file existed.
       Rather than rename ~2400 lines in one pass (and collide with whatever
       is in flight), the old names now resolve to the canonical ones, so the
       VALUES are unified immediately and the names can retire incrementally.

       Retire a legacy name by replacing its uses in the panel, then deleting
       the alias here. When this block is empty, the drift is fully gone.
       ------------------------------------------------------------ */
    :root {
      --bg-soft: var(--bg-content);
      --card: var(--bg-card);
      --card-2: var(--bg-elevated);
      --line: var(--border);
      --line-strong: var(--border-strong);
      --dim: var(--text-dim);
      --faint: var(--text-faint);
      --amber: var(--yellow);
      --amber-soft: var(--yellow-soft);
      --ease: var(--ease-out);
      --shadow-1: var(--shadow-lift);
      --shadow-2: var(--shadow-card);
    }
    /* <tokens:end> */
    html { background: var(--bg); scrollbar-color: var(--border-strong) var(--bg); }
    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      font: 15px/1.5 'Inter', -apple-system, 'Segoe UI', Roboto, sans-serif;
      font-optical-sizing: auto;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    /* aurora backdrop: two drifting light fields behind everything */
    body::before, body::after {
      content: ''; position: fixed; z-index: -1; pointer-events: none;
      width: 82vmax; height: 82vmax; border-radius: 50%;
      filter: blur(70px); opacity: 0.55; will-change: transform;
    }
    body::before {
      top: -46vmax; left: -18vmax;
      background: radial-gradient(closest-side, var(--aurora-1), var(--aurora-3) 55%, transparent 72%);
      animation: drift-a 26s ease-in-out infinite alternate;
    }
    body::after {
      top: -50vmax; right: -30vmax;
      background: radial-gradient(closest-side, var(--aurora-2), var(--aurora-1) 55%, transparent 72%);
      animation: drift-b 32s ease-in-out infinite alternate;
    }
    @keyframes drift-a { to { transform: translate(9vmax, 7vmax) scale(1.08); } }
    @keyframes drift-b { to { transform: translate(-8vmax, 9vmax) scale(0.94); } }
    ::selection { background: color-mix(in srgb, var(--accent) 35%, transparent); }
    button { font: inherit; cursor: pointer; border: 0; background: none; color: inherit; }
    input, select, textarea { font: inherit; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-thumb { background: #23233370; border: 3px solid transparent; border-radius: 99px; background-clip: content-box; }
    ::-webkit-scrollbar-thumb:hover { background: #32324890; background-clip: content-box; border: 3px solid transparent; }
    ::-webkit-scrollbar-track { background: transparent; }
    .shell { max-width: 560px; margin: 0 auto; padding: 0 16px calc(44px + env(safe-area-inset-bottom)); }
    .row { display: flex; align-items: center; }
    .faint { color: var(--faint); }

    /* ---------- top bar ---------- */
    .top {
      position: sticky; top: 0; z-index: 20;
      display: flex; align-items: center; gap: 11px;
      padding: calc(12px + env(safe-area-inset-top)) 2px 12px;
      margin: 0 -16px 20px; padding-left: 18px; padding-right: 12px;
      background: var(--glass-bg);
      backdrop-filter: blur(22px) saturate(1.5); -webkit-backdrop-filter: blur(22px) saturate(1.5);
      border-bottom: 1px solid var(--line);
    }
    .top img { width: 32px; height: 32px; border-radius: 10px; box-shadow: 0 4px 14px rgba(124, 108, 255, 0.3); }
    .wordmark { font-weight: 800; font-size: 17px; letter-spacing: -0.03em; white-space: nowrap; }
    .wordmark span {
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .live {
      margin-left: auto; display: flex; align-items: center; gap: 7px;
      font-size: 11px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--green);
      padding: 6px 11px; border-radius: 99px;
      background: var(--green-soft); border: 1px solid rgba(52, 211, 153, 0.25);
    }
    .live .dot { width: 6px; height: 6px; border-radius: 99px; background: var(--green); animation: pulse 2s infinite; box-shadow: 0 0 10px var(--green); }
    .live.poll { color: var(--dim); background: var(--card-2); border-color: var(--line); }
    .live.poll .dot { background: var(--dim); box-shadow: none; }
    @media (max-width: 380px) { .live { display: none; } }
    .iconbtn {
      display: grid; place-items: center; width: 38px; height: 38px; border-radius: 12px;
      color: var(--dim); border: 1px solid transparent; transition: all 0.16s var(--ease);
    }
    .iconbtn:hover { color: var(--text); background: var(--card-2); border-color: var(--line); }
    .iconbtn:active { transform: scale(0.92); }
    .iconbtn.on { color: var(--accent); background: var(--accent-soft); }

    /* ---------- login ---------- */
    .login { padding-top: 8dvh; display: flex; flex-direction: column; align-items: center; text-align: center; }
    .halo { position: relative; width: 96px; height: 96px; margin-bottom: 24px; }
    .halo::before {
      content: ''; position: absolute; inset: -34px;
      background: radial-gradient(closest-side, rgba(124, 108, 255, 0.45), rgba(34, 211, 238, 0.14), transparent);
      filter: blur(16px); border-radius: 50%; animation: pulse 4s ease-in-out infinite;
    }
    .halo img { position: relative; width: 96px; height: 96px; border-radius: 26px; box-shadow: var(--shadow-2); }
    .login h1 { font-size: 30px; font-weight: 800; letter-spacing: -0.04em; line-height: 1.15; }
    .login h1 span {
      background: linear-gradient(90deg, var(--accent), var(--accent-3) 55%, var(--accent-2));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .login p { color: var(--dim); font-size: 14px; margin: 10px 0 28px; max-width: 320px; line-height: 1.55; }
    .panel {
      width: 100%; background: var(--card); border: 1px solid var(--line);
      border-radius: var(--radius); padding: 22px; text-align: left;
      box-shadow: var(--shadow-1);
      position: relative; overflow: hidden;
    }
    .panel::before {
      content: ''; position: absolute; inset: 0 0 auto; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(124, 108, 255, 0.5), rgba(34, 211, 238, 0.4), transparent);
    }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 11px; font-weight: 700; color: var(--faint); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 7px; }
    .field input {
      width: 100%; padding: 13px 15px; border-radius: var(--radius-sm);
      background: var(--bg-soft); border: 1px solid var(--line); color: var(--text); outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .field input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); outline: none; }
    .cta {
      width: 100%; padding: 14px; border-radius: var(--radius-sm); font-weight: 750; color: #fff; letter-spacing: 0.01em;
      background: linear-gradient(135deg, var(--accent), #5f8bff 55%, var(--accent-2));
      background-size: 150% 100%;
      box-shadow: 0 10px 30px rgba(124, 108, 255, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.22);
      transition: all 0.2s var(--ease);
    }
    .cta:hover { background-position: 100% 0; box-shadow: 0 12px 36px rgba(124, 108, 255, 0.48), inset 0 1px 0 rgba(255, 255, 255, 0.22); transform: translateY(-1px); }
    .cta:active { transform: translateY(0) scale(0.99); }
    .cta:disabled { opacity: 0.55; transform: none; }
    .err { color: var(--red); font-size: 13px; min-height: 18px; margin: 10px 2px 2px; }

    /* ---------- server cards (mobile) ---------- */
    .card {
      position: relative;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.02), transparent 40%), var(--card);
      border: 1px solid var(--line); border-radius: var(--radius);
      padding: 17px; margin-bottom: 14px; box-shadow: var(--shadow-2);
      transition: border-color 0.2s var(--ease), transform 0.2s var(--ease);
    }
    .card.offline { opacity: 0.72; filter: saturate(0.7); }
    .head { display: flex; align-items: center; gap: 13px; }
    .tile {
      position: relative; width: 48px; height: 48px; border-radius: 15px; flex: none;
      display: grid; place-items: center; font-weight: 800; font-size: 20px; color: #fff;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.45);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25), 0 6px 18px rgba(0, 0, 0, 0.35);
    }
    .tile .st {
      position: absolute; right: -3px; bottom: -3px; width: 14px; height: 14px; border-radius: 99px;
      border: 3px solid var(--card); background: var(--faint);
    }
    .tile .st.on { background: var(--green); box-shadow: 0 0 10px rgba(52, 211, 153, 0.8); animation: pulse 2s infinite; }
    .tile .st.warm { background: var(--amber); box-shadow: 0 0 10px rgba(251, 191, 36, 0.6); }
    .tile .st.dead { background: var(--red); }
    .who { min-width: 0; flex: 1; }
    .who .nm { font-weight: 750; font-size: 17px; letter-spacing: -0.015em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .who .ln { font-size: 12.5px; color: var(--dim); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chip {
      flex: none; font-size: 10.5px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase;
      padding: 5px 11px; border-radius: 99px; border: 1px solid var(--line-strong); color: var(--dim);
    }
    .chip.on { color: var(--green); border-color: rgba(52, 211, 153, 0.4); background: var(--green-soft); text-shadow: 0 0 12px rgba(52, 211, 153, 0.5); }
    .chip.warm { color: var(--amber); border-color: rgba(251, 191, 36, 0.4); background: var(--amber-soft); }
    .chip.dead { color: var(--red); border-color: rgba(251, 113, 133, 0.35); background: var(--red-soft); }
    .chip.acc { color: var(--accent); border-color: rgba(124, 108, 255, 0.4); background: var(--accent-soft); }

    .pills { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 13px; }
    .pill {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 12px; color: var(--dim); padding: 6px 11px;
      background: var(--card-2); border: 1px solid var(--line); border-radius: 99px;
    }
    .pill svg { width: 12px; height: 12px; color: var(--faint); }
    .pill b { color: var(--text); font-weight: 650; }

    .addr {
      display: flex; align-items: center; gap: 9px; width: 100%;
      margin-top: 12px; padding: 12px 14px; border-radius: var(--radius-sm);
      background: linear-gradient(90deg, rgba(124, 108, 255, 0.10), rgba(34, 211, 238, 0.06));
      border: 1px dashed rgba(124, 108, 255, 0.4);
      color: var(--text); font: 12.5px var(--mono);
      transition: border-color 0.16s;
    }
    .addr:hover { border-color: rgba(124, 108, 255, 0.7); }
    .addr svg { width: 14px; height: 14px; color: var(--accent); flex: none; }
    .addr .a { flex: 1; min-width: 0; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .addr .c { color: var(--faint); font-size: 10.5px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; font-family: 'Inter', sans-serif; }

    .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-top: 13px; }
    .acts.single { grid-template-columns: 1fr; }
    .btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 13px; border-radius: var(--radius-sm); font-weight: 700; font-size: 14px;
      border: 1px solid var(--line-strong); background: var(--card-2); color: var(--text);
      transition: all 0.16s var(--ease);
    }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.45; }
    .btn svg { width: 15px; height: 15px; }
    .btn.start { background: var(--green-soft); border-color: rgba(52, 211, 153, 0.45); color: var(--green); }
    .btn.stop { background: var(--red-soft); border-color: rgba(251, 113, 133, 0.4); color: var(--red); }
    .btn.manage {
      margin-top: 10px; width: 100%;
      background: var(--accent-soft); border-color: rgba(124, 108, 255, 0.35); color: var(--accent);
    }

    .conbtn {
      width: 100%; display: flex; align-items: center; gap: 8px; margin-top: 12px;
      color: var(--faint); font-size: 12.5px; font-weight: 650; padding: 4px 2px;
      transition: color 0.15s;
    }
    .conbtn:hover { color: var(--dim); }
    .conbtn svg { width: 13px; height: 13px; transition: transform 0.2s; }
    .conbtn.open svg { transform: rotate(90deg); }

    .hintline { margin-top: 11px; font-size: 12px; color: var(--faint); line-height: 1.5; }
    .hintline b { color: var(--text); }
    .home-head {
      display: flex; align-items: center; gap: 8px;
      font-size: 11px; font-weight: 800; letter-spacing: 0.09em; text-transform: uppercase;
      color: var(--faint); margin: 26px 2px 11px;
    }
    .home-head::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--line-strong), transparent); }

    /* ---------- control-panel sheet ---------- */
    .sheet-bg { position: fixed; inset: 0; z-index: 40; background: rgba(4, 4, 8, 0.6);
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); animation: fade 0.2s; }
    @keyframes fade { from { opacity: 0; } }
    .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-height: 94dvh;
      background: linear-gradient(180deg, var(--bg-soft), var(--bg) 120px);
      border-top-left-radius: 24px; border-top-right-radius: 24px;
      border-top: 1px solid var(--line-strong); box-shadow: 0 -24px 70px rgba(0, 0, 0, 0.65);
      display: flex; flex-direction: column; animation: slideup 0.3s var(--ease);
      max-width: 560px; margin: 0 auto; }
    @keyframes slideup { from { transform: translateY(100%); } }
    .sheet-grip { width: 40px; height: 4px; border-radius: 99px; background: var(--line-strong); margin: 10px auto 5px; flex: none; }
    .sheet-top { display: flex; align-items: center; gap: 11px; padding: 4px 16px 13px; border-bottom: 1px solid var(--line); }
    .sheet-top .tile { width: 40px; height: 40px; border-radius: 12px; font-size: 17px; }
    .sheet-top .nm { font-weight: 750; font-size: 16.5px; letter-spacing: -0.01em; }
    .sheet-top .sub { font-size: 12px; color: var(--faint); margin-top: 1px; }
    .sheet-tabs { display: flex; gap: 5px; padding: 11px 14px; overflow-x: auto; border-bottom: 1px solid var(--line); flex: none; scrollbar-width: none; }
    .sheet-tabs::-webkit-scrollbar { display: none; }
    .sheet-tabs button {
      flex: none; display: inline-flex; align-items: center; gap: 7px;
      padding: 9px 14px; border-radius: 11px; font-size: 13px; font-weight: 650; color: var(--dim);
      white-space: nowrap; border: 1px solid transparent; transition: all 0.15s var(--ease);
    }
    .sheet-tabs button svg { width: 14px; height: 14px; opacity: 0.8; }
    .sheet-tabs button.on { background: var(--accent-soft); color: var(--accent); border-color: rgba(124, 108, 255, 0.25); }
    .sheet-body { padding: 16px; overflow-y: auto; flex: 1; overscroll-behavior: contain; }

    /* ---------- forms ---------- */
    .frow { margin-bottom: 15px; }
    .frow label { display: block; font-size: 12px; font-weight: 650; color: var(--faint); margin-bottom: 6px; }
    .frow input, .frow select {
      width: 100%; padding: 11px 13px; border-radius: 11px; background: var(--card-2);
      border: 1px solid var(--line); color: var(--text); outline: none; transition: border-color 0.15s, box-shadow 0.15s;
    }
    .frow input:focus, .frow select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .frow .hint2 { font-size: 11.5px; color: var(--faint); margin-top: 5px; line-height: 1.5; }
    .frow.check { display: flex; align-items: center; gap: 10px; }
    .frow.check input { width: auto; accent-color: var(--accent); }
    .frow.check label { margin: 0; color: var(--text); font-size: 13.5px; font-weight: 500; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    input[type='checkbox'] { accent-color: var(--accent); width: 17px; height: 17px; }
    .savebar {
      position: sticky; bottom: -16px; z-index: 5; margin: 10px -16px -16px;
      padding: 14px 16px calc(15px + env(safe-area-inset-bottom));
      background: linear-gradient(transparent, var(--bg) 34%);
      display: flex; gap: 10px; align-items: center;
    }
    .savebar .cta { flex: 1; padding: 13px; }

    /* ---------- lists ---------- */
    .plister .prow {
      display: flex; align-items: center; gap: 11px; padding: 11px 10px; margin: 0 -10px;
      border-top: 1px solid var(--line); transition: background 0.14s;
    }
    .plister .prow:first-child { border-top: 0; }
    .plister .prow:hover { background: var(--bg-hover); }
    .plister .pn { font-weight: 650; }
    .plister .pm { font-size: 12px; color: var(--faint); }
    .avatar {
      width: 34px; height: 34px; border-radius: 11px; flex: none;
      display: grid; place-items: center; font-weight: 800; font-size: 14px; color: #fff;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
    }
    .minibtn {
      padding: 8px 13px; border-radius: 10px; font-size: 12.5px; font-weight: 650;
      border: 1px solid var(--line-strong); background: var(--card-2); color: var(--text);
      transition: all 0.15s var(--ease);
    }
    .minibtn:active { transform: scale(0.96); }
    .minibtn.red { color: var(--red); border-color: rgba(251, 113, 133, 0.35); background: var(--red-soft); }
    .minibtn.acc { color: var(--accent); border-color: rgba(124, 108, 255, 0.4); background: var(--accent-soft); }
    .searchbar {
      display: flex; align-items: center; gap: 9px; padding: 11px 13px; margin-bottom: 12px;
      border-radius: var(--radius-sm); background: var(--card-2); border: 1px solid var(--line);
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .searchbar:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .searchbar input { flex: 1; background: none; border: 0; color: var(--text); outline: none; }
    .searchbar svg { width: 15px; height: 15px; color: var(--faint); }
    .grouphead { font-size: 11px; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase; color: var(--faint); margin: 18px 0 9px; }
    .loadrow { text-align: center; color: var(--faint); padding: 30px 0; font-size: 13px; }
    .dangerzone { border: 1px solid rgba(251, 113, 133, 0.35); background: rgba(251, 113, 133, 0.05); border-radius: 14px; padding: 15px; margin-bottom: 8px; }
    .p-tile { display: grid; place-items: center; border-radius: 9px; background: var(--card-2); color: var(--faint); font-weight: 700; }

    /* ---------- console: terminal treatment ---------- */
    /* ---------- roster ---------- */
    .rtabs { display: flex; gap: 5px; margin-bottom: 11px; flex-wrap: wrap; }
    .rtabs button {
      display: inline-flex; align-items: center; gap: 7px; padding: 7px 13px; border-radius: 11px;
      font-size: 13px; font-weight: 650; background: var(--card-2); border: 1px solid var(--line); color: var(--dim);
      transition: all 0.15s var(--ease);
    }
    .rtabs button:hover { color: var(--text); border-color: var(--line-strong); }
    .rtabs button.on { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent); }
    .rtabs .ct { font: 650 10.5px var(--mono); background: rgba(0,0,0,.25); border-radius: 99px; padding: 1px 6px; }
    .prow .pn i { display: block; font-style: normal; font-size: 10.5px; color: var(--faint); font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; }
    /* access rows carry a sentence, not a UUID — read them as prose */
    .plister.access .pn i { font-family: inherit; font-size: 11.5px; font-weight: 500; white-space: normal; }
    .plister.access .prow { gap: 12px; }
    .plister.access .chip { flex: none; }
    /* head render over the initial tile: the tile shows through if the fetch fails */
    .avatar { position: relative; overflow: hidden; }
    .avatar img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; image-rendering: pixelated; }
    .avatar b { font-weight: 800; }

    /* ---------- MOTD preview ---------- */
    /* Shaped like the multiplayer server list entry, because that is the only
       place these section codes are ever seen. */
    .motd-preview {
      display: flex; align-items: center; gap: 10px; margin-top: 10px;
      padding: 8px 10px; border-radius: 8px; background: #2b2b2b;
      border: 1px solid #1a1a1a; font-family: var(--mono); box-shadow: inset 0 1px 0 rgba(255,255,255,.05);
    }
    .motd-icon {
      width: 34px; height: 34px; border-radius: 3px; flex: none;
      background: repeating-conic-gradient(#3f4a2e 0% 25%, #4a5936 0% 50%) 50% / 8px 8px;
    }
    .motd-body { flex: 1; min-width: 0; }
    .motd-name { color: #fff; font-size: 12.5px; margin-bottom: 2px; }
    .motd-text { font-size: 12px; line-height: 1.35; }
    .motd-line { color: #aaa; white-space: pre-wrap; word-break: break-word; }
    .motd-ping { display: flex; align-items: center; gap: 4px; color: #aaa; font-size: 11px; flex: none; }
    .motd-ping svg { width: 12px; height: 12px; }

    /* ---------- automation ---------- */
    /* Rules read as sentences: the setting IS the phrase, rather than a label
       above a dropdown whose meaning you have to reconstruct. */
    .au-rule {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      padding: 11px 13px; border-radius: 13px; background: var(--card-2);
      border: 1px solid var(--line); margin-bottom: 8px; font-size: 13.5px;
    }
    .au-rule span { color: var(--dim); }
    .au-rule select, .au-rule input {
      padding: 5px 9px; border-radius: 9px; background: var(--input-bg);
      border: 1px solid var(--line-strong); color: var(--text); font: 650 13px inherit; outline: none;
    }
    .au-rule input[type=number] { width: 68px; }
    .au-rule select:focus, .au-rule input:focus { border-color: var(--accent-line); }
    .au-note {
      display: block; margin: -3px 0 12px; padding: 8px 12px; border-radius: 10px;
      font-size: 12px; line-height: 1.5; color: var(--faint);
      background: rgba(255, 255, 255, 0.02); border: 1px solid var(--line);
    }
    .au-note.warn { color: var(--amber); border-color: rgba(251, 191, 36, 0.3); background: var(--amber-soft); }
    .au-note code { font-family: var(--mono); font-size: 11.5px; }
    .au-preview {
      padding: 10px 13px; border-radius: 12px; margin-bottom: 8px; font-size: 13px;
      background: var(--accent-soft); border: 1px solid var(--accent-line); color: var(--dim);
    }
    .au-preview:empty { display: none; }
    .au-preview b { color: var(--accent); font-weight: 700; }
    .au-preview i { display: block; font-style: normal; font-size: 11.5px; color: var(--faint); margin-top: 4px; }

    /* ---------- network ---------- */
    /* A port is a light and a sentence: is it open, and where does it reach. */
    .np-row {
      display: flex; align-items: center; gap: 11px; padding: 11px 13px;
      border-radius: 13px; background: var(--card-2); border: 1px solid var(--line); margin-bottom: 8px;
    }
    .np-dot { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--faint); }
    .np-dot.on { background: var(--green); box-shadow: 0 0 0 3px var(--green-soft); }
    .np-dot.warn { background: var(--yellow); box-shadow: 0 0 0 3px var(--yellow-soft); }
    .np-dot.bad { background: var(--red); box-shadow: 0 0 0 3px var(--red-soft); }
    .np-body { flex: 1; min-width: 0; }
    .np-name { font-size: 13.5px; font-weight: 650; }
    .np-meta { font-size: 11.5px; color: var(--faint); font-family: var(--mono); margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .np-why { font-size: 11.5px; line-height: 1.5; color: var(--amber); margin: -3px 0 10px; padding: 0 3px; }
    .np-why.bad { color: var(--red); }
    .np-new {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 11px 13px;
      border-radius: 13px; border: 1px dashed var(--line-strong);
    }
    .np-new input, .np-new select {
      padding: 5px 9px; border-radius: 9px; background: var(--input-bg);
      border: 1px solid var(--line-strong); color: var(--text); font: 650 13px inherit; outline: none;
    }
    .np-new input[type=number] { width: 92px; }
    .np-new input[type=text] { flex: 1; min-width: 140px; font-weight: 500; }
    .np-new input:focus, .np-new select:focus { border-color: var(--accent-line); }
    .np-presets { display: flex; flex-wrap: wrap; gap: 7px; }
    .np-preset {
      display: flex; align-items: center; gap: 7px; padding: 7px 11px; border-radius: 999px;
      border: 1px solid var(--line); background: var(--card-2); color: var(--dim);
      font: 600 12.5px inherit; cursor: pointer;
    }
    .np-preset:hover:not(:disabled) { border-color: var(--accent-line); color: var(--text); background: var(--accent-soft); }
    .np-preset:disabled { opacity: 0.4; cursor: default; }
    .np-preset u { text-decoration: none; font-family: var(--mono); font-size: 11px; color: var(--faint); }

    /* ---------- overview ---------- */
    .ov-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
    .ov-card { border: 1px solid var(--line); border-radius: 14px; background: var(--card-2); overflow: hidden; }
    .ov-head {
      display: flex; align-items: center; gap: 10px; padding: 10px 13px;
      font: 650 10.5px var(--mono); letter-spacing: 0.09em; text-transform: uppercase; color: var(--faint);
      border-bottom: 1px solid var(--line);
    }
    .ov-more {
      margin-left: auto; display: inline-flex; align-items: center; gap: 4px;
      font: 650 10.5px var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent);
    }
    .ov-more svg { width: 12px; height: 12px; }
    .ov-more:hover { color: var(--accent-hover, var(--accent)); }
    .ov-console { background: #060609; }
    .ov-empty { padding: 18px 14px; color: var(--faint); font-size: 13px; text-align: center; }

    .ov-players { display: flex; flex-wrap: wrap; gap: 7px; padding: 13px; }
    .ov-player {
      display: inline-flex; align-items: center; gap: 7px; padding: 4px 11px 4px 4px; border-radius: 99px;
      background: var(--card); border: 1px solid var(--line); font-size: 13px; font-weight: 600;
    }
    .ov-av { width: 22px; height: 22px; border-radius: 99px; display: grid; place-items: center; font-size: 11px; font-weight: 800; color: #fff; }

    .ov-acts { display: grid; grid-template-columns: repeat(auto-fit, minmax(168px, 1fr)); gap: 9px; }
    .ov-act {
      display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
      padding: 13px 14px; border-radius: 14px; text-align: left;
      background: var(--card-2); border: 1px solid var(--line); color: var(--text);
      transition: all 0.16s var(--ease);
    }
    .ov-act:hover { border-color: var(--accent-line); background: var(--accent-soft); transform: translateY(-1px); }
    .ov-act[disabled] { opacity: 0.55; pointer-events: none; }
    .ov-act svg { width: 16px; height: 16px; color: var(--accent); margin-bottom: 4px; }
    .ov-act b { font-size: 13.5px; font-weight: 700; }
    .ov-act i { font-style: normal; font-size: 11.5px; color: var(--faint); }

    /* the highest-value screen in the product: a server that stopped on an error */
    .ov-crash {
      border: 1px solid rgba(251, 113, 133, 0.35); background: rgba(251, 113, 133, 0.05);
      border-radius: 16px; padding: 15px; margin-bottom: 14px;
    }
    .ov-crash-head { display: flex; align-items: center; gap: 9px; font-size: 14.5px; color: var(--red); margin-bottom: 10px; }
    .ov-crash-head svg { width: 16px; height: 16px; flex: none; }
    .ov-crash-log {
      background: #060609; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
      font: 11.6px/1.55 var(--mono); color: #c9a0aa; overflow-x: auto; white-space: pre; margin-bottom: 11px;
    }
    .ov-crash-acts { display: flex; gap: 8px; flex-wrap: wrap; }

    /* ---------- console ---------- */
    /* Deliberately stays dark in the light theme: a terminal that flips to white
       reads as a text editor, and every other tool keeps it dark too. */
    .con-wrap { border: 1px solid var(--line-strong); border-radius: 14px; overflow: hidden; background: #060609; box-shadow: inset 0 2px 18px rgba(0, 0, 0, 0.5); }
    .con-head {
      display: flex; align-items: center; gap: 9px; flex-wrap: wrap;
      padding: 8px 11px; background: rgba(255, 255, 255, 0.028); border-bottom: 1px solid var(--line);
      font-size: 11.5px; color: var(--dim);
    }
    .con-head .seg { display: flex; background: rgba(0, 0, 0, 0.35); border: 1px solid var(--line); border-radius: 9px; padding: 2px; gap: 2px; }
    .con-head .seg button {
      font: 650 10.5px var(--mono); letter-spacing: 0.05em; padding: 3px 9px; border-radius: 7px; color: var(--faint);
      transition: all 0.15s var(--ease);
    }
    .con-head .seg button:hover { color: var(--text); }
    .con-head .seg button.on { background: #16161d; color: var(--text); }
    .con-head .seg button.on.warn { color: var(--amber); }
    .con-head .seg button.on.error { color: var(--red); }
    .conbtn {
      display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 8px;
      font: 650 10.5px var(--mono); letter-spacing: 0.05em; text-transform: uppercase;
      border: 1px solid var(--line); background: rgba(0, 0, 0, 0.3); color: var(--faint);
      transition: all 0.15s var(--ease);
    }
    .conbtn:hover { color: var(--text); border-color: var(--line-strong); }
    .conbtn.on { color: var(--green); border-color: rgba(52, 211, 153, 0.4); background: var(--green-soft); }
    .con-head .cdot { width: 7px; height: 7px; border-radius: 99px; background: var(--faint); flex: none; }
    .con-head .cdot.on { background: var(--green); box-shadow: 0 0 8px rgba(52, 211, 153, 0.8); animation: pulse 2s infinite; }
    .con-find {
      flex: 1; min-width: 90px; max-width: 200px; padding: 4px 9px; border-radius: 8px;
      background: rgba(0, 0, 0, 0.35); border: 1px solid var(--line); color: #d7dbea;
      font: 11.5px var(--mono); outline: none;
    }
    .con-find:focus { border-color: var(--accent-line); }
    .con-meta { margin-left: auto; font: 500 10.5px var(--mono); color: var(--faint); white-space: nowrap; }

    .con-log { max-height: 46dvh; overflow: auto; padding: 10px 12px; font: 12.4px/1.62 var(--mono); }
    .con-log .ln { display: flex; gap: 9px; white-space: pre-wrap; word-break: break-word; padding: 0 4px; border-radius: 4px; }
    .con-log .ln:hover { background: rgba(255, 255, 255, 0.04); }
    .con-log .ts { color: #5a5f75; flex: none; }
    .con-log .lv { flex: none; font-weight: 700; width: 5ch; color: #5a5f75; }
    .con-log .src { color: var(--accent-2); opacity: 0.8; flex: none; }
    .con-log .msg { color: #b9bfd4; min-width: 0; }
    .con-log .warn .lv, .con-log .warn .msg { color: var(--amber); }
    .con-log .error .lv, .con-log .error .msg { color: var(--red); }
    .con-log .debug .msg { color: #6b7089; }
    .con-log .join .msg { color: var(--green); }
    .con-log .leave .msg { color: #7c8199; }
    .con-log .faintln .msg { color: #6b7089; }
    .con-log .hi { background: rgba(251, 191, 36, 0.32); color: #fff; border-radius: 3px; }
    /* a Forge crash dump is mostly frames — collapse the run, expand on click */
    .con-log .fold { cursor: pointer; color: var(--faint); font-style: italic; opacity: 0.75; }
    .con-log .fold:hover { opacity: 1; }
    .con-log .ready {
      margin: 6px 0; padding: 2px 4px; color: var(--green); font-weight: 650;
      border-top: 1px dashed rgba(52, 211, 153, 0.3); border-bottom: 1px dashed rgba(52, 211, 153, 0.3);
    }
    .con-more {
      display: block; width: 100%; margin-bottom: 8px; padding: 5px; border-radius: 7px;
      font: 650 10.5px var(--mono); letter-spacing: 0.06em; text-transform: uppercase;
      background: rgba(255, 255, 255, 0.04); border: 1px solid var(--line); color: var(--faint);
    }
    .con-more:hover:not([disabled]) { color: var(--accent); border-color: var(--accent-line); }
    .con-more[disabled] { opacity: 0.5; }
    .con-start, .con-empty { text-align: center; color: #5a5f75; font-size: 11px; padding: 6px 0 10px; }

    .con-ac { margin-top: 8px; }
    .con-ac div {
      padding: 6px 11px; font: 12.4px var(--mono); color: var(--dim); display: flex; gap: 10px;
      cursor: pointer; border: 1px solid transparent;
    }
    .con-ac div:first-child { border-radius: 9px 9px 0 0; }
    .con-ac div:last-child { border-radius: 0 0 9px 9px; }
    .con-ac div:only-child { border-radius: 9px; }
    .con-ac div.on { background: var(--accent-soft); color: var(--text); border-color: var(--accent-line); }
    .con-ac div i { color: var(--faint); font-style: normal; margin-left: auto; font-size: 11px; }
    .con-ac:not(:empty) { border: 1px solid var(--line-strong); border-radius: 9px; background: var(--pop-bg); overflow: hidden; box-shadow: var(--shadow-2); }

    /* ---------- settings (grouped) ---------- */
    .set-hero { margin-bottom: 18px; }
    .set-hero h3 { font-size: 16px; font-weight: 780; letter-spacing: -0.01em; margin-bottom: 4px; }
    .set-hero p { font-size: 12.5px; color: var(--faint); line-height: 1.5; }
    .essgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .essgrid .full { grid-column: 1 / -1; }
    @media (max-width: 560px) { .essgrid { grid-template-columns: 1fr; } }
    .setgroup { border: 1px solid var(--line); border-radius: 15px; margin-bottom: 10px; overflow: hidden; background: var(--card); transition: border-color 0.2s; }
    .setgroup.open { border-color: var(--line-strong); }
    .setgroup > .gh { display: flex; align-items: center; gap: 11px; padding: 14px 15px; cursor: pointer; user-select: none; font-weight: 650; font-size: 14px; transition: background 0.14s; }
    .setgroup > .gh:hover { background: var(--card-2); }
    .setgroup > .gh .gi { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; background: var(--accent-soft); flex: none; font-size: 15px; }
    .setgroup > .gh .cnt { margin-left: auto; font-size: 11.5px; color: var(--faint); font-weight: 650; padding: 3px 9px; border-radius: 99px; background: var(--card-2); border: 1px solid var(--line); }
    .setgroup > .gh .chev { color: var(--faint); transition: transform 0.2s; display: grid; place-items: center; }
    .setgroup > .gh .chev svg { width: 14px; height: 14px; }
    .setgroup.open > .gh .chev { transform: rotate(90deg); }
    .setgroup > .body { display: none; padding: 2px 15px 10px; }
    .setgroup.open > .body { display: block; }
    .setrow { padding: 13px 0; border-top: 1px solid var(--line); }
    .setrow:first-child { border-top: 0; }
    .setrow > label { display: block; font-size: 13.5px; font-weight: 600; margin-bottom: 7px; }
    .setrow .h { font-size: 12px; color: var(--faint); margin-top: 6px; line-height: 1.5; }
    .setrow input, .setrow select { width: 100%; padding: 10px 12px; border-radius: 10px; background: var(--card-2); border: 1px solid var(--line); color: var(--text); outline: none; transition: border-color 0.15s, box-shadow 0.15s; }
    .setrow input:focus, .setrow select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .setrow.check { display: flex; align-items: flex-start; gap: 11px; }
    .setrow.check input { width: auto; margin-top: 2px; }
    .setrow.check > div { flex: 1; }
    .setrow.check label { display: block; font-size: 13.5px; font-weight: 600; margin: 0; }
    .rate { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .rate .seg { display: inline-flex; background: var(--card-2); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
    .rate .seg button { padding: 9px 13px; font-size: 12.5px; color: var(--dim); border: 0; background: none; transition: all 0.13s; }
    .rate .seg button.on { background: var(--accent-soft); color: var(--accent); }
    .rate input { width: 88px; }
    .platgrid { display: flex; gap: 16px; flex-wrap: wrap; }
    .platgrid label { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 500; margin: 0; }
    .platgrid input { width: auto; }
    .nores { text-align: center; color: var(--faint); padding: 22px; font-size: 13px; }

    /* ---------- file manager ---------- */
    .crumbs { display: flex; flex-wrap: wrap; gap: 1px; align-items: center; margin-bottom: 10px; font-size: 12.5px; color: var(--text-faint); }
    .crumbs button { color: var(--accent); font-weight: 650; padding: 5px 8px; border-radius: 8px; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; transition: background 0.13s; }
    .crumbs button:hover { background: var(--accent-soft); }
    .crumbs button.here { color: var(--text); }
    .crumbs .csep { opacity: 0.5; }
    .crumbs .root svg { width: 13px; height: 13px; vertical-align: -2px; margin-right: 5px; }

    /* toolbar: upload / new folder on the left, filter + view controls on the right */
    .fmbar { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; margin-bottom: 11px; }
    .fmsearch {
      display: flex; align-items: center; gap: 8px; padding: 7px 11px; flex: 1 1 130px; min-width: 0;
      border-radius: var(--radius-sm); background: var(--bg-elevated); border: 1px solid var(--border);
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .fmsearch:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--focus-ring); }
    .fmsearch input { flex: 1; min-width: 0; background: none; border: 0; outline: none; color: var(--text); font-size: 13px; }
    .fmsearch svg { width: 14px; height: 14px; color: var(--text-faint); flex: none; }
    .fmseg { display: flex; gap: 2px; padding: 3px; border-radius: 10px; background: var(--track-bg); border: 1px solid var(--border); flex: none; }
    .fmseg button { padding: 6px 9px; border-radius: 7px; display: grid; place-items: center; color: var(--text-faint); transition: all 0.14s var(--ease-out); }
    .fmseg button svg { width: 15px; height: 15px; }
    .fmseg button.on { background: var(--bg-elevated); color: var(--text); box-shadow: var(--shadow-card); }
    .minibtn svg { width: 14px; height: 14px; vertical-align: -2px; margin-right: 5px; }
    .minibtn.icon { padding: 8px 9px; }
    .minibtn.icon svg { margin: 0; display: block; }

    /* everything below the toolbar accepts a file drop */
    .fmzone { position: relative; min-height: 90px; }
    .fmzone.drag::after {
      content: ''; position: absolute; inset: -8px; z-index: 2; pointer-events: none;
      border: 2px dashed var(--accent); border-radius: 16px; background: var(--accent-soft);
    }
    .fmzone .fmdrop {
      display: none; position: absolute; inset: 0; z-index: 3; place-items: center; pointer-events: none;
      font-size: 13.5px; font-weight: 700; color: var(--accent);
    }
    .fmzone.drag .fmdrop { display: grid; }

    .fitem {
      display: flex; align-items: center; gap: 11px; padding: 9px; margin: 0 -9px; border-radius: 11px;
      cursor: pointer; border-top: 1px solid var(--border); transition: background 0.13s;
    }
    .flist .fitem:first-child { border-top: 0; }
    .fitem:hover { background: var(--bg-hover); }
    .fitem.sel { background: var(--accent-soft); }
    .fitem .fmain { flex: 1; min-width: 0; }
    .fitem .fname { font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .fitem .fmeta { font-size: 11.5px; color: var(--text-faint); margin-top: 1px; }
    .fitem > svg.chev { width: 15px; height: 15px; flex: none; color: var(--text-faint); }
    .fchk {
      width: 19px; height: 19px; border-radius: 6px; flex: none; display: grid; place-items: center;
      border: 1.5px solid var(--border-strong); background: var(--input-bg); transition: all 0.13s;
    }
    .fchk svg { width: 12px; height: 12px; color: #fff; opacity: 0; }
    .fitem.sel .fchk { background: var(--accent); border-color: var(--accent); }
    .fitem.sel .fchk svg { opacity: 1; }
    .fdots { padding: 6px; border-radius: 8px; color: var(--text-faint); flex: none; display: grid; place-items: center; }
    .fdots svg { width: 16px; height: 16px; }
    .fdots:hover { background: var(--bg-active); color: var(--text); }

    /* icon chip, tinted by what the file is */
    .ficon { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 9px; background: var(--bg-elevated); border: 1px solid var(--border); color: var(--text-dim); flex: none; }
    .ficon svg { width: 15px; height: 15px; }
    .ficon.fold { color: var(--accent); background: var(--accent-soft); border-color: rgba(124, 108, 255, 0.25); }
    .ficon.img { color: var(--green); background: var(--green-soft); border-color: rgba(52, 211, 153, 0.22); }
    .ficon.zip { color: var(--yellow); background: var(--yellow-soft); border-color: rgba(251, 191, 36, 0.22); }
    .ficon.code { color: var(--accent-2); background: rgba(34, 211, 238, 0.12); border-color: rgba(34, 211, 238, 0.22); }
    .ficon.world { color: var(--accent-3); background: rgba(217, 70, 239, 0.12); border-color: rgba(217, 70, 239, 0.22); }

    /* Icons carry a viewBox but no width/height, so they size purely from CSS.
       Every other one sits in a wrapper that gives it a size; the folder-row
       chevron is dropped straight into the flex row, where auto width resolved
       against the free space and drew it at 586px. */
    .plister .prow > svg { width: 15px; height: 15px; flex: none; color: var(--faint); }

    /* tiles */
    .fgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 9px; }
    .fgrid .fitem {
      flex-direction: column; text-align: center; gap: 9px; margin: 0; padding: 15px 9px 13px;
      border: 1px solid var(--border); border-radius: 14px; background: var(--bg-card); position: relative;
    }
    .fgrid .fitem .ficon { width: 44px; height: 44px; border-radius: 13px; }
    .fgrid .fitem .ficon svg { width: 21px; height: 21px; }
    .fgrid .fitem .fmain { flex: none; width: 100%; }
    .fgrid .fitem .fname { font-size: 12.5px; white-space: normal; word-break: break-word; line-height: 1.35; max-height: 2.7em; overflow: hidden; }
    .fgrid .fitem .fmeta { font-size: 10.5px; }
    .fgrid .fitem > svg.chev { display: none; }
    .fgrid .fchk, .fgrid .fdots { position: absolute; top: 7px; }
    .fgrid .fchk { left: 7px; }
    .fgrid .fdots { right: 4px; }

    /* selection action bar, replaces the toolbar while items are picked */
    .fmsel {
      display: flex; align-items: center; gap: 7px; flex-wrap: wrap; padding: 8px 8px 8px 12px; margin-bottom: 11px;
      border-radius: var(--radius-sm); background: var(--accent-soft); border: 1px solid var(--accent-line);
    }
    .fmsel b { flex: 1; font-size: 13px; white-space: nowrap; }

    /* row / sort popover */
    .fmenu {
      position: fixed; z-index: 60; min-width: 178px; padding: 6px; border-radius: 14px;
      background: var(--pop-bg); border: 1px solid var(--border-strong); box-shadow: var(--shadow-pop);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); animation: fade 0.13s var(--ease-out);
    }
    .fmenu button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 10px; border-radius: 9px; font-size: 13px; font-weight: 600; color: var(--text); text-align: left; }
    .fmenu button:hover { background: var(--bg-hover); }
    .fmenu button svg { width: 15px; height: 15px; flex: none; color: var(--text-faint); }
    .fmenu button.red, .fmenu button.red svg { color: var(--red); }
    .fmenu button.on { color: var(--accent); }
    .fmenu button.on svg { color: var(--accent); }
    .fmenu .msep { height: 1px; margin: 5px 4px; background: var(--border); }

    /* transfer tray */
    .fups { margin-top: 12px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--bg-card); overflow: hidden; }
    .fup { display: flex; align-items: center; gap: 10px; padding: 9px 11px; border-top: 1px solid var(--border); font-size: 12.5px; }
    .fup:first-child { border-top: 0; }
    .fup .fupname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
    .fup .fuppct { color: var(--text-faint); font: 11.5px var(--mono); flex: none; }
    .fup.bad .fupname { color: var(--red); }
    .fup.done .fupname { color: var(--green); }
    .fupbar { width: 78px; height: 4px; border-radius: 3px; background: var(--track-bg); overflow: hidden; flex: none; }
    .fupbar i { display: block; height: 100%; width: 0; border-radius: 3px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width 0.2s var(--ease-out); }

    /* editor + preview */
    .filebar { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
    .filebar .fname { flex: 1; min-width: 130px; font: 12px var(--mono); color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .filebar .fname .dot { color: var(--yellow); }
    .fileedit {
      width: 100%; min-height: 44dvh; padding: 13px 14px; border-radius: 14px;
      background: #060609; border: 1px solid var(--border-strong);
      color: #d7dbea; font: 12px/1.6 var(--mono); outline: none; resize: vertical;
      box-shadow: inset 0 2px 18px rgba(0, 0, 0, 0.5); transition: border-color 0.15s;
    }
    .fileedit:focus { border-color: var(--accent); }
    .fprev { display: grid; place-items: center; padding: 20px; border-radius: 14px; background: var(--track-bg); border: 1px solid var(--border); min-height: 200px; }
    .fprev img { max-width: 100%; max-height: 56dvh; border-radius: 10px; }

    /* ---------- skeletons / empty / toasts ---------- */
    .skel { height: 138px; border-radius: var(--radius); margin-bottom: 14px; border: 1px solid var(--line);
      background: linear-gradient(100deg, var(--card) 40%, var(--card-2) 50%, var(--card) 60%);
      background-size: 200% 100%; animation: shimmer 1.4s infinite linear; }
    @keyframes shimmer { to { background-position: -200% 0; } }
    .empty { text-align: center; padding: 60px 20px; color: var(--faint); }
    .empty .halo { margin: 0 auto 18px; width: 64px; height: 64px; }
    .empty .halo img { width: 64px; height: 64px; border-radius: 18px; }
    .empty b { display: block; color: var(--dim); font-size: 15px; margin-bottom: 6px; }
    #toasts { position: fixed; left: 0; right: 0; bottom: calc(18px + env(safe-area-inset-bottom)); z-index: 50;
      display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
    .toast {
      display: flex; align-items: center; gap: 9px;
      max-width: 86vw; padding: 12px 19px; border-radius: 99px; font-size: 13px; font-weight: 600;
      background: var(--pop-bg); color: var(--text); border: 1px solid var(--line-strong);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 14px 38px rgba(0, 0, 0, 0.55); animation: rise 0.24s var(--ease);
    }
    .toast::before { content: ''; width: 7px; height: 7px; border-radius: 99px; background: var(--green); flex: none; box-shadow: 0 0 8px rgba(52, 211, 153, 0.7); }
    .toast.bad { border-color: rgba(251, 113, 133, 0.4); color: var(--red); }
    .toast.bad::before { background: var(--red); box-shadow: 0 0 8px rgba(251, 113, 133, 0.7); }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } }
    @keyframes pulse { 50% { opacity: 0.4; } }

    /* ---------- fleet health (admin) ---------- */
    /* deliberately outside the desktop block: the health view renders on phones too */
    .hstats { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 9px; margin-top: 13px; }
    .hstat { padding: 10px 12px; border-radius: var(--radius-sm); background: var(--card-2); border: 1px solid var(--line); }
    .hstat .v { font-size: 16px; font-weight: 780; letter-spacing: -0.01em; }
    .hstat .l { font-size: 10.5px; color: var(--faint); font-weight: 650; letter-spacing: 0.04em; text-transform: uppercase; margin-top: 3px; }
    .meter { margin-top: 12px; }
    .meter .mrow { display: flex; align-items: baseline; gap: 8px; font-size: 12.5px; margin-bottom: 6px; }
    .meter .mrow b { font-weight: 650; }
    .meter .mrow span { margin-left: auto; color: var(--dim); font-variant-numeric: tabular-nums; }
    .meter .track { height: 6px; border-radius: 99px; background: var(--track-bg); overflow: hidden; }
    .meter .fill { height: 100%; border-radius: 99px; background: var(--green); transition: width 0.45s var(--ease); }
    .meter.warm .fill { background: var(--amber); }
    .meter.dead .fill { background: var(--red); }
    .meter.none .fill { background: var(--faint); opacity: 0.45; }
    .alertrow { display: flex; align-items: center; gap: 9px; padding: 10px 12px; border-radius: var(--radius-sm);
      background: var(--card-2); border: 1px solid var(--line); font-size: 12.5px; margin-top: 8px; }
    .alertrow .dot { width: 7px; height: 7px; border-radius: 99px; flex: none; background: var(--amber); }
    .alertrow.bad { border-color: rgba(251, 113, 133, 0.35); }
    .alertrow.bad .dot { background: var(--red); box-shadow: 0 0 8px rgba(251, 113, 133, 0.6); }
    .alertrow .who { flex: 1; min-width: 0; }
    .alertrow .who b { display: block; font-weight: 700; }
    .alertrow .who i { font-style: normal; color: var(--dim); font-size: 11.5px; }

    /* ---------- responsive & motion ---------- */
    @media (max-width: 899px) {
      .card { padding: 15px 15px 16px; }
      .btn { min-height: 46px; }
    }
    @media (hover: hover) {
      .btn:hover, .minibtn:hover { filter: brightness(1.14); }
      .card:hover { border-color: var(--line-strong); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.001s !important; transition-duration: 0.001s !important; }
    }

    /* ============ the control deck ============ */
    /* One layout, two presentations. These used to live inside a
       @media (min-width:900px) block with a whole parallel set of mobile
       components; now they apply everywhere and only the shell arrangement
       changes at the breakpoint. */

    #app { display: flex; gap: 18px; align-items: stretch; }

    /* ---------- rail ---------- */
    .rail {
      width: 312px; flex: none; display: flex; flex-direction: column; min-height: 0;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.02), transparent 30%), var(--card);
      border: 1px solid var(--line); border-radius: 22px; overflow: hidden; box-shadow: var(--shadow-2);
    }
    .rail-head { padding: 18px 19px 10px; font-size: 11px; font-weight: 800; letter-spacing: 0.09em; text-transform: uppercase; color: var(--faint); }
    .rail-tools { padding: 0 12px 10px; display: flex; flex-direction: column; gap: 9px; }
    .rail-search {
      width: 100%; padding: 9px 12px; border-radius: 11px; font-size: 13.5px;
      background: var(--input-bg); border: 1px solid var(--line); color: var(--text); outline: none;
      transition: border-color 0.15s var(--ease);
    }
    .rail-search::placeholder { color: var(--faint); }
    .rail-search:focus { border-color: var(--accent-line); background: var(--input-bg-focus); }
    .rail-chips { display: flex; gap: 5px; flex-wrap: wrap; }
    .rchip {
      font-size: 11.5px; font-weight: 650; padding: 4px 10px; border-radius: 99px;
      background: var(--card-2); border: 1px solid var(--line); color: var(--dim);
      transition: all 0.15s var(--ease);
    }
    .rchip:hover { color: var(--text); border-color: var(--line-strong); }
    .rchip.on { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent); }

    .rail-list { flex: 1; overflow-y: auto; padding: 0 9px 9px; min-height: 0; }
    .grp {
      display: flex; align-items: center; gap: 8px;
      padding: 14px 12px 6px; font-size: 10.5px; font-weight: 700;
      letter-spacing: 0.12em; text-transform: uppercase; color: var(--faint);
    }
    .grp .ct { background: var(--card-2); border-radius: 99px; padding: 1px 7px; font-size: 10px; letter-spacing: 0.04em; }
    .grp::after { content: ''; flex: 1; height: 1px; background: var(--line); }

    .srow {
      position: relative; display: grid; grid-template-columns: 38px minmax(0, 1fr) auto;
      align-items: center; gap: 12px; padding: 10px 12px; border-radius: 14px;
      cursor: pointer; margin-bottom: 3px; border: 1px solid transparent;
      transition: background 0.16s var(--ease), border-color 0.16s var(--ease);
    }
    .srow:hover { background: var(--card-2); }
    .srow:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
    .srow.stale { opacity: 0.55; }
    .srow.sel { background: var(--accent-soft); border-color: rgba(124, 108, 255, 0.28); }
    .srow.sel::before {
      content: ''; position: absolute; left: -9px; top: 22%; bottom: 22%; width: 3px; border-radius: 0 4px 4px 0;
      background: linear-gradient(180deg, var(--accent), var(--accent-2)); box-shadow: 0 0 12px rgba(124, 108, 255, 0.8);
    }
    .srow .tile { width: 38px; height: 38px; border-radius: 12px; font-size: 16px; position: relative; }
    .srow-txt { min-width: 0; }
    .srow .nm { font-weight: 650; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .srow .sub { font-size: 11.5px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; font-family: var(--mono); }
    /* quick actions: hover on pointer devices, always visible on touch */
    .srow-acts { display: flex; gap: 5px; opacity: 0; transform: translateX(4px); transition: all 0.16s var(--ease); }
    .srow:hover .srow-acts, .srow.sel .srow-acts, .srow:focus-within .srow-acts { opacity: 1; transform: none; }
    @media (hover: none) { .srow-acts { opacity: 1; transform: none; } }
    .icb {
      width: 29px; height: 29px; border-radius: 9px; display: grid; place-items: center;
      border: 1px solid var(--line); background: var(--card); color: var(--dim);
      transition: all 0.15s var(--ease);
    }
    .icb svg { width: 13px; height: 13px; }
    .icb:hover { color: var(--text); border-color: var(--line-strong); }
    .icb.go:hover { color: var(--green); border-color: rgba(52, 211, 153, 0.45); background: var(--green-soft); }
    .icb.no:hover { color: var(--red); border-color: rgba(251, 113, 133, 0.45); background: var(--red-soft); }

    .rail-foot { padding: 12px; border-top: 1px solid var(--line); }
    .rail-foot button {
      width: 100%; padding: 13px; border-radius: 14px; font-weight: 700; font-size: 13.5px;
      background: var(--card-2); border: 1px solid var(--line-strong); color: var(--text);
      transition: all 0.16s var(--ease);
    }
    .rail-foot button:hover { border-color: rgba(124, 108, 255, 0.4); color: var(--accent); background: var(--accent-soft); }
    .rail-foot button.sel { background: var(--accent-soft); border-color: rgba(124, 108, 255, 0.35); color: var(--accent); }
    .rail-foot button svg { width: 14px; height: 14px; vertical-align: -2px; margin-right: 5px; }
    .rail-foot button + button { margin-top: 8px; }
    .rail-foot .sponsor { display: block; text-align: center; margin-top: 12px; color: var(--faint); font-size: 12px; text-decoration: none; }
    .rail-foot .sponsor:hover { color: var(--dim); }

    /* ---------- detail pane ---------- */
    .detail {
      flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.018), transparent 26%), var(--card);
      border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow-2);
    }
    .dhero { padding: 20px 22px 0; flex: none; position: relative; }
    .dhero::before {
      content: ''; position: absolute; inset: 0 0 auto; height: 120px; pointer-events: none;
      background: radial-gradient(60% 100% at 30% 0%, rgba(124, 108, 255, 0.09), transparent 70%);
    }
    .dhero-row { display: flex; align-items: center; gap: 14px; position: relative; }
    .dhero .tile { width: 52px; height: 52px; border-radius: 16px; font-size: 22px; flex: none; }
    .dhero h2 { font-size: 22px; font-weight: 800; letter-spacing: -0.03em; }
    .dhero .dhsub { color: var(--dim); font-size: 12.5px; margin-top: 3px; }
    .dhero-acts { margin-left: auto; display: flex; gap: 9px; flex-wrap: wrap; justify-content: flex-end; }
    .dhero .addr { margin-top: 14px; }
    /* only meaningful when the detail is an overlay */
    .backbtn { display: none; width: 34px; height: 34px; border-radius: 11px; place-items: center; flex: none; border: 1px solid var(--line); background: var(--card-2); color: var(--dim); }
    .backbtn svg { width: 16px; height: 16px; }
    .backbtn:hover { color: var(--text); border-color: var(--line-strong); }

    .dbtn {
      display: inline-flex; align-items: center; gap: 8px; padding: 11px 18px; border-radius: 13px;
      font-weight: 700; font-size: 13.5px; border: 1px solid var(--line-strong); background: var(--card-2); color: var(--text);
      transition: all 0.16s var(--ease);
    }
    .dbtn:hover { filter: brightness(1.15); transform: translateY(-1px); }
    .dbtn:active { transform: scale(0.97); }
    .dbtn[disabled] { opacity: 0.55; pointer-events: none; }
    .dbtn.start { background: var(--green-soft); border-color: rgba(52, 211, 153, 0.45); color: var(--green); box-shadow: 0 6px 22px rgba(52, 211, 153, 0.15); }
    .dbtn.stop { background: var(--red-soft); border-color: rgba(251, 113, 133, 0.4); color: var(--red); }
    .dbtn svg { width: 15px; height: 15px; }

    .dstats { display: flex; gap: 10px; margin: 16px 0 8px; flex-wrap: wrap; position: relative; }
    .dstat { min-width: 112px; padding: 10px 13px; border-radius: 14px; background: var(--card-2); border: 1px solid var(--line); }
    .dstat .v { font-size: 16.5px; font-weight: 780; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
    .dstat .v u { font-size: 11.5px; font-weight: 500; color: var(--faint); text-decoration: none; margin-left: 2px; font-family: var(--mono); }

    .dstat.dead .v { color: var(--faint); font-weight: 600; font-size: 13.5px; }

      border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color 0.15s;
    }

    .dtabs button:hover { color: var(--text); }
    .dtabs button.on { color: var(--accent); border-image: linear-gradient(90deg, var(--accent), var(--accent-2)) 1; }

    .dbody .grouphead:first-child { margin-top: 0; }

    .dwelcome .halo { width: 78px; height: 78px; margin-bottom: 20px; }
    .dwelcome .halo img { width: 78px; height: 78px; border-radius: 22px; }
    .dwelcome b { color: var(--dim); font-size: 16px; display: block; margin-bottom: 6px; }
    #vHost, #vHosting, #vHealth { max-width: 660px; }
    /* the store compares plans side by side, so it gets room the other panes don't need */
    #vHost, #vHosting { max-width: 820px; }

    /* ---------- store ---------- */
    /* Plans are grouped by game and compared as cards: the old flat list mixed
       four games in one column and hid what you were actually buying. */
    .sg { margin-bottom: 22px; }
    .sg-head { display: flex; align-items: center; gap: 11px; margin-bottom: 11px; }
    .sg-tile {
      width: 36px; height: 36px; border-radius: 11px; flex: none; display: grid; place-items: center;
      font-weight: 800; font-size: 15px; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.25);
    }
    .sg-name { font-weight: 700; font-size: 15px; }
    .sg-sub { font-size: 12px; color: var(--faint); margin-top: 2px; }
    .plan-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(212px, 1fr)); gap: 10px; }
    .plan {
      display: flex; flex-direction: column; gap: 11px; text-align: left; width: 100%;
      padding: 15px 15px 14px; border-radius: 15px; cursor: pointer;
      background: var(--card-2); border: 1px solid var(--line);
      transition: border-color .15s var(--ease), background .15s var(--ease), transform .15s var(--ease);
    }
    .plan:hover { border-color: var(--accent-line); background: var(--bg-hover); transform: translateY(-2px); }
    .plan:active { transform: translateY(0); }
    .plan-name { font-weight: 700; font-size: 14.5px; }
    .plan-price { display: flex; align-items: baseline; gap: 3px; margin-top: 3px; }

    .plan-price span { font-size: 12px; color: var(--faint); font-weight: 600; }
    .plan-specs { display: flex; flex-direction: column; gap: 6px; }
    .plan-specs div { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--dim); }
    .plan-specs svg { width: 13px; height: 13px; flex: none; color: var(--accent); }
    .plan-cta {
      margin-top: auto; text-align: center; padding: 9px; border-radius: 10px; font-weight: 650; font-size: 13px;
      background: var(--accent-soft); color: var(--accent); border: 1px solid var(--accent-line);
    }
    .plan:hover .plan-cta { background: var(--accent); color: #fff; border-color: transparent; }
    .store-closed { padding: 26px 18px; text-align: center; color: var(--faint); font-size: 13px; line-height: 1.55; }
    .store-alert {
      display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; cursor: pointer;
      padding: 13px 15px; margin-bottom: 16px; border-radius: 14px;
      background: var(--amber-soft); border: 1px solid rgba(251, 191, 36, 0.32); color: var(--text);
      transition: border-color .15s var(--ease);
    }
    .store-alert:hover { border-color: rgba(251, 191, 36, 0.6); }
    .store-alert > span { display: grid; place-items: center; flex: none; }
    .store-alert svg { width: 16px; height: 16px; color: var(--amber); }
    .store-alert div { flex: 1; min-width: 0; }
    .store-alert b { display: block; font-size: 13.5px; font-weight: 650; }
    .store-alert i { display: block; font-style: normal; font-size: 12px; color: var(--faint); margin-top: 2px; }

    /* ---------- wide: rail and detail side by side ---------- */
    @media (min-width: 900px) {
      .shell { max-width: 1360px; padding: 0 26px 26px; }
      .top { margin: 0 0 20px; padding: calc(14px + env(safe-area-inset-top)) 6px 14px; background: transparent; backdrop-filter: none; -webkit-backdrop-filter: none; border-bottom-color: transparent; }
      .wordmark { font-size: 19px; }
      .login { max-width: 460px; margin: 0 auto; padding-top: 9vh; }
      #app { height: calc(100dvh - 96px); }
      .dhero { padding: 24px 26px 0; }
      .dbody { padding: 24px 26px; }
      .dbody .savebar { bottom: -24px; margin: 10px -26px -24px; padding: 14px 26px 18px; }
      /* ordering opens #sheet as a centred dialog here */
      .sheet {
        bottom: auto; top: 50%; transform: translateY(-50%); border-radius: 24px;
        border: 1px solid var(--line-strong); box-shadow: 0 34px 100px rgba(0, 0, 0, 0.6);
        max-height: 86dvh; animation: fade 0.2s;
      }
    }

    /* ---------- narrow: the detail slides over the rail ---------- */
    @media (max-width: 899px) {
      #app { display: block; }
      .rail { width: auto; border-radius: 18px; max-height: calc(100dvh - 150px); }
      .detail {
        position: fixed; inset: 0; z-index: 45; border-radius: 0; border: 0;
        transform: translateX(100%); transition: transform 0.26s var(--ease);
        padding-top: env(safe-area-inset-top);
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.018), transparent 26%), var(--bg);

      .backbtn { display: grid; }

      .dhero-acts .dbtn { flex: 1; justify-content: center; }
      .dhero-row { flex-wrap: wrap; }
      .dstat { flex: 1; min-width: 96px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .detail { transition: none; }
    }

  <!-- Paint the stored theme before first render. Inline and synchronous on
       purpose: deferring this to the module script below flashes dark-then-light
       on every load for anyone using the light theme. Same storage key and
       default as the desktop app (src/renderer/src/theme.ts). -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('elauncher.theme') === 'light' ? 'light' : 'dark'
        document.documentElement.dataset.theme = t
        var m = document.querySelector('meta[name="theme-color"]')
        if (m) m.setAttribute('content', t === 'light' ? '#eef0f7' : '#0a0a0f')
      } catch (e) {
        /* private mode / storage blocked — dark is the default anyway */
      }
    })()
  </script>

    function toast(message, bad = false) {
      const el = document.createElement('div')
      el.className = `toast${bad ? ' bad' : ''}`
      el.textContent = message
      $('toasts').appendChild(el)
      setTimeout(() => el.remove(), 2600)
    }

    const hueOf = (id) => [...String(id)].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7) % 360
    const gradOf = (id) => {
      const h = hueOf(id)
      return `linear-gradient(135deg, hsl(${h} 68% 55%), hsl(${(h + 46) % 360} 74% 45%))`
    }

    function fmtUptime(ms) {
      const m = Math.floor(ms / 60_000)
      const h = Math.floor(m / 60)
      const d = Math.floor(h / 24)
      return d > 0 ? `${d}d ${h % 24}h` : h > 0 ? `${h}h ${m % 60}m` : `${Math.max(0, m)}m`
    }

    /** serverId -> owning account (yours, or the friend who shared it with you) */
    const ownerOf = new Map()

    async function queue(serverId, action, payload = '') {
      const { error } = await supabase.from('server_commands').insert({
        server_id: serverId, owner_id: ownerOf.get(serverId) ?? me, sender_id: me, sender_name: myName, action, payload
      })
      if (error) throw new Error(error.message)
    }

    async function fetchServers() {
      // your servers + servers other people shared with you (Access tab in the launcher)
      const [mineRes, sharesRes] = await Promise.all([
        supabase.from('server_status').select('*').eq('owner_id', me),
        supabase.from('server_shares').select('server_id, server_name, owner_id').eq('grantee_id', me)
      ])
      if (mineRes.error) throw new Error(mineRes.error.message)
      const mine = (mineRes.data ?? []).map((row) => ({ ...row, _owner: null }))
      mine.forEach((row) => ownerOf.set(row.server_id, me))

      const shares = sharesRes.error ? [] : (sharesRes.data ?? [])
      let shared = []
      if (shares.length) {
        const ids = shares.map((s) => s.server_id)
        const ownerIds = [...new Set(shares.map((s) => s.owner_id))]
        const [stRes, ownersRes] = await Promise.all([
          supabase.from('server_status').select('*').in('server_id', ids),
          supabase.from('profiles').select('id, username').in('id', ownerIds)
        ])
        const stMap = new Map((stRes.data ?? []).map((row) => [row.server_id, row]))
        const names = new Map((ownersRes.data ?? []).map((p) => [p.id, p.username]))
        const mineIds = new Set(mine.map((row) => row.server_id))
        shared = shares
          .filter((s) => !mineIds.has(s.server_id))
          .map((s) => {
            ownerOf.set(s.server_id, s.owner_id)
            const st = stMap.get(s.server_id)
            return {
              ...(st ?? { server_id: s.server_id, name: s.server_name, state: 'stopped', players: [], console: '', updated_at: '' }),
              name: (st && st.name) || s.server_name,
              _owner: names.get(s.owner_id) ?? 'friend'
            }
          })
      }
      return [...mine, ...shared].sort((a, b) => (a.name || '').localeCompare(b.name || ''))
    }

    /** Watch for a state via the live-merged rows; fetch as fallback when realtime is off. */
    async function waitForState(serverId, wanted, timeoutMs) {
      const until = Date.now() + timeoutMs
      let lastFetch = Date.now()
      while (Date.now() < until) {
        await new Promise((r) => setTimeout(r, rtLive ? 500 : 1500))
        if (!rtLive && Date.now() - lastFetch > 3500) {
          lastFetch = Date.now()
          const rows = await fetchServers().catch(() => null)
          if (rows) applyRows(rows)
        }
        const row = rowsById.get(serverId)
        if (row && row.state === wanted) return true
      }
      return false
    }

    /** Without realtime, poll in quick bursts right after an action so the click still feels snappy. */
    function refreshSoon() {
      if (rtLive) return
      for (const ms of [1200, 3200, 6200]) setTimeout(() => void refresh(), ms)
    }

    /** Flip the card into its transitional state immediately — the heartbeat corrects it if the host disagrees. */
    function optimistic(serverId, state) {
      const row = rowsById.get(serverId)
      if (row) {
        row.state = state
        schedulePaint()
      }
    }

    window.act = async (serverId, action) => {
      if (action === 'forceStop') {
        if (!confirm('Force stop this server?\n\nThis kills the server process immediately — anything it has not written to disk since its last save is lost. Only do this if a normal stop is not finishing.')) return
      } else if ((action === 'stop' || action === 'restart') && !confirm(`${action === 'stop' ? 'Stop' : 'Restart'} this server?`)) return
      try {
        if (action === 'restart') {
          restarting.add(serverId)
          optimistic(serverId, 'stopping')
          toast('Restarting — saving and stopping first…')
          await queue(serverId, 'stop')
          if (await waitForState(serverId, 'stopped', 120_000)) {
            await queue(serverId, 'start')
            optimistic(serverId, 'starting')
            toast('Starting back up')
          } else toast('The server did not stop in time', true)
          restarting.delete(serverId)
        } else {
          optimistic(serverId, action === 'start' ? 'starting' : 'stopping')
          await queue(serverId, action)
          toast(action === 'start' ? 'Start request sent' : action === 'forceStop' ? 'Force stop sent' : 'Stop request sent')
        }
        refreshSoon()
      } catch (e) {
        restarting.delete(serverId)
        toast(e.message ?? 'Command failed', true)
        void refresh() // roll back the optimistic state
      }
    }

    window.sendCmd = async (serverId, inputId) => {
      const input = $(inputId)
      const value = input.value.trim()
      if (!value) return
      try {
        await queue(serverId, 'command', value)
        input.value = ''
        // echo into the open console right away; the host's own echo lands within a beat
        if ($('conLog') && conState.id === serverId) {
          conState.lines.push('> ' + value)
          conState.follow = true
          paintConsole()
        }
        refreshSoon()
      } catch (e) {
        toast(e.message ?? 'Command failed', true)
      }
    }
