    window.accessRevoke = async (shareId) => {
      // the name is looked up rather than passed in — an inline argument would
      // have to survive HTML-escaping, and account names are not player names
      const name = (window.__access?.people ?? []).find((p) => p.id === shareId)?.name ?? 'that person'
      if (!confirm(`Remove ${name}'s access to this server? They keep their account — they just lose this panel.`)) return
      try {
        renderAccess($('tabBody'), await request(sheetId, 'unshare', { shareId }))
        toast(`${name} no longer has access`)
      } catch (e) {
        toast(e.message, true)
      }
    }

    // ---------- desktop master-detail ----------
    const stClassOf = (row) => {
      const fresh = Date.now() - new Date(row.updated_at).getTime() < HEARTBEAT_MS * 4
      const state = fresh ? row.state : 'offline'
      return state === 'running' ? 'on' : (state === 'starting' || state === 'stopping') ? 'warm' : state === 'offline' ? 'dead' : ''
    }
    // performance reading from the published CPU load (the launcher also detects tick lag directly)
    const perfOf = (row) => {
      const fresh = Date.now() - new Date(row.updated_at).getTime() < HEARTBEAT_MS * 4
      if (!fresh || row.state !== 'running' || row.cpu_percent == null) return null
      if (row.cpu_percent >= 90) return ['poor', 'Struggling', 'var(--red)']
      if (row.cpu_percent >= 70) return ['fair', 'Busy', 'var(--amber)']
      return ['smooth', 'Smooth', 'var(--green)']
    }
    // ---------- one list, one detail pane, one render path ----------
    // The panel used to keep two complete UIs — mobile cards plus a bottom
    // sheet, desktop rail plus detail pane — that shared only runTab(). Both
    // breakpoints now paint the same DOM; CSS decides whether the rail and the
    // detail sit side by side or the detail slides in over the rail.

    /** view ids that are not servers */
    const SENTINELS = new Set(['store', 'health'])
    /** rail and detail are on screen together */
    const WIDE = () => matchMedia('(min-width:900px)').matches

    /**
     * Rows bucketed the way a host actually reads the list: the question on
     * open is "is anything broken", so unreachable hosts sort last and running
     * servers lead.
     */
    const RAIL_GROUPS = [
      ['running', 'Running'],
      ['transit', 'Starting'],
      ['stopped', 'Stopped'],
      ['archived', 'Archived'],
      ['dead', 'Host offline']
    ]
    function bucketOf(row) {
      const cls = stClassOf(row)
      if (cls === 'dead') return 'dead'
      if (row.state === 'archived') return 'archived'
      if (cls === 'on') return 'running'
      if (cls === 'warm') return 'transit'
      return 'stopped'
    }

    /** rail filter state (client-side only) */
    let railQuery = ''
    let railFilter = 'all'

    /**
     * Second line under the name. Enough to tell two servers with the same
     * name apart, which the old one-word state line could not.
     */
    function railSub(row, bucket) {
      const info = infoCache.get(row.server_id)
      const bits = []
      if (bucket === 'dead') {
        bits.push('PC offline')
        if (row.updated_at) bits.push('last seen ' + fmtUptime(Date.now() - new Date(row.updated_at).getTime()) + ' ago')
        return bits.join(' · ')
      }
      if (bucket === 'archived') return 'Archived · world kept'
      if (info) {
        bits.push(info.game === 'minecraft' ? [info.kind, info.minecraftVersion].filter(Boolean).join(' ') : gameLabel(info.game))
      }
      if (bucket === 'running') {
        bits.push((row.players?.length || 0) + ' online')
        if (row.started_at) bits.push(fmtUptime(Date.now() - new Date(row.started_at).getTime()))
      } else if (bucket === 'transit') {
        bits.push(row.state === 'starting' ? 'starting…' : 'stopping…')
      } else if (info) {
        bits.push('port ' + info.port)
      } else {
        bits.push('stopped')
      }
      return bits.filter(Boolean).join(' · ')
    }

    /** Quick actions live on the row so managing four servers isn't four drill-ins. */
    function railActions(row, bucket) {
      const id = row.server_id
      if (bucket === 'dead' || bucket === 'archived') return ''
      if (bucket === 'running') {
        return `<button class="icb no" title="Stop" onclick="event.stopPropagation();act('${id}','stop')">${icons.stop}</button>
                <button class="icb" title="Restart" onclick="event.stopPropagation();act('${id}','restart')">${icons.redo}</button>`
      }
      if (bucket === 'transit') {
        return row.state === 'stopping'
          ? `<button class="icb no" title="Force stop" onclick="event.stopPropagation();act('${id}','forceStop')">${icons.stop}</button>`
          : ''
      }
      return `<button class="icb go" title="Start" onclick="event.stopPropagation();act('${id}','start')">${icons.play}</button>`
    }

    function railRow(row, bucket) {
      const id = row.server_id
      const sub = railSub(row, bucket)
      return `<div class="srow ${sel === id ? 'sel' : ''} ${bucket === 'dead' ? 'stale' : ''}" onclick="selectView('${id}')"
                   role="button" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();selectView('${id}')}">
        <span class="tile" style="background:${gradOf(id)}">${esc((row.name || '?').charAt(0).toUpperCase())}<span class="st ${stClassOf(row)}"></span></span>
        <div class="srow-txt">
          <div class="nm">${esc(row.name || 'Server')}</div>
          <div class="sub">${esc(sub)}</div>
        </div>
        <div class="srow-acts">${railActions(row, bucket)}</div>
      </div>`
    }

    function renderList(rows) {
      const el = $('railList')
      if (!el) return
      $('storeBtn').classList.toggle('sel', sel === 'store')
      $('healthBtn')?.classList.toggle('sel', sel === 'health')

      const q = railQuery.trim().toLowerCase()
      const visible = rows.filter((r) => {
        if (q && !String(r.name || '').toLowerCase().includes(q)) return false
        if (railFilter === 'all') return true
        if (railFilter === 'running') return bucketOf(r) === 'running'
        if (railFilter === 'stopped') return bucketOf(r) === 'stopped'
        return (infoCache.get(r.server_id)?.game ?? 'minecraft') === railFilter
      })

      if (!rows.length) {
        el.innerHTML = `<div class="empty">
          <div class="halo"><img src="../icon.png" alt="" /></div>
          <b>No servers yet</b>
          Open ELauncher on your PC — its servers appear here automatically.
        </div>`
        return
      }
      if (!visible.length) {
        el.innerHTML = `<div class="loadrow">No servers match that filter.</div>`
        return
      }

      const groups = new Map(RAIL_GROUPS.map(([k]) => [k, []]))
      visible.forEach((r) => groups.get(bucketOf(r)).push(r))
      el.innerHTML = RAIL_GROUPS.map(([key, label]) => {
        const bucket = groups.get(key)
        if (!bucket.length) return ''
        const rowsHtml = bucket
          .sort((a, b) => String(a.name || '').localeCompare(String(b.name || '')))
          .map((r) => railRow(r, key))
          .join('')
        return `<div class="grp">${label}<span class="ct">${bucket.length}</span></div>${rowsHtml}`
      }).join('')
    }

    /** Which games are actually present, so the chips never offer an empty filter. */
    function renderChips(rows) {
      const el = $('railChips')
      if (!el) return
      const games = [...new Set(rows.map((r) => infoCache.get(r.server_id)?.game).filter(Boolean))]
      const chips = [['all', 'All'], ['running', 'Running'], ['stopped', 'Stopped'], ...games.map((g) => [g, gameLabel(g)])]
      el.innerHTML = chips
        .map(([key, label]) => `<button class="rchip ${railFilter === key ? 'on' : ''}" onclick="railSetFilter('${key}')">${esc(label)}</button>`)
        .join('')
    }
    window.railSetFilter = (key) => { railFilter = key; renderList([...rowsById.values()]); renderChips([...rowsById.values()]) }
    window.railSetQuery = (value) => { railQuery = value; renderList([...rowsById.values()]) }

    // ---------- routing ----------
    // #/s/<id>/<tab> | #/store | #/health. Gives the panel deep links, a working
    // back button, and restore-on-reload, none of which the old module-level
    // `sheetTab` could do.
    let suppressHash = false
    function writeHash() {
      if (!sel) return
      const next = SENTINELS.has(sel) ? `#/${sel}` : `#/s/${sel}/${sheetTab}`
      if (location.hash === next) return
      suppressHash = true
      history.pushState(null, '', next)
      suppressHash = false
    }
    function readHash() {
      const m = /^#\/s\/([^/]+)\/?([^/]*)$/.exec(location.hash)
      if (m) return { id: decodeURIComponent(m[1]), tab: m[2] || 'overview' }
      if (location.hash === '#/store') return { id: 'store' }
      if (location.hash === '#/health') return { id: 'health' }
      return null
    }
    addEventListener('popstate', () => {
      if (suppressHash) return
      const route = readHash()
      if (!route) { if (!WIDE()) closeDetail(); return }
      if (route.tab) sheetTab = route.tab
      selectView(route.id, { fromHash: true })
    })

    window.selectView = (id, opts = {}) => {
      if (Object.keys(dirty).length && !confirm('Discard unsaved changes?')) return
      sel = id
      dirty = {}
      if (!SENTINELS.has(id)) {
        // a new server resets the tab; re-selecting the same one keeps your place
        if (sheetId !== id) { sheetId = id; sheetInfo = null; resetFileState(); netDraft = []; if (!opts.fromHash) sheetTab = 'overview' }
      }
      document.body.classList.add('detail-open')
      if (!opts.fromHash) writeHash()
      renderList([...rowsById.values()])
      void renderDetail()
    }
    /** Mobile back: drop the detail overlay and return to the rail. */
    window.closeDetail = () => {
      if (Object.keys(dirty).length && !confirm('Discard unsaved changes?')) return
      dirty = {}
      document.body.classList.remove('detail-open')
      if (!WIDE()) { sel = null; sheetId = null; sheetInfo = null }
      renderList([...rowsById.values()])
    }
    window.goTab = (t) => {
      // the file editor holds unsaved work of its own, and leaving the tab drops it
      if ((Object.keys(dirty).length || fileView?.dirty) && !confirm('Discard unsaved changes?')) return
      sheetTab = t
      dirty = {}
      fileView = null
      clearPreview()
      writeHash()
      document.querySelectorAll('.dtabs button').forEach((b) => {
        const on = b.dataset.t === t
        b.classList.toggle('on', on)
        // the strip scrolls sideways with no visible scrollbar, so a tab near the
        // end can be active with nothing on screen saying so
        if (on) b.scrollIntoView({ block: 'nearest', inline: 'nearest' })
      })
      const body = $('tabBody')
      if (body) void runTab(body)
    }
    // the old names stayed reachable from markup rendered before this landed
    window.deskSelect = window.selectView
    window.deskTabGo = window.goTab
    window.sheetGo = window.goTab
    window.openSheet = window.selectView
    window.closeSheet = window.closeDetail

    function renderHero(row) {
      const fresh = Date.now() - new Date(row.updated_at).getTime() < HEARTBEAT_MS * 4
      const running = fresh && row.state === 'running'
      const archived = fresh && row.state === 'archived'
      const transit = fresh && (row.state === 'starting' || row.state === 'stopping')
      const id = row.server_id
      const power = archived
        ? (canManage(id)
          ? `<button class="dbtn start" onclick="restoreServer('${id}')">${icons.play} Restore</button>
             <button class="dbtn stop" onclick="deleteArchived('${id}')">Delete</button>`
          : '')
        : !fresh
          ? ''
          : running || transit
            ? `${row.state === 'stopping'
                 ? `<button class="dbtn stop" onclick="act('${id}','forceStop')">${icons.stop} Force stop</button>`
                 : `<button class="dbtn stop" onclick="act('${id}','stop')" ${transit ? 'disabled' : ''}>${icons.stop} Stop</button>`}
               <button class="dbtn" onclick="act('${id}','restart')" ${transit ? 'disabled' : ''}>${icons.redo} Restart</button>`
            : `<button class="dbtn start" onclick="act('${id}','start')">${icons.play} Start</button>`

      const stats = []
      stats.push(`<div class="dstat"><div class="v">${running ? (row.players?.length || 0) : '—'}</div><div class="l">Players</div></div>`)
      if (running && row.started_at) {
        stats.push(`<div class="dstat"><div class="v">${fmtUptime(Date.now() - new Date(row.started_at).getTime())}</div><div class="l">Uptime</div></div>`)
      }
      // A running server reads null only until its first sample lands, so name
      // that wait rather than showing a zero that reads like it uses nothing.
      if (running) {
        stats.push(row.memory_mb != null
          ? `<div class="dstat"><div class="v">${(row.memory_mb / 1024).toFixed(1)}<u>GB</u></div><div class="l">Memory</div></div>`
          : `<div class="dstat dead"><div class="v">—</div><div class="l">Memory</div><div class="why">Waiting for first sample</div></div>`)
        if (row.cpu_percent != null) {
          stats.push(`<div class="dstat"><div class="v">${row.cpu_percent}<u>%</u></div><div class="l">CPU</div></div>`)
        }
      }
      const perf = perfOf(row)
      if (perf) stats.push(`<div class="dstat"><div class="v" style="color:${perf[2]}">${perf[1]}</div><div class="l">Performance</div></div>`)

      const label = archived ? 'Archived' : !fresh ? 'PC offline' : running ? 'Online' : transit ? (row.state === 'starting' ? 'Starting…' : 'Stopping…') : 'Stopped'
      const chip = `<span class="chip ${stClassOf(row)}">${label}</span>${row.community ? '<span class="chip acc">Community</span>' : ''}`
      const addr = fresh && row.address
        ? `<button class="addr" onclick="copyAddr('${esc(row.address)}')">${icons.globe}<span class="a">${esc(row.address)}</span><span class="c">copy</span></button>`
        : ''
      return `<div class="dhero"><div class="dhero-row">
        <button class="backbtn" onclick="closeDetail()" aria-label="Back to servers">${icons.x}</button>
        <span class="tile" style="background:${gradOf(id)}">${esc((row.name || '?').charAt(0).toUpperCase())}</span>
        <div style="min-width:0"><div class="row" style="gap:10px;flex-wrap:wrap"><h2>${esc(row.name || 'Server')}</h2>${chip}</div>
          <div class="dhsub">${sheetInfo ? esc(gameLabel(sheetInfo.game) + (sheetInfo.game === 'minecraft' ? ' ' + sheetInfo.kind + ' ' + (sheetInfo.minecraftVersion || '') : '') + ' · port ' + sheetInfo.port) : ' '}</div></div>
        <div class="dhero-acts">${power}</div></div>
        ${addr}
        <div class="dstats">${stats.join('')}</div></div>`
    }

    function renderTabs() {
      const tabs = tabList()
      const label = tabLabels()
      const tico = tabIcons()
      return `<div class="dtabs">${tabs.map((t) => `<button data-t="${t}" class="${t === sheetTab ? 'on' : ''}" onclick="goTab('${t}')">${tico[t]}<span>${label[t]}</span></button>`).join('')}</div>`
    }

    /** Chrome for the two non-server views, so they read as part of the same pane. */
    function viewShell(title, subtitle, bodyHtml) {
      return `<div class="dhero"><div class="dhero-row">
          <button class="backbtn" onclick="closeDetail()" aria-label="Back to servers">${icons.x}</button>
          <div style="min-width:0"><h2>${esc(title)}</h2><div class="dhsub">${esc(subtitle)}</div></div>
        </div></div>
        <div class="dbody">${bodyHtml}</div>`
    }

    async function renderDetail() {
      const main = $('detail')
      if (!main) return
      if (sel === 'store') {
        // the host card is rendered inside the shop tab by loadHosting now, so
        // this no longer seeds it — calling loadHostCard here would find no target
        main.innerHTML = viewShell('Game servers', 'Rent one we run for you, or see what your own PC could handle', '<div id="vHosting"><div class="loadrow">Loading…</div></div>')
        void loadHosting()
        return
      }
      if (sel === 'health') {
        main.innerHTML = viewShell('Fleet health', 'Live vitals for every machine hosting a server', '<div id="vHealth"><div class="loadrow">Loading…</div></div>')
        void loadHealth()
        return
      }
      if (!sel) {
        main.innerHTML = `<div class="dwelcome"><div class="halo"><img src="../icon.png" alt=""></div><b>Pick a server</b>Choose one from the left to open its control panel.</div>`
        return
      }
      const row = rowsById.get(sel)
      if (!row) {
        main.innerHTML = `<div class="dwelcome"><b>That server is gone</b>It may have been deleted or unshared.</div>`
        return
      }
      const fresh = Date.now() - new Date(row.updated_at).getTime() < HEARTBEAT_MS * 4
      if (fresh && row.state === 'archived') {
        // no live server behind it — every control-panel tab would error
        main.innerHTML = renderHero(row) + `<div class="dbody"><div class="loadrow">This server is archived — its world and files are kept safe on the host. Restore it to manage it again.</div></div>`
        return
      }
      main.innerHTML = renderHero(row) + `<div class="dtabs"></div><div class="dbody" id="tabBody"><div class="loadrow">Loading control panel…</div></div>`
      try {
        if (sheetId !== sel || !sheetInfo) { sheetId = sel; sheetInfo = await loadInfo(sel) }
        // the tab set is per-game, so a hand-typed link (or a stale tab carried
        // over from another server) can name one this server doesn't have
        if (!tabList().includes(sheetTab)) { sheetTab = 'overview'; writeHash() }
        main.innerHTML = renderHero(row) + renderTabs() + '<div class="dbody" id="tabBody"></div>'
        // a deep link can land on a tab that sits past the end of the strip
        main.querySelector('.dtabs button.on')?.scrollIntoView({ block: 'nearest', inline: 'nearest' })
        await runTab($('tabBody'))
      } catch (e) {
        const body = main.querySelector('.dbody')
        if (body) body.innerHTML = `<div class="loadrow" style="color:var(--red)">${esc(e.message)}</div>`
      }
    }

    function applyRows(rows) {
      rowsById.clear()
      rows.forEach((r) => rowsById.set(r.server_id, r))

      // first paint: honour a deep link, else land somewhere sensible
      if (sel === null) {
        const route = readHash()
        if (route && (SENTINELS.has(route.id) || rowsById.has(route.id))) {
          if (route.tab) sheetTab = route.tab
          return selectView(route.id, { fromHash: true })
        }
        // wide screens always show something; narrow ones start on the list
        if (WIDE()) { sel = rows[0]?.server_id ?? 'store'; document.body.classList.add('detail-open') }
      }
      // the selected server vanished (deleted or unshared) — don't strand the pane.
      // reset the tab too: it belonged to the old server, and carrying e.g. 'mods'
      // onto a Palworld server lands on a tab that isn't in its tab list.
      if (sel && !SENTINELS.has(sel) && !rowsById.has(sel)) {
        sel = WIDE() ? (rows[0]?.server_id ?? 'store') : null
        if (!sel) document.body.classList.remove('detail-open')
        sheetId = sel && !SENTINELS.has(sel) ? sel : null
        sheetInfo = null
        sheetTab = 'overview'
      }
      renderChips(rows)
      renderList(rows)
      // vHosting, not vHost: the host card only exists on the shop tab now, and
      // testing for it would rebuild the whole pane on every poll of the others
      if (!$('tabBody') && !$('vHosting') && !$('vHealth')) void renderDetail()
      else liveUpdate()
    }

    /** Keep the hero and console fresh without clobbering edits in the active tab. */
    function liveUpdate() {
      if (sel === 'store') { void loadHosting(); return } // paints the host card itself
      if (sel === 'health') { void loadHealth(); return }
      if (!sel) return
      const row = rowsById.get(sel)
      if (!row) return
      const hero = $('detail')?.querySelector('.dhero')
      if (hero) hero.outerHTML = renderHero(row)
      // the console keeps its own buffer (the beat only carries a tail), so fold
      // the new tail in and repaint rather than replacing the element's text
      if (sheetTab === 'console' && $('conLog') && conState.id === sel) {
        conMergeTail(row.console || '')
        paintConsole()
      }
      // the overview's preview is a plain tail — cheap to redraw in place
      if (sheetTab === 'overview') {
        const prev = $('detail')?.querySelector('.ov-console')
        if (prev) {
          const stick = prev.scrollHeight - prev.scrollTop - prev.clientHeight < 40
          prev.innerHTML = consolePreview(row.console, 8)
          if (stick) prev.scrollTop = prev.scrollHeight
        }
      }
    }

    // widening/narrowing changes what "selected" means, so repaint the shell
    matchMedia('(min-width:900px)').addEventListener('change', () => {
      if (!me) return
      if (WIDE() && !sel) { sel = [...rowsById.keys()][0] ?? 'store'; document.body.classList.add('detail-open') }
      renderList([...rowsById.values()])
      void renderDetail()
    })

    // design/debug hooks: paint the UI with no auth and no cloud
    window.__renderPreview = (rows) => {
      $('login').hidden = true
      $('topbar').hidden = false
      $('app').hidden = false
      applyRows(rows)
    }
    window.__previewHosting = (html) => {
      window.__renderPreview([])
      selectView('store')
      $('vHosting').innerHTML = html
    }
    window.__previewSettings = (game, kind, props) => {
      $('login').hidden = true; $('topbar').hidden = false; $('app').hidden = false
      sheetInfo = { game, kind, minecraftVersion: '1.21.1', port: 25565, automation: {} }
      renderSettings($('detail'), props)
    }
    window.__previewSheet = (row, info) => {
      ownerOf.set(row.server_id, me) // previews act as the owner so owner-only controls render
      infoCache.set(row.server_id, info)
      window.__renderPreview([row])
      sheetInfo = info
      selectView(row.server_id)
    }
    /** File explorer, without a host: seeds a folder listing and paints it. */
    window.__previewFiles = (entries, opts = {}) => {
      $('login').hidden = true; $('topbar').hidden = false; $('app').hidden = false
      sheetId = opts.serverId ?? 'preview'
      sheetTab = 'files'
      rowsById.set(sheetId, { server_id: sheetId, name: opts.name ?? 'Survival SMP' })
      filesRel = opts.path ?? ''
      fileView = null
      clearPreview()
      fileQuery = ''
      fileSel = new Set(opts.selected ?? [])
      fileEntries = entries
      transfers = opts.transfers ?? []
      // mirror the real detail pane, so the repaint helpers find #tabBody the way they would in the app
      const host = $(opts.into ?? 'detail')
      host.innerHTML = '<div class="dbody" id="tabBody"></div>'
      paintFiles($('tabBody'))
    }
    /** Order sheet, without a cloud: seeds the plan cache the way loadHosting would. */
    window.__previewOrder = (plan) => {
      window.__renderPreview([])
      plansCache.set(plan.id, plan)
      return window.orderPlan(plan.id)
    }
    /** The store's plan grid, without a cloud. opts: { shopOpen, isAdmin, hasOrders }. */
    window.__previewStore = (plans, opts = {}) => {
      window.__renderPreview([])
      selectView('store')
      plans.forEach((p) => plansCache.set(p.id, p))
      const el = $('vHosting')
      if (el) el.innerHTML = storeHtml(plans, opts.shopOpen !== false, Boolean(opts.isAdmin), Boolean(opts.hasOrders))
    }

    async function refresh() {
      if (!me || document.hidden) return
      try {
        const rows = await fetchServers()
        applyRows(rows)
      } catch (e) {
        const target = $('railList')
        if (target) target.innerHTML = `<div class="empty"><b>Could not reach the cloud</b>${esc(e.message)}</div>`
      }
    }

    // ---------- realtime: the cloud pushes changes; polling stays as the safety net ----------
    let rtLive = false
    let paintQueued = false
    function schedulePaint() {
      if (paintQueued) return
      paintQueued = true
      setTimeout(() => {
        paintQueued = false
        if (document.hidden) return
        applyRows([...rowsById.values()].sort((a, b) => (a.name || '').localeCompare(b.name || '')))
      }, 120)
    }
    function mergeStatus(row) {
      if (!row?.server_id) return
      const old = rowsById.get(row.server_id)
      if (!old) return void refresh() // brand-new server — a full fetch fills in owner names
      rowsById.set(row.server_id, { ...old, ...row })
      schedulePaint()
    }
    let hostingTimer = null
    function scheduleHosting() {
      clearTimeout(hostingTimer)
      hostingTimer = setTimeout(() => void loadHosting(), 250)
    }
    function startRealtime() {
      try {
        supabase
          .channel('panel-live')
          .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'server_status' }, (p) => mergeStatus(p.new))
          .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'server_status' }, (p) => mergeStatus(p.new))
          .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'server_requests', filter: `requester_id=eq.${me}` }, (p) => settleRequest(p.new))
          .on('postgres_changes', { event: '*', schema: 'public', table: 'hosting_orders' }, scheduleHosting)
          .subscribe((status) => {
            rtLive = status === 'SUBSCRIBED'
            // the top-bar pill tells the truth: pushed updates vs. polling
            $('livePill')?.classList.toggle('poll', !rtLive)
            const t = $('liveTxt')
            if (t) t.textContent = rtLive ? 'live' : 'sync'
          })
      } catch {
        // realtime not enabled on this cloud — the polls above keep everything working
      }
    }

    /** "PC as a host" card — the launcher publishes its specs + per-game report. */
    async function loadHostCard(target = 'vHost') {
      try {
        const { data } = await supabase.from('host_specs').select('report').eq('owner_id', me).maybeSingle()
        const report = data?.report
        if (!report?.specs) return
        const verdictChip = { great: ['on', 'Great'], good: ['acc', 'Good'], tight: ['warm', 'Tight'], no: ['dead', 'Not recommended'] }
        const rows = (report.games ?? []).map((g) => {
          const [cls, label] = verdictChip[g.verdict] ?? ['', g.verdict]
          return `<div class="row" style="gap:8px;padding:7px 0;border-top:1px solid var(--line)">
            <div style="flex:1;min-width:0">
              <div style="font-weight:650;font-size:13.5px">${esc(g.game)}</div>
              ${g.verdict !== 'no' ? `<div class="faint" style="font-size:12px">${esc(g.players)} players</div>` : ''}
            </div>
            <span class="chip ${cls}">${esc(label)}</span>
          </div>`
        }).join('')
        const hostEl = $(target); if (!hostEl) return
        const html = `<div class="card">
          <div class="row" style="gap:8px">
            <b style="font-size:14.5px;flex:1">Home PC as a host</b>
            <span class="pill">${esc(report.specs.cpuModel)} · ${esc(String(report.specs.ramGB))} GB · ${esc(report.specs.diskType)}</span>
          </div>
          ${rows}
        </div>`
        if (hostEl.__lastHtml !== html) { hostEl.__lastHtml = html; hostEl.innerHTML = html }
      } catch {
        // card is optional — table may not be migrated yet
      }
    }

    // ---------- admin: fleet health ----------
    /** vitals are published every 15s — three missed beats and the box is offline */
    const HOST_STALE_MS = 45_000
    const fmtGB = (mb) => (mb == null ? '—' : mb >= 1024 ? `${(mb / 1024).toFixed(1)} GB` : `${mb} MB`)
    /** colour band for a 0-100 utilisation reading; null reads as "unknown", not "fine" */
    const bandOf = (pct) => (pct == null ? 'none' : pct >= 90 ? 'dead' : pct >= 75 ? 'warm' : '')

    function applyAdminUi() {
      const btn = $('healthBtn')
      if (!btn || btn.hidden === !isAdmin) return
      btn.hidden = !isAdmin
      btn.innerHTML = `${icons.zap} Fleet health`
    }

    function meter(label, pct, detail) {
      const width = pct == null ? 0 : Math.max(2, Math.min(100, pct))
      return `<div class="meter ${bandOf(pct)}">
        <div class="mrow"><b>${esc(label)}</b><span>${esc(detail)}</span></div>
        <div class="track"><div class="fill" style="width:${width}%"></div></div>
      </div>`
    }

    /**
     * Admin-only fleet overview: one card per machine publishing vitals, a
     * roll-up across all of them, and anything that looks wrong. Read-only by
     * design — the controls for a server still live on that server's own page.
     */
    async function loadHealth(target = 'vHealth') {
      const el = $(target)
      if (!el) return
      if (!isAdmin) { el.__lastHtml = ''; el.innerHTML = ''; return }
      const heading = ''
      const paint = (html) => { if (el.__lastHtml !== html) { el.__lastHtml = html; el.innerHTML = html } }
      // design/debug hook (same family as __mockRelay): renders offline, no cloud
      if (window.__mockHealth) {
        const m = window.__mockHealth
        paint(heading + healthHtml(m.hosts, m.servers, m.names))
        return
      }
      try {
        const [hostsRes, statusRes] = await Promise.all([
          supabase.from('host_health').select('*'),
          supabase.from('server_status').select('server_id, state, updated_at')
        ])
        if (hostsRes.error) throw new Error(hostsRes.error.message)
        const hosts = (hostsRes.data ?? []).slice().sort((a, b) => (a.host_name || '').localeCompare(b.host_name || ''))
        if (!hosts.length) {
          paint(heading + '<div class="loadrow">No host is reporting yet. Run the latest <b>schema.sql</b> in Supabase, then make sure a hosting launcher is signed in and online.</div>')
          return
        }
        const servers = statusRes.data ?? []
        // owner names come from a second query — the panel never uses embedded resources
        const ownerIds = [...new Set(hosts.map((h) => h.owner_id))]
        const profs = (await supabase.from('profiles').select('id, username').in('id', ownerIds)).data ?? []
        paint(heading + healthHtml(hosts, servers, new Map(profs.map((p) => [p.id, p.username]))))
      } catch (e) {
        // a missing table just means the migration hasn't been run — say what to
        // do about it rather than surfacing PostgREST's schema-cache wording
        const missing = /schema cache|does not exist|42P01|PGRST205/i.test(e.message)
        paint(heading + (missing
          ? '<div class="loadrow">Fleet health needs one migration: open Supabase → SQL Editor and run the latest <b>schema.sql</b> once.</div>'
          : `<div class="loadrow" style="color:var(--red)">${esc(e.message)}</div>`))
      }
    }

    /** Pure render half of the Health view — kept separate so previews can drive it offline. */
    function healthHtml(hosts, servers, names) {
      const now = Date.now()
      const alerts = []
      let online = 0
      let players = 0
      const cards = hosts.map((h) => {
        const age = now - new Date(h.updated_at).getTime()
        const stale = age > HOST_STALE_MS
        const who = names.get(h.owner_id) || 'Unknown account'
        const label = h.host_name || who
        const ramPct = h.ram_total_mb ? Math.round((h.ram_used_mb / h.ram_total_mb) * 100) : null
        const diskPct = h.disk_total_gb ? Math.round(((h.disk_total_gb - h.disk_free_gb) / h.disk_total_gb) * 100) : null
        if (stale) {
          alerts.push(['bad', label, `No vitals for ${fmtUptime(age)} — the hosting launcher looks closed`])
        } else {
          online += 1
          players += h.players_online || 0
          // disk is the one that takes a host down for good, so it leads
          if (h.disk_free_gb != null && h.disk_free_gb < 5) alerts.push(['bad', label, `Only ${h.disk_free_gb} GB of disk left`])
          else if (diskPct != null && diskPct >= 90) alerts.push(['', label, `Disk ${diskPct}% full`])
          if (ramPct != null && ramPct >= 92) alerts.push(['', label, `Memory ${ramPct}% used`])
          if (h.cpu_percent != null && h.cpu_percent >= 92) alerts.push(['', label, `CPU pinned at ${h.cpu_percent}%`])
        }
        return `<div class="card ${stale ? 'offline' : ''}">
          <div class="head">
            <span class="tile" style="background:${gradOf(h.owner_id)}">${esc(label.charAt(0).toUpperCase())}</span>
            <div class="who"><div class="nm">${esc(label)}</div><div class="ln">${esc(who)}${h.platform ? ' · ' + esc(h.platform) : ''}${h.headless ? ' · headless' : ''}</div></div>
            <span class="chip ${stale ? 'dead' : 'on'}">${stale ? 'Offline' : 'Online'}</span>
          </div>
          ${meter('CPU', h.cpu_percent, h.cpu_percent == null ? 'not readable' : `${h.cpu_percent}%${h.load1 != null ? ` · load ${h.load1}` : ''}`)}
          ${meter('Memory', ramPct, h.ram_total_mb ? `${fmtGB(h.ram_used_mb)} of ${fmtGB(h.ram_total_mb)}` : 'not readable')}
          ${meter('Disk', diskPct, h.disk_total_gb ? `${h.disk_free_gb} GB free of ${h.disk_total_gb} GB` : 'not readable')}
          <div class="hstats">
            <div class="hstat"><div class="v">${h.servers_running}/${h.servers_total}</div><div class="l">Servers up</div></div>
            <div class="hstat"><div class="v">${stale ? '—' : h.players_online}</div><div class="l">Players</div></div>
            <div class="hstat"><div class="v">${h.uptime_seconds ? fmtUptime(h.uptime_seconds * 1000) : '—'}</div><div class="l">Host uptime</div></div>
            <div class="hstat"><div class="v">${h.cpu_threads || '—'}</div><div class="l">Threads</div></div>
          </div>
          <div class="pills">
            <span class="pill">${esc(h.cpu_model || 'Unknown CPU')}</span>
            <span class="pill">ELauncher <b>${esc(h.app_version || '?')}</b></span>
          </div>
        </div>`
      })

      // critical first — an offline host or a full disk outranks a busy CPU
      alerts.sort((a, b) => (b[0] === 'bad') - (a[0] === 'bad'))
      const fresh = (s) => now - new Date(s.updated_at).getTime() < HEARTBEAT_MS * 4
      const running = servers.filter((s) => s.state === 'running' && fresh(s)).length
      const worst = alerts.some((a) => a[0] === 'bad') ? 'dead' : alerts.length ? 'warm' : 'on'
      const summary = `<div class="card">
        <div class="row" style="gap:8px">
          <b style="font-size:14.5px;flex:1">Fleet at a glance</b>
          <span class="chip ${worst}">${alerts.length ? alerts.length + ' to check' : 'All good'}</span>
        </div>
        <div class="hstats">
          <div class="hstat"><div class="v">${online}/${hosts.length}</div><div class="l">Hosts online</div></div>
          <div class="hstat"><div class="v">${running}</div><div class="l">Servers running</div></div>
          <div class="hstat"><div class="v">${servers.length}</div><div class="l">Servers total</div></div>
          <div class="hstat"><div class="v">${players}</div><div class="l">Players online</div></div>
        </div>
        ${alerts.map((a) => `<div class="alertrow ${a[0]}"><span class="dot"></span><div class="who"><b>${esc(a[1])}</b><i>${esc(a[2])}</i></div></div>`).join('')}
      </div>`
      return summary + cards.join('')
    }

    // design/debug: drive the real Health view (nav included) from mock rows
    window.__previewHealth = (hosts, servers = []) => {
      isAdmin = true
      window.__mockHealth = { hosts, servers, names: new Map(hosts.map((h) => [h.owner_id, h.owner_name || 'someone'])) }
      $('login').hidden = true; $('topbar').hidden = false
      applyAdminUi()
      $('app').hidden = false
      selectView('health')
    }

    // ---------- hosting: plans, orders, admin approval ----------
    let isAdmin = false
    const plansCache = new Map()
    const REF = () => 'ELH-' + Math.random().toString(36).slice(2, 7).toUpperCase()
    const money = (n, c) => `${c === 'USD' ? '$' : ''}${Number(n).toFixed(2)}${c === 'USD' ? '' : ' ' + c}`
    const STATUS_LABEL = {
      awaiting_payment: ['warm', 'Awaiting payment'], pending_review: ['warm', 'Payment under review'],
      active: ['on', 'Active'], past_due: ['dead', 'Past due'], rejected: ['dead', 'Rejected'], cancelled: ['', 'Cancelled']
    }

    // ---- ordering with configuration (loader / version / modpack) ----
    let mcVersions = null
    async function loadMcVersions() {
      if (mcVersions) return mcVersions
      try {
        const r = await fetch('https://piston-meta.mojang.com/mc/game/version_manifest_v2.json')
        const j = await r.json()
        mcVersions = j.versions.filter((v) => v.type === 'release').map((v) => v.id).slice(0, 40)
      } catch { mcVersions = ['1.21.4', '1.21.1', '1.20.1'] }
      return mcVersions
    }
    async function modrinthSearch(query, type, mcVer, loader) {
      const facets = [[`project_type:${type}`]]
      if (mcVer) facets.push([`versions:${mcVer}`])
      if (loader && type === 'mod') facets.push([`categories:${loader}`])
      // paper runs the whole Bukkit plugin family — match any of them
      if (type === 'plugin') facets.push(['categories:paper', 'categories:spigot', 'categories:bukkit', 'categories:purpur'])
      const url = `https://api.modrinth.com/v2/search?limit=12&index=relevance&query=${encodeURIComponent(query || '')}&facets=${encodeURIComponent(JSON.stringify(facets))}`
      const r = await fetch(url)
      return (await r.json()).hits || []
    }

    /**
     * One-click packs, shown above the search so ordering a themed server does
     * not depend on knowing what to type. Ids are Modrinth *modpack* projects —
     * the order flow resolves a .mrpack from the id, so a mod id will not work.
     *
     * Loader and version are shown, not chosen: an .mrpack declares its own, and
     * these are recorded so the copy can't drift from what actually installs.
     * Cobblemon has no Forge build on 1.21.1, which is exactly the sort of thing
     * a customer picking a loader by hand gets wrong.
     */
    const FEATURED_PACKS = [
      { id: '5FFgwNNP', name: 'Cobblemon', tag: 'Pokémon', loader: 'Fabric', mc: '1.21.1',
        blurb: 'Catch, train and battle Pokémon. The official pack from the Cobblemon team.' },
      { id: 'mHMxXbIu', name: 'Cobblemon · NeoForge', tag: 'Pokémon', loader: 'NeoForge', mc: '1.21.1',
        blurb: 'The same official pack, built on NeoForge instead of Fabric.' },
      { id: 'Jkb29YJU', name: 'COBBLEVERSE', tag: 'Pokémon', loader: 'Fabric', mc: '1.21.1',
        blurb: 'All 1025 Pokémon, 32 gyms and four regions — an adventure rather than a sandbox.' }
    ]

    let order = null
    window.orderPlan = async (planId) => {
      const plan = plansCache.get(planId)
      if (!plan) return
      order = { plan, name: '', mode: 'fresh', loader: 'paper', version: '', versions: [], modpack: null, modpackName: '', modpackSource: 'modrinth' }
      renderOrder()
      if (plan.game === 'minecraft') {
        order.versions = await loadMcVersions()
        order.version = order.versions[0] || ''
        renderOrder()
      }
    }
    window.closeOrder = () => { order = null; $('sheet').innerHTML = '' }
    window.setOrder = (k, v) => { order[k] = v; if (k === 'mode' || k === 'loader') renderOrder() }
    // switching platform clears the pick — a Modrinth id means nothing to CurseForge
    window.setPackSource = (s) => { order.modpackSource = s; order.modpack = null; order.modpackName = ''; renderOrder() }
    window.pickPack = (id, name) => { order.modpack = id; order.modpackName = name; renderOrder() }

    /** One search-result row, shared by both platforms. */
    function packRow(id, name, icon, downloads) {
      return `<button class="prow" style="width:100%;text-align:left;border:0;background:none" onclick="pickPack('${id}','${esc(name).replace(/'/g, '')}')">
        ${icon ? `<img src="${esc(icon)}" style="width:34px;height:34px;border-radius:8px">` : '<span class="p-tile" style="width:34px;height:34px">?</span>'}
        <div style="flex:1;min-width:0"><div class="pn">${esc(name)}</div><div class="pm">${(downloads || 0).toLocaleString()} downloads</div></div>
        ${order.modpack === id ? '<span class="chip on">✓</span>' : ''}</button>`
    }

    /**
     * CurseForge modpack search, via our cf-proxy edge function so the customer
     * needs no key — the shared key is injected server-side. Requires a signed-in
     * session (the function rejects the bare anon key).
     */
    async function cfSearch(query) {
      const { data: { session } } = await supabase.auth.getSession()
      if (!session) throw new Error('sign in first')
      const url = `${SUPABASE_URL}/functions/v1/cf-proxy/mods/search?gameId=432&classId=4471&sortField=2&sortOrder=desc&pageSize=12&searchFilter=${encodeURIComponent(query || '')}`
      const r = await fetch(url, { headers: { Authorization: `Bearer ${session.access_token}`, apikey: SUPABASE_ANON_KEY } })
      if (!r.ok) throw new Error('search failed')
      return (await r.json()).data || []
    }

    window.orderSearchPack = async (q) => {
      const box = $('packResults'); if (box) box.innerHTML = '<div class="loadrow">Searching…</div>'
      try {
        const rows = order.modpackSource === 'curseforge'
          ? (await cfSearch(q)).map((h) => packRow(String(h.id), h.name, h.logo && h.logo.thumbnailUrl, h.downloadCount))
          : (await modrinthSearch(q, 'modpack')).map((h) => packRow(h.project_id, h.title, h.icon_url, h.downloads))
        if (box) box.innerHTML = rows.join('') || '<div class="loadrow">No modpacks found.</div>'
      } catch { if (box) box.innerHTML = '<div class="loadrow" style="color:var(--red)">Search failed.</div>' }
    }

    function renderOrder() {
      const o = order, plan = o.plan, mc = plan.game === 'minecraft'
      const money2 = money(plan.price_monthly, plan.currency)
      let cfg = ''
      if (mc) {
        cfg = `<div class="sheet-tabs" style="border:0;padding:0 0 12px">
            <button class="${o.mode === 'fresh' ? 'on' : ''}" onclick="setOrder('mode','fresh')">Fresh server</button>
            <button class="${o.mode === 'modpack' ? 'on' : ''}" onclick="setOrder('mode','modpack')">From a modpack</button>
          </div>`
        if (o.mode === 'fresh') {
          cfg += `<div class="grid2">
            <div class="frow"><label>Loader</label><select onchange="setOrder('loader',this.value)">
              ${['paper', 'vanilla', 'fabric', 'neoforge', 'forge'].map((k) => `<option value="${k}" ${o.loader === k ? 'selected' : ''}>${k[0].toUpperCase() + k.slice(1)}</option>`).join('')}
            </select></div>
            <div class="frow"><label>Version</label><select onchange="setOrder('version',this.value)">
              ${o.versions.map((v) => `<option ${o.version === v ? 'selected' : ''}>${v}</option>`).join('')}
            </select></div></div>
            <div class="frow"><div class="hint2">${o.loader === 'paper' ? 'Paper: fast, plugins.' : o.loader === 'vanilla' ? 'Vanilla: the official server.' : 'You can add mods after it is set up, from the Mods tab.'}</div></div>`
        } else {
          const cf = o.modpackSource === 'curseforge'
          cfg += `<div class="sheet-tabs" style="border:0;padding:0 0 10px">
              <button class="${!cf ? 'on' : ''}" onclick="setPackSource('modrinth')">Modrinth</button>
              <button class="${cf ? 'on' : ''}" onclick="setPackSource('curseforge')">CurseForge</button>
            </div>`
          if (!cf) {
            // featured packs are curated Modrinth ids; CurseForge is search-only
            const featured = FEATURED_PACKS.map((p) => `
              <button class="prow" style="width:100%;text-align:left;border:0;background:none" onclick="pickPack('${p.id}','${esc(p.name).replace(/'/g, '')}')">
                <span class="tile" style="background:${gradOf(p.id)};width:34px;height:34px;border-radius:8px;font-size:14px">${esc(p.name.charAt(0))}</span>
                <div style="flex:1;min-width:0"><div class="pn">${esc(p.name)}</div><div class="pm">${esc(p.blurb)}</div></div>
                ${o.modpack === p.id ? '<span class="chip on">✓</span>' : `<span class="chip">${esc(p.loader)} ${esc(p.mc)}</span>`}
              </button>`).join('')
            cfg += `<div class="grouphead" style="margin-top:0">Popular packs</div>
              <div class="plister">${featured}</div>
              <div class="grouphead">Or search Modrinth</div>`
          } else {
            cfg += `<div class="grouphead" style="margin-top:0">Search CurseForge</div>`
          }
          cfg += `<div class="searchbar">${icons.chipIc}<input placeholder="Search ${cf ? 'CurseForge' : 'Modrinth'} modpacks…" oninput="orderSearchPack(this.value)"></div>
            <div id="packResults" class="plister">${o.modpack ? `<div class="hintline">Selected: <b>${esc(o.modpackName)}</b></div>` : `<div class="loadrow">Type to search${cf ? '.' : ', or pick one above.'}</div>`}</div>`
        }
      }
      $('sheet').innerHTML = `<div class="sheet-bg" onclick="closeOrder()"></div>
        <div class="sheet"><div class="sheet-grip"></div>
          <div class="sheet-top"><div class="tile" style="background:${gradOf(plan.id)};width:38px;height:38px;border-radius:11px;font-size:15px">${gameLabel(plan.game).charAt(0)}</div>
            <div style="flex:1"><div class="nm">${esc(plan.name)}</div><div class="sub">${gameLabel(plan.game)} · ${plan.max_players} players · ${plan.memory_mb / 1024} GB · ${money2}/mo</div></div>
            <button class="iconbtn" onclick="closeOrder()">${icons.x}</button></div>
          <div class="sheet-body">
            <div class="frow"><label>Server name</label><input value="${esc(o.name)}" oninput="setOrder('name',this.value)" placeholder="My Server"></div>
            ${cfg}
            <div class="savebar"><button class="cta" onclick="submitOrder()">Create order · ${money2}/mo</button></div>
          </div></div>`
    }
    window.submitOrder = async () => {
      const o = order, name = o.name.trim()
      if (!name) return toast('Name your server first', true)
      const config = {}
      if (o.plan.game === 'minecraft') {
        if (o.mode === 'modpack') {
          if (!o.modpack) return toast('Pick a modpack, or choose Fresh server', true)
          config.modpack = o.modpack
          if (o.modpackSource === 'curseforge') config.modpackSource = 'curseforge'
        } else { config.loader = o.loader; config.version = o.version }
      }
      const base = { user_id: me, plan_id: o.plan.id, server_name: name, reference: REF() }
      let { error } = await supabase.from('hosting_orders').insert({ ...base, config })
      // older clouds without the config column: fall back so ordering still works
      if (error && /config|column|schema cache/i.test(error.message || '')) {
        ;({ error } = await supabase.from('hosting_orders').insert(base))
      }
      if (error) return toast(error.message, true)
      closeOrder(); toast('Order created — follow the payment steps'); void loadHosting()
    }
    window.markPaid = async (orderId) => {
      const { error } = await supabase.rpc('hosting_mark', { order_id: orderId, new_status: 'pending_review' })
      if (error) return toast(error.message, true)
      toast('Thanks — your payment is under review')
      void loadHosting()
    }
    window.cancelOrder = async (orderId) => {
      if (!confirm('Cancel this order?')) return
      await supabase.rpc('hosting_mark', { order_id: orderId, new_status: 'cancelled' })
      void loadHosting()
    }
    window.adminApprove = async (orderId) => {
      const days = parseInt(prompt('Approve for how many days?', '30') || '', 10)
      if (!days || days < 1) return
      const until = new Date(Date.now() + days * 86400000).toISOString()
      const { error } = await supabase.from('hosting_orders').update({ status: 'active', paid_until: until }).eq('id', orderId)
      if (error) return toast(error.message, true)
      toast('Approved — your launcher will provision it within a minute')
      void loadHosting()
    }
    window.adminReject = async (orderId) => {
      if (!confirm('Reject this order?')) return
      await supabase.from('hosting_orders').update({ status: 'rejected' }).eq('id', orderId)
      void loadHosting()
    }
    window.adminShop = async (open) => {
      const { error } = await supabase.from('hosting_settings').update({ shop_open: open }).eq('id', 1)
      if (error) return toast(error.message, true)
      toast(open ? 'Shop opened — plans are orderable again' : 'Shop closed — customers no longer see ordering')
      void loadHosting()
    }
    window.adminTogglePlan = async (planId, active) => {
      const { error } = await supabase.from('hosting_plans').update({ active }).eq('id', planId)
      if (error) return toast(error.message, true)
      toast(active ? 'Plan listed in the shop' : 'Plan hidden from the shop')
      void loadHosting()
    }

    function payBlock(order, plan, settings) {
      if (!plan) return ''
      const memo = encodeURIComponent(order.reference)
      const pp = settings.paypal_me
        ? `https://paypal.me/${settings.paypal_me}/${plan.price_monthly}`
        : ''
      const links = []
      if (pp) links.push(`<a class="btn start" style="text-decoration:none" href="${pp}" target="_blank" rel="noreferrer">Pay ${money(plan.price_monthly, plan.currency)} with PayPal</a>`)
      if (plan.stripe_link) links.push(`<a class="btn" style="text-decoration:none" href="${esc(plan.stripe_link)}" target="_blank" rel="noreferrer">Pay by card</a>`)
      if (!links.length) return `<div class="hintline">Payment isn't set up yet — contact the host.</div>`
      return `<div class="hintline">Send exactly <b>${money(plan.price_monthly, plan.currency)}</b> and put your reference <b>${esc(order.reference)}</b> in the payment note.</div>
        <div class="acts">${links.join('')}</div>
        <div class="acts single"><button class="btn" onclick="markPaid('${order.id}')">I've paid — submit for review</button></div>`
    }

    /** One purchasable plan. cpu_cores is in the schema but was never shown before. */
    function planCard(p) {
      const gb = +(p.memory_mb / 1024).toFixed(1)
      const cores = p.cpu_cores ? `${p.cpu_cores} CPU core${p.cpu_cores === 1 ? '' : 's'}` : 'Shared CPU'
      return `<button class="plan" onclick="orderPlan('${p.id}')">
        <div>
          <div class="plan-name">${esc(p.name)}</div>
          <div class="plan-price"><b>${money(p.price_monthly, p.currency)}</b><span>/mo</span></div>
        </div>
        <div class="plan-specs">
          <div>${icons.users}Up to ${p.max_players} players</div>
          <div>${icons.chipIc}${gb} GB RAM</div>
          <div>${icons.zap}${cores}</div>
        </div>
        <span class="plan-cta">Choose plan</span>
      </button>`
    }

    /**
     * The customer-facing store: plans grouped by game. Split out of loadHosting
     * so every state (open, closed, empty) can be rendered without a cloud —
     * see __previewStore.
     */
    function storeHtml(planList, shopOpen, isAdmin, hasOrders) {
      const head = `<div class="home-head">${hasOrders ? 'Add another server' : 'Get a game server'}</div>`
      // an admin with the shop closed still gets the plan editor further down
      if (!shopOpen) return isAdmin ? '' : head + `<div class="card"><div class="store-closed">The shop is closed right now — check back soon.</div></div>`
      if (!planList.length) return isAdmin ? '' : head + `<div class="card"><div class="store-closed">No plans are available right now.</div></div>`
      // group by game, preserving the admin-defined sort order within each group
      const byGame = new Map()
      for (const p of planList) {
        if (!byGame.has(p.game)) byGame.set(p.game, [])
        byGame.get(p.game).push(p)
      }
      return head + [...byGame].map(([game, plans]) => `
        <div class="sg">
          <div class="sg-head">
            <span class="sg-tile" style="background:${gradOf(game)}">${esc(gameLabel(game).charAt(0))}</span>
            <div><div class="sg-name">${esc(gameLabel(game))}</div>
              <div class="sg-sub">${esc(GAME_BLURB[game] || '')}</div></div>
          </div>
          <div class="plan-grid">${plans.map(planCard).join('')}</div>
        </div>`).join('')
    }

    /** The customer's own orders: status, what to pay, and how it's going. */
    function ordersHtml(liveOrders, planMap, cfg) {
      if (!liveOrders.length) {
        return `<div class="card"><div class="store-closed">Nothing rented yet. Anything you order shows up here with its status and payment steps.</div></div>`
      }
      return liveOrders.map((o) => {
        const plan = planMap.get(o.plan_id)
        const settingUp = o.status === 'active' && !o.server_id
        const [cls, label] = settingUp ? ['warm', 'Setting up…'] : (STATUS_LABEL[o.status] ?? ['', o.status])
        const until = o.paid_until ? ` · renews ${new Date(o.paid_until).toLocaleDateString()}` : ''
        const pay = (o.status === 'awaiting_payment' || o.status === 'past_due') ? payBlock(o, plan, cfg) : ''
        const cancel = (o.status === 'awaiting_payment' || o.status === 'pending_review') ? `<button class="conbtn" onclick="cancelOrder('${o.id}')">Cancel order</button>` : ''
        const failed = /failed/i.test(o.note || '')
        const noteHtml = o.note ? `<div class="hintline"${failed ? ' style="color:var(--red)"' : ''}>${settingUp && !failed ? '⏳ ' : ''}${esc(o.note)}</div>` : ''
        const readyHint = o.status === 'active' && o.server_id ? `<div class="hintline">✓ Your server is live — manage it in the list on the left.</div>` : ''
        return `<div class="card">
          <div class="head"><div class="who"><div class="nm">${esc(o.server_name)}</div><div class="ln">${plan ? esc(plan.name) : o.plan_id}${until}</div></div><span class="chip ${cls}">${label}</span></div>
          ${noteHtml}${readyHint}${pay}${cancel}
        </div>`
      }).join('')
    }

    /** Shop switch, per-plan listing, and the order queue — owner/admin only. */
    function adminHtml(allPlans, shopOpen, cfg, allOrders, planMap) {
      let html = `<div class="home-head" style="margin-top:0">Shop</div>
        <div class="card">
          <div class="head">
            <div class="who"><div class="nm">${shopOpen ? 'Open' : 'Closed'}</div><div class="ln">${shopOpen ? 'Customers can order new servers' : 'Ordering is hidden for customers'}</div></div>
            <button class="minibtn ${shopOpen ? 'red' : 'acc'}" onclick="adminShop(${shopOpen ? 'false' : 'true'})">${shopOpen ? 'Close shop' : 'Open shop'}</button>
          </div>
          ${allPlans.map((p) => `<div class="head" style="padding:8px 0;border-top:1px solid var(--line)">
            <div class="who"><div class="nm" style="${p.active === false ? 'opacity:.5' : ''}">${esc(p.name)}</div>
              <div class="ln">${gameLabel(p.game)} · ${p.max_players} players · ${+(p.memory_mb / 1024).toFixed(1)} GB · ${money(p.price_monthly, p.currency)}/mo</div></div>
            <span class="chip ${p.active === false ? '' : 'on'}">${p.active === false ? 'Hidden' : 'Listed'}</span>
            <button class="minibtn" onclick="adminTogglePlan('${p.id}', ${p.active === false ? 'true' : 'false'})">${p.active === false ? 'List' : 'Hide'}</button>
          </div>`).join('')}
        </div>`
      const queue = allOrders.filter((o) => o.status === 'pending_review' || o.status === 'active' || o.status === 'past_due')
      html += `<div class="home-head">Orders</div>`
      if (!cfg.paypal_me) html += `<div class="card"><div class="hintline" style="color:var(--amber)">Set your PayPal.me handle in Supabase → hosting_settings so customers can pay.</div></div>`
      html += queue.length ? queue.map((o) => {
        const plan = planMap.get(o.plan_id)
        const [cls, label] = STATUS_LABEL[o.status] ?? ['', o.status]
        const actions = o.status === 'pending_review'
          ? `<div class="acts"><button class="btn start" onclick="adminApprove('${o.id}')">Approve</button><button class="btn stop" onclick="adminReject('${o.id}')">Reject</button></div>`
          : o.status === 'past_due'
            ? `<div class="acts single"><button class="btn start" onclick="adminApprove('${o.id}')">Renew</button></div>`
            : ''
        return `<div class="card"><div class="head"><div class="who"><div class="nm">${esc(o.server_name)}</div><div class="ln">${plan ? esc(plan.name) : o.plan_id} · ref ${esc(o.reference)}</div></div><span class="chip ${cls}">${label}</span></div>${actions}</div>`
      }).join('') : `<div class="card"><div class="store-closed">No orders waiting.</div></div>`
      return html
    }

    /**
     * Which section of the store is showing. Null until the first load picks a
     * default: an order waiting on money is the thing you came back for, so it
     * wins over browsing. Once the tab is clicked it stays clicked — the 8s poll
     * re-renders constantly and must not drag you back.
     */
    let storeTab = null
    window.goStoreTab = (t) => { storeTab = t; void loadHosting() }

    async function loadHosting(target = 'vHosting') {
      try {
        const [{ data: prof }, { data: plans }, { data: settings }, { data: myOrders }] = await Promise.all([
          supabase.from('profiles').select('is_admin').eq('id', me).maybeSingle(),
          supabase.from('hosting_plans').select('*').order('sort'), // all plans — admins manage inactive ones too
          supabase.from('hosting_settings').select('*').eq('id', 1).maybeSingle(),
          supabase.from('hosting_orders').select('*').order('created_at', { ascending: false })
        ])
        isAdmin = Boolean(prof?.is_admin)
        applyAdminUi()
        const allPlans = plans ?? []
        const planList = allPlans.filter((p) => p.active !== false)
        const planMap = new Map(allPlans.map((p) => [p.id, p]))
        plansCache.clear(); allPlans.forEach((p) => plansCache.set(p.id, p))
        const cfg = settings ?? { paypal_me: '' }
        const shopOpen = cfg.shop_open !== false // old clouds without the column read as open
        const orders = (myOrders ?? []).filter((o) => o.user_id === me)
        const liveOrders = orders.filter((o) => o.status !== 'cancelled' && o.status !== 'rejected')
        const owing = liveOrders.filter((o) => o.status === 'awaiting_payment' || o.status === 'past_due')

        if (storeTab === null) storeTab = owing.length ? 'hosting' : 'shop'
        if (storeTab === 'admin' && !isAdmin) storeTab = 'shop' // admin revoked mid-session

        const tabs = [['shop', 'Shop'], ['hosting', `Your hosting${liveOrders.length ? ` · ${liveOrders.length}` : ''}`]]
        if (isAdmin) tabs.push(['admin', 'Admin'])
        let html = `<div class="sheet-tabs" style="border:0;padding:0 0 14px">${tabs
          .map(([id, label]) => `<button class="${storeTab === id ? 'on' : ''}" onclick="goStoreTab('${id}')">${esc(label)}</button>`)
          .join('')}</div>`

        if (storeTab === 'shop') {
          // an unpaid order is easy to lose behind a tab, so it follows you here
          if (owing.length) {
            html += `<button class="store-alert" onclick="goStoreTab('hosting')">
              <span>${icons.clock}</span>
              <div><b>${owing.length === 1 ? 'An order is waiting for payment' : `${owing.length} orders are waiting for payment`}</b>
                <i>Your server starts once it's paid and approved.</i></div>
              ${icons.chev}</button>`
          }
          html += storeHtml(planList, shopOpen, isAdmin, liveOrders.length > 0)
          // the capacity report used to open this page; it belongs after the
          // plans, as the alternative to renting rather than the headline
          html += `<div class="home-head">Or host it on your own PC</div><div id="vHost"></div>`
        } else if (storeTab === 'hosting') {
          html += ordersHtml(liveOrders, planMap, cfg)
        } else {
          html += adminHtml(allPlans, shopOpen, cfg, myOrders ?? [], planMap)
        }

        // repaint only on real changes — this runs on the 8s poll, and a no-op
        // rewrite would flicker and swallow clicks mid-press
        const el = $(target)
        if (el && el.__lastHtml !== html) { el.__lastHtml = html; el.innerHTML = html }
        // the host card lives inside the shop tab now, so it is painted after
        if (storeTab === 'shop') void loadHostCard()
      } catch {
        // tables not migrated yet — hosting section stays empty
      }
    }

    async function enter(session) {
      me = session.user.id
      // is_admin rides along here rather than waiting on loadHosting(), which only
      // runs once the store tab is opened — the Fleet health nav must appear at sign-in
      const { data } = await supabase.from('profiles').select('username, is_admin').eq('id', me).maybeSingle()
      if (data?.username) myName = `${data.username} (phone)`
      isAdmin = Boolean(data?.is_admin)
      applyAdminUi()
      $('login').hidden = true
      $('topbar').hidden = false
      $('app').hidden = false
      $('railList').innerHTML = '<div class="skel"></div><div class="skel"></div>'
      startRealtime()
      void refresh()
      void refreshBell()
      clearInterval(timer)
      timer = setInterval(refresh, 8000)
    }

    let signupMode = false
    $('modeToggle').addEventListener('click', () => {
      signupMode = !signupMode
      $('userField').hidden = !signupMode
      $('loginBtn').textContent = signupMode ? 'Create account' : 'Sign in'
      $('modeToggle').textContent = signupMode ? 'Have an account? Sign in' : 'New here? Create an account'
    })

    $('loginBtn').addEventListener('click', async () => {
      $('loginErr').textContent = ''
      $('loginBtn').disabled = true
      const email = $('email').value.trim()
      const password = $('password').value
      if (signupMode) {
        const username = $('username').value.trim()
        if (!username) {
          $('loginBtn').disabled = false
          $('loginErr').textContent = 'Pick a username first.'
          return
        }
        const { data, error } = await supabase.auth.signUp({ email, password, options: { data: { username } } })
        $('loginBtn').disabled = false
        if (error) $('loginErr').textContent = error.message
        else if (data.session) void enter(data.session)
        else $('loginErr').textContent = 'Almost there — confirm the email we just sent, then sign in.'
        return
      }
      const { data, error } = await supabase.auth.signInWithPassword({ email, password })
      $('loginBtn').disabled = false
      if (error) $('loginErr').textContent = error.message
      else void enter(data.session)
    })
    $('password').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('loginBtn').click() })

    $('signout').addEventListener('click', async () => {
      await supabase.auth.signOut()
      location.reload()
    })

    // ---------- theme ----------
    // The early inline script in <head> already painted the stored theme; this
    // only wires the toggle and keeps the icon in sync. Same storage key as the
    // desktop app so the two read as one product.
    const SUN = '<circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'
    const MOON = '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>'
    function paintTheme(theme) {
      document.documentElement.dataset.theme = theme
      // show the theme you would switch TO, which is the affordance people expect
      $('themeIcon').innerHTML = theme === 'light' ? MOON : SUN
      $('themeBtn').title = theme === 'light' ? 'Switch to dark' : 'Switch to light'
      document.querySelector('meta[name="theme-color"]')?.setAttribute('content', theme === 'light' ? '#eef0f7' : '#0a0a0f')
    }
    paintTheme(document.documentElement.dataset.theme === 'light' ? 'light' : 'dark')
    $('themeBtn').addEventListener('click', () => {
      const next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light'
      try { localStorage.setItem('elauncher.theme', next) } catch (e) { /* storage blocked */ }
      paintTheme(next)
    })

    // ---------- push notifications ----------
    function urlB64(base64) {
      const padding = '='.repeat((4 - (base64.length % 4)) % 4)
      const raw = atob((base64 + padding).replace(/-/g, '+').replace(/_/g, '/'))
      return Uint8Array.from([...raw].map((c) => c.charCodeAt(0)))
    }

    async function refreshBell() {
      if (!('serviceWorker' in navigator) || !('PushManager' in window) || !me) return
      const bell = $('bell')
      bell.hidden = false
      try {
        const reg = await navigator.serviceWorker.ready
        const sub = await reg.pushManager.getSubscription()
        bell.classList.toggle('on', Boolean(sub))
        bell.title = sub ? 'Notifications on — tap to turn off' : 'Enable notifications'
      } catch {}
    }

    $('bell').addEventListener('click', async () => {
      try {
        const reg = await navigator.serviceWorker.ready
        const existing = await reg.pushManager.getSubscription()
        if (existing) {
          await supabase.from('push_subscriptions').delete().eq('endpoint', existing.endpoint)
          await existing.unsubscribe()
          toast('Notifications off')
          return
        }
        const perm = await Notification.requestPermission()
        if (perm !== 'granted') return toast('Notifications were blocked by the browser', true)
        const { data: cfg } = await supabase.from('push_config').select('public_key').eq('owner_id', me).maybeSingle()
        if (!cfg) return toast('Open ELauncher on your PC once, then try again', true)
        const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlB64(cfg.public_key) })
        const { error } = await supabase.from('push_subscriptions').upsert(
          { owner_id: me, endpoint: sub.endpoint, subscription: sub.toJSON(), label: navigator.userAgent.slice(0, 120) },
          { onConflict: 'endpoint' }
        )
        if (error) throw new Error(error.message)
        toast('Notifications on — this phone gets server alerts')
      } catch (e) {
        toast(e.message ?? 'Could not enable notifications', true)
      } finally {
        void refreshBell()
      }
    })

    document.addEventListener('visibilitychange', () => { if (!document.hidden) void refresh() })

    // installable app shell (Android turns this into a real WebAPK on install)
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {})

    const { data: { session } } = await supabase.auth.getSession()
    if (session) void enter(session)
    else $('login').hidden = false
  </script>
</body>
</html>
