        void window.fileDeleteSel()
      }
    })

    // ---------- network tab (the ports mods need beyond the game's own) ----------
    // Rules are edited locally and saved in one go: a save is real router work,
    // and the host answers with every port's live state, so the single round-trip
    // both applies the change and refreshes the lights.
    let netDraft = []
    const netLive = new Map() // "TCP:8123" -> the host's status for that port
    const netKey = (p) => `${p.protocol}:${p.port}`

    function renderNetwork(body, view) {
      window.__netView = view
      netDraft = view.ports.filter((p) => !p.main).map((p) => ({ port: p.port, protocol: p.protocol, label: p.label }))
      netLive.clear()
      for (const p of view.ports) netLive.set(netKey(p), p)
      paintNetwork(body)
    }

    /** One port: a light, what needs it, and where it reaches. `index` null = the game port, which isn't editable here. */
    function netPortRow(p, live, index) {
      const pending = !live
      const dot = pending ? '' : live.open ? (live.warning ? 'warn' : 'on') : live.error ? 'bad' : ''
      const where = pending
        ? 'Not saved yet'
        : live.open
          ? (live.address ? `Open · ${esc(live.address)}` : 'Open')
          : live.error ? 'Could not open' : 'Opens when the server starts'
      // a router caveat or failure outranks the standing caution — it's what just happened
      const caution = window.__netView.cautions[String(p.port)]
      const why = !pending && live.error ? `<div class="np-why bad">${esc(live.error)}</div>`
        : !pending && live.warning ? `<div class="np-why">${esc(live.warning)}</div>`
        : caution ? `<div class="np-why">${esc(caution)}</div>` : ''
      return `<div class="np-row">
          <span class="np-dot ${dot}"></span>
          <div class="np-body">
            <div class="np-name">${esc(p.label)}</div>
            <div class="np-meta">${p.protocol} ${p.port} · ${where}</div>
          </div>
          ${index == null ? '' : `<button class="minibtn red" onclick="netRemove(${index})">Remove</button>`}
        </div>${why}`
    }

    function paintNetwork(body) {
      const view = window.__netView
      const main = view.ports.find((p) => p.main)
      const used = new Set(netDraft.map(netKey))
      const full = netDraft.length >= view.maxExtra
      const off = full ? 'disabled' : ''

      const presets = view.presets.map((p, i) => {
        const already = used.has(netKey(p))
        return `<button class="np-preset" ${already || full ? 'disabled' : ''} onclick="netPreset(${i})" title="${esc(p.note)}">
          ${already ? '✓' : '+'} ${esc(p.label)} <u>${p.protocol} ${p.port}</u></button>`
      }).join('')

      body.innerHTML = `
        <div class="grouphead" style="margin-top:0">The game's own port</div>
        ${netPortRow(main, netLive.get(netKey(main)), null)}

        <div class="grouphead">Ports your mods need</div>
        <div class="au-note">Some mods listen on a port of their own — proximity voice chat, live web maps, Bedrock crossplay. ${view.direct
          ? 'This host has a public IP of its own, so there is no router to configure — ELauncher opens each port in the firewall while this server runs.'
          : 'ELauncher opens these on the router while this server runs and releases them when it stops.'}</div>
        ${netDraft.length
          ? netDraft.map((p, i) => netPortRow(p, netLive.get(netKey(p)), i)).join('')
          : '<div class="loadrow">No extra ports. Add one below if a mod asks for it.</div>'}

        <div class="grouphead">Add a port</div>
        <div class="np-presets" style="margin-bottom:10px">${presets}</div>
        <div class="np-new">
          <input type="text" id="npLabel" placeholder="What needs it — e.g. Simple Voice Chat" ${off}>
          <select id="npProto" ${off}><option value="UDP">UDP</option><option value="TCP">TCP</option></select>
          <input type="number" id="npPort" min="1024" max="65535" placeholder="Port" ${off}>
          <button class="minibtn acc" onclick="netAdd()" ${off}>Add</button>
        </div>
        ${full ? `<div class="np-why" style="margin-top:8px">That is the maximum of ${view.maxExtra} extra ports. Remove one to add another.</div>` : ''}

        <div class="savebar"><button class="cta" onclick="netSave()">Save ports</button></div>`
    }

    window.netPreset = (i) => {
      const p = window.__netView.presets[i]
      netDraft.push({ port: p.port, protocol: p.protocol, label: p.label })
      paintNetwork($('tabBody'))
    }
    window.netAdd = () => {
      const port = Number($('npPort').value)
      if (!Number.isInteger(port) || port < 1024 || port > 65535) return toast('Enter a port between 1024 and 65535.', true)
      const rule = { port, protocol: $('npProto').value, label: $('npLabel').value.trim() || `Port ${port}` }
      if (netDraft.some((r) => netKey(r) === netKey(rule))) return toast('That port is already on the list.', true)
      netDraft.push(rule)
      paintNetwork($('tabBody'))
    }
    window.netRemove = (i) => { netDraft.splice(i, 1); paintNetwork($('tabBody')) }
    window.netSave = async () => {
      try {
        // the router work happens inside this call, so it gets a longer leash than a normal request
        renderNetwork($('tabBody'), await request(sheetId, 'setPorts', { ports: netDraft }, 45000))
        toast('Ports saved')
      } catch (e) { toast(e.message, true) }
    }

    function autoRow(html) { return `<div class="frow">${html}</div>` }
    function renderAutomation(body, a) {
      const row = rowsById.get(sheetId) || {}
      const game = sheetInfo?.game ?? 'minecraft'
      window.__auto = { ...a }
      window.setAuto = (k, v) => {
        window.__auto[k] = k === 'restartMode' || k === 'restartDailyAt' ? v : Number(v)
        setDirty('automation', true)

      }

      const sel = (key, opts, val) =>
        `<select onchange="setAuto('${key}', this.value)">${opts.map(([v, l]) => `<option value="${v}" ${String(val) === v ? 'selected' : ''}>${l}</option>`).join('')}</select>`
      const num = (key, val, min, max) =>
        `<input type="number" value="${esc(String(val))}" min="${min}" ${max ? `max="${max}"` : ''} oninput="setAuto('${key}', this.value)">`

      // Caveats the implementation already has but never told anyone about.
      // Each one used to surface as "this setting is broken".
      const saveNote = game === 'valheim'
        ? `<div class="au-note warn">Valheim ships no console, so there is no save command to send — this setting has no effect for it. The server still saves on its own schedule and on shutdown.</div>`
        : ''
      // sampling covers Windows and Linux; a running server with no reading is
      // either seconds old or on a launcher build too old to report one
      const memUnavailable = row.state === 'running' && row.memory_mb == null
      const memNote = memUnavailable
        ? `<div class="au-note warn">This host isn't reporting per-server memory yet, so this guard has nothing to act on. It saves fine — readings appear within about ten seconds of a start, and if one never does, the host is on an older launcher build and needs updating.</div>`
        : ''
      const crashNote = `<div class="au-note">A crash within 90 seconds of starting is treated as a failed start, not a crash, so a broken server cannot restart-loop.</div>`
      const backupNote = `<div class="au-note">Backups are folder copies under <code>backups/</code>, not zips — fast, but they take real disk. Keep fewer if space is tight.</div>`

      body.innerHTML = `
        <div class="grouphead" style="margin-top:0">Keeping the world safe</div>
        <div class="au-rule">
          <span>Save the world</span>
          ${sel('saveIntervalMin', [['0', 'never automatically'], ['5', 'every 5 minutes'], ['10', 'every 10 minutes'], ['15', 'every 15 minutes'], ['30', 'every 30 minutes'], ['60', 'every hour']], a.saveIntervalMin || 0)}
        </div>
        ${saveNote}
        <div class="au-rule">
          <span>Back up the world</span>
          ${sel('backupIntervalHours', [['0', 'never'], ['1', 'hourly'], ['3', 'every 3 hours'], ['6', 'every 6 hours'], ['12', 'every 12 hours'], ['24', 'daily']], a.backupIntervalHours || 0)}
          <span>and keep</span>
          ${sel('backupKeep', [['3', '3'], ['5', '5'], ['10', '10'], ['20', '20']], a.backupKeep ?? 5)}
          <span>of them</span>
        </div>
        ${backupNote}

        <div class="grouphead">Restarts</div>
        <div class="au-rule">
          <span>Restart this server</span>
          ${sel('restartMode', [['off', 'never'], ['interval', 'on a repeating timer'], ['daily', 'at the same time daily']], a.restartMode || 'off')}
        </div>
        <div id="autoRestartArgs">${autoRestartArgs(window.__auto)}</div>
        <div class="au-preview" id="autoPreview"></div>

        <div class="grouphead">Safety nets</div>
        <div class="au-rule">
          <span>Restart if memory goes above</span>
          ${sel('restartAboveMemoryMB', [['0', 'never — off'], ['4096', '4 GB'], ['8192', '8 GB'], ['12288', '12 GB'], ['16384', '16 GB']], a.restartAboveMemoryMB || 0)}
        </div>
        ${memNote}
        <div class="frow check"><input type="checkbox" id="a-crash" ${a.restartOnCrash ? 'checked' : ''} onchange="setAutoBool('restartOnCrash', this.checked)"><label for="a-crash">Restart automatically after a crash</label></div>
        ${crashNote}
        <div class="frow check"><input type="checkbox" id="a-boot" ${a.autoStart ? 'checked' : ''} onchange="setAutoBool('autoStart', this.checked)"><label for="a-boot">Start this server when the launcher opens</label></div>

        <div class="savebar"><button class="cta" onclick="saveAuto()">Save automation</button></div>`
      repaintAutoPreview()
    }

    /** Only the fields the chosen restart mode actually uses. */
    function autoRestartArgs(a) {
      if ((a.restartMode || 'off') === 'off') return ''
      const every = a.restartMode === 'interval'
        ? `<div class="au-rule"><span>every</span><input type="number" min="1" max="168" value="${a.restartEveryHours || 6}" oninput="setAuto('restartEveryHours', this.value)"><span>hours</span></div>`
        : `<div class="au-rule"><span>at</span><input type="time" value="${a.restartDailyAt || '04:00'}" onchange="setAuto('restartDailyAt', this.value)"></div>`
      return `${every}
        <div class="au-rule"><span>warning players</span>
          <input type="number" min="0" max="60" value="${a.restartWarningMin ?? 5}" oninput="setAuto('restartWarningMin', this.value)">
          <span>minutes first</span></div>`
    }

    /** When the next scheduled restart actually lands — the schedule is computable, and not showing it is why these settings felt unpredictable. */
    function nextRestartAt(a, startedAt) {
      const mode = a.restartMode || 'off'
      if (mode === 'off') return null
      if (mode === 'daily') {
        const [h, m] = String(a.restartDailyAt || '04:00').split(':').map(Number)
        const next = new Date()
        next.setHours(h || 0, m || 0, 0, 0)
        if (next <= new Date()) next.setDate(next.getDate() + 1)
        return next
      }
      const hours = Math.max(1, Number(a.restartEveryHours) || 6)
      // the timer arms when the server reaches 'running', so count from there
      const base = startedAt ? new Date(startedAt).getTime() : Date.now()
      let next = base + hours * 3_600_000
      while (next <= Date.now()) next += hours * 3_600_000
      return new Date(next)
    }

    function repaintAutoPreview() {
      const args = $('autoRestartArgs')
      if (args) args.innerHTML = autoRestartArgs(window.__auto)
      const el = $('autoPreview')
      if (!el) return
      const row = rowsById.get(sheetId) || {}
      const a = window.__auto
      const when = nextRestartAt(a, row.state === 'running' ? row.started_at : null)
      if (!when) { el.innerHTML = ''; return }
      const warn = Number(a.restartWarningMin ?? 5)
      const inMs = when.getTime() - Date.now()
      const clock = when.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })
      const running = row.state === 'running'
      el.innerHTML = `<b>Next restart ${esc(clock)}</b>${running ? ` · in ${fmtUptime(inMs)}` : ''}${warn > 0 ? ` · players warned ${warn} min before` : ''}
        ${running ? '' : '<i>Timers only run while the server is running, so this starts counting once it is up.</i>'}`
    }

    window.saveAuto = async () => {
      try {
        await request(sheetId, 'setAutomation', { automation: window.__auto })
        sheetInfo.automation = window.__auto
        delete dirty.automation
        toast('Automation saved')
      } catch (e) {

      }
    }

    // ---------- access ----------
    // Who else can open this panel. The grants belong to the host account, so
    // every change goes over the relay rather than straight to the table: that

    function accessRow(name, meta, button) {

    function renderAccess(body, view) {
      window.__access = view // accessRevoke names the person from here
      const people = view.people ?? []
      body.innerHTML = `
        <div class="grouphead" style="margin-top:0">Who can manage this server</div>
        <div class="plister access">
          ${accessRow(view.owner, 'Hosts this server — full control', '<span class="chip">Host</span>')}

          )).join('')}
        </div>
        ${people.length ? '' : '<div class="loadrow">Nobody else has access yet.</div>'}

        <div class="grouphead">Invite someone</div>
        <div class="np-new">
          <input type="text" id="acName" placeholder="Their ELauncher username" autocomplete="off" autocapitalize="none"
                 onkeydown="if(event.key==='Enter')accessGrant()">
          <button class="minibtn acc" id="acAdd" onclick="accessGrant()">Invite</button>
        </div>
        <div class="au-note">They need an ELauncher account already — invite them by the username they signed up with.

    window.accessGrant = async () => {
