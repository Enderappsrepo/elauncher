<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d12" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>ELauncher — Remote</title>
  <link rel="icon" href="../icon.png" />
  <style>
    * { box-sizing: border-box; margin: 0; }
    :root {
      --bg: #0b0d12; --card: #12151d; --card2: #171b25; --line: #232837;
      --text: #e8ebf4; --faint: #8b93a7; --accent: #7c5cff; --green: #3ddc84; --red: #ff5c6c;
    }
    body {
      background: var(--bg); color: var(--text); min-height: 100vh;
      font: 15px/1.45 -apple-system, 'Segoe UI', Roboto, sans-serif;
      padding: max(14px, env(safe-area-inset-top)) 14px calc(24px + env(safe-area-inset-bottom));
      max-width: 560px; margin: 0 auto;
    }
    h1 { font-size: 19px; display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
    h1 img { width: 26px; height: 26px; border-radius: 7px; }
    h1 .sub { color: var(--faint); font-size: 12px; font-weight: 400; margin-left: auto; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
    label { display: block; font-size: 12px; color: var(--faint); margin: 10px 0 5px; }
    input, button { font: inherit; }
    input {
      width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line);
      background: var(--card2); color: var(--text); outline: none;
    }
    input:focus { border-color: var(--accent); }
    button {
      padding: 11px 16px; border-radius: 10px; border: 1px solid var(--line);
      background: var(--card2); color: var(--text); cursor: pointer; font-weight: 600;
    }
    button:disabled { opacity: 0.45 }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.danger { background: rgba(255, 92, 108, .12); border-color: rgba(255, 92, 108, .4); color: var(--red); }
    button.go { background: rgba(61, 220, 132, .12); border-color: rgba(61, 220, 132, .4); color: var(--green); }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .grow { flex: 1 }
    .chip { font-size: 11.5px; padding: 3px 9px; border-radius: 99px; border: 1px solid var(--line); color: var(--faint); }
    .chip.on { color: var(--green); border-color: rgba(61,220,132,.4); background: rgba(61,220,132,.08); }
    .chip.off { color: var(--faint); }
    .chip.dead { color: var(--red); border-color: rgba(255,92,108,.35); }
    .name { font-weight: 700; font-size: 16px; }
    .faint { color: var(--faint); font-size: 12.5px; }
    .console {
      background: #0a0c10; border: 1px solid var(--line); border-radius: 10px; padding: 10px;
      font: 11px/1.5 ui-monospace, Menlo, Consolas, monospace; white-space: pre-wrap; word-break: break-word;
      max-height: 240px; overflow-y: auto; margin-top: 10px; color: #b7c0d4;
    }
    .err { color: var(--red); font-size: 13px; margin-top: 10px; min-height: 18px; }
    .addr { font: 12px ui-monospace, Menlo, Consolas, monospace; color: var(--text); background: var(--card2);
      border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
    .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .pulse { display: inline-block; width: 7px; height: 7px; border-radius: 99px; background: var(--green); margin-right: 5px;
      animation: pulse 1.6s infinite; }
    @keyframes pulse { 50% { opacity: .35 } }
    #servers:empty::after { content: 'No servers published yet — open ELauncher on your PC.'; color: var(--faint); }
  </style>
</head>
<body>
  <h1><img src="../icon.png" alt="" /> ELauncher Remote <span class="sub" id="who"></span></h1>

  <div class="card" id="login" hidden>
    <div class="name" style="margin-bottom:4px">Sign in</div>
    <div class="faint">Same account as the launcher. Your PC's launcher must be running to receive commands.</div>
    <label>Email</label>
    <input id="email" type="email" autocomplete="email" inputmode="email" />
    <label>Password</label>
    <input id="password" type="password" autocomplete="current-password" />
    <div class="err" id="loginErr"></div>
    <button class="primary" id="loginBtn" style="width:100%;margin-top:6px">Sign in</button>
  </div>

  <div id="app" hidden>
    <div class="topbar">
      <span class="faint"><span class="pulse"></span>updates every 8s</span>
      <button id="signout" style="padding:7px 12px;font-size:12.5px">Sign out</button>
    </div>
    <div id="servers"></div>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'

    const SUPABASE_URL = 'https://noodzwrbsibogeoukvye.supabase.co'
    const SUPABASE_ANON_KEY = 'sb_publishable_DgVhX7zDLdO2ghE14jcrTw_o3yLxwrs'
    const HEARTBEAT_MS = 10_000
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

    const $ = (id) => document.getElementById(id)
    let me = null
    let myName = 'Phone'
    let timer = null
    let restarting = new Set()

    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
    }

    async function queue(serverId, action, payload = '') {
      const { error } = await supabase.from('server_commands').insert({
        server_id: serverId, owner_id: me, sender_id: me, sender_name: myName, action, payload
      })
      if (error) throw new Error(error.message)
    }

    async function fetchServers() {
      const { data, error } = await supabase.from('server_status').select('*').eq('owner_id', me).order('name')
      if (error) throw new Error(error.message)
      return data ?? []
    }

    async function waitForState(serverId, wanted, timeoutMs) {
      const until = Date.now() + timeoutMs
      while (Date.now() < until) {
        await new Promise((r) => setTimeout(r, 4000))
        const rows = await fetchServers().catch(() => [])
        const row = rows.find((r) => r.server_id === serverId)
        if (row && row.state === wanted) return true
      }
      return false
    }

    window.act = async (serverId, action) => {
      try {
        if (action === 'restart') {
          restarting.add(serverId)
          render(await fetchServers())
          await queue(serverId, 'stop')
          if (await waitForState(serverId, 'stopped', 120_000)) await queue(serverId, 'start')
          restarting.delete(serverId)
        } else {
          await queue(serverId, action)
        }
        void refresh()
      } catch (e) {
        restarting.delete(serverId)
        alert(e.message ?? 'Command failed')
      }
    }

    window.sendCmd = async (serverId, inputId) => {
      const input = $(inputId)
      const value = input.value.trim()
      if (!value) return
      try {
        await queue(serverId, 'command', value)
        input.value = ''
      } catch (e) {
        alert(e.message ?? 'Command failed')
      }
    }

    function render(rows) {
      const wrap = $('servers')
      const open = new Set([...wrap.querySelectorAll('details[open]')].map((d) => d.dataset.id))
      wrap.innerHTML = rows.map((row) => {
        const fresh = Date.now() - new Date(row.updated_at).getTime() < HEARTBEAT_MS * 4
        const state = fresh ? row.state : 'offline'
        const chip = state === 'running'
          ? '<span class="chip on">online</span>'
          : state === 'offline'
            ? '<span class="chip dead">launcher offline</span>'
            : `<span class="chip off">${esc(state)}</span>`
        const players = fresh && row.players?.length ? `<div class="faint" style="margin-top:4px">${esc(row.players.join(', '))}</div>` : ''
        const addr = fresh && row.address ? `<div class="addr" style="margin-top:8px">${esc(row.address)}</div>` : ''
        const busy = restarting.has(row.server_id)
        const running = state === 'running' || state === 'starting'
        const buttons = state === 'offline'
          ? '<div class="faint" style="margin-top:8px">Open ELauncher on your PC to control this server.</div>'
          : `<div class="row" style="margin-top:10px">
              ${running
                ? `<button class="danger" onclick="act('${row.server_id}','stop')" ${busy ? 'disabled' : ''}>Stop</button>
                   <button onclick="act('${row.server_id}','restart')" ${busy ? 'disabled' : ''}>${busy ? 'Restarting…' : 'Restart'}</button>`
                : `<button class="go" onclick="act('${row.server_id}','start')" ${busy ? 'disabled' : ''}>Start</button>`}
             </div>`
        const cmdId = `cmd-${row.server_id}`
        const consoleBlock = `
          <details data-id="${row.server_id}" ${open.has(row.server_id) ? 'open' : ''}>
            <summary class="faint" style="margin-top:10px;cursor:pointer">console</summary>
            <div class="console">${esc(row.console || 'No output yet.')}</div>
            ${running ? `<div class="row" style="margin-top:8px">
              <input id="${cmdId}" class="grow" placeholder="say hi · save · kick <id>" style="font-family:ui-monospace,Consolas,monospace;font-size:12.5px" />
              <button onclick="sendCmd('${row.server_id}','${cmdId}')">Send</button>
            </div>` : ''}
          </details>`
        return `<div class="card">
          <div class="row"><span class="name grow">${esc(row.name)}</span>${chip}</div>
          ${players}${addr}${buttons}${consoleBlock}
        </div>`
      }).join('')
    }

    async function refresh() {
      if (!me || document.hidden) return
      try {
        render(await fetchServers())
      } catch (e) {
        $('servers').innerHTML = `<div class="err">${esc(e.message)}</div>`
      }
    }

    async function enter(session) {
      me = session.user.id
      $('who').textContent = session.user.email ?? ''
      const { data } = await supabase.from('profiles').select('username').eq('id', me).maybeSingle()
      if (data?.username) myName = `${data.username} (phone)`
      $('login').hidden = true
      $('app').hidden = false
      void refresh()
      clearInterval(timer)
      timer = setInterval(refresh, 8000)
    }

    $('loginBtn').addEventListener('click', async () => {
      $('loginErr').textContent = ''
      $('loginBtn').disabled = true
      const { data, error } = await supabase.auth.signInWithPassword({
        email: $('email').value.trim(),
        password: $('password').value
      })
      $('loginBtn').disabled = false
      if (error) $('loginErr').textContent = error.message
      else void enter(data.session)
    })
    $('password').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('loginBtn').click() })

    $('signout').addEventListener('click', async () => {
      await supabase.auth.signOut()
      location.reload()
    })

    document.addEventListener('visibilitychange', () => { if (!document.hidden) void refresh() })

    const { data: { session } } = await supabase.auth.getSession()
    if (session) void enter(session)
    else $('login').hidden = false
  </script>
</body>
</html>
