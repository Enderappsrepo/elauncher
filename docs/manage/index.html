          ${m.iconUrl ? `<img src="${esc(m.iconUrl)}" style="width:30px;height:30px;border-radius:7px">` : ''}
          <div style="flex:1;min-width:0"><div class="pn">${esc(m.title || m.fileName)}</div><div class="pm">${esc(m.versionNumber || m.fileName)}</div></div>
          <button class="minibtn red" onclick="removeMod('${esc(m.fileName)}')">Remove</button></div>`).join('') : '<div class="loadrow">No mods yet — search below.</div>'}</div>
        <div class="grouphead">Add mods · ${esc(sheetInfo.kind)} ${esc(sheetInfo.minecraftVersion || '')}</div>
        <div class="searchbar">${icons.chipIc}<input placeholder="Search Modrinth mods…" oninput="modSearch(this.value)"></div>
        <div id="modResults" class="plister"><div class="loadrow">Type to search.</div></div>`
    }
    window.modSearch = async (q) => {
      const box = $('modResults'); if (!box) return
      if (!q.trim()) { box.innerHTML = '<div class="loadrow">Type to search.</div>'; return }
      box.innerHTML = '<div class="loadrow">Searching…</div>'
      try {
        const hits = await modrinthSearch(q, 'mod', sheetInfo.minecraftVersion, sheetInfo.kind)
        box.innerHTML = hits.map((h) => `<div class="prow">
          ${h.icon_url ? `<img src="${esc(h.icon_url)}" style="width:30px;height:30px;border-radius:7px">` : ''}
          <div style="flex:1;min-width:0"><div class="pn">${esc(h.title)}</div><div class="pm">${(h.downloads || 0).toLocaleString()} downloads</div></div>
          <button class="minibtn" onclick="installMod('${h.project_id}', this)">Install</button></div>`).join('') || '<div class="loadrow">No mods found.</div>'
      } catch { box.innerHTML = '<div class="loadrow" style="color:var(--red)">Search failed.</div>' }
    }
    window.installMod = async (projectId, btn) => {
      if (btn) { btn.disabled = true; btn.textContent = 'Installing…' }
      try { await request(sheetId, 'installMod', { projectId }, 40000); toast('Mod installed — restart to apply'); renderTab() }
      catch (e) { toast(e.message, true); if (btn) { btn.disabled = false; btn.textContent = 'Install' } }
    }
    window.removeMod = async (fileName) => {
      if (!confirm('Remove this mod?')) return
      try { await request(sheetId, 'removeMod', { fileName }); toast('Removed'); renderTab() } catch (e) { toast(e.message, true) }
    }

    function autoRow(html) { return `<div class="frow">${html}</div>` }
    function renderAutomation(body, a) {
      const sel = (key, opts, val) => `<select onchange="setAuto('${key}', this.value)">${opts.map(([v, l]) => `<option value="${v}" ${String(val) === v ? 'selected' : ''}>${l}</option>`).join('')}</select>`
      window.__auto = { ...a }
      window.setAuto = (k, v) => { window.__auto[k] = k === 'restartMode' || k === 'restartDailyAt' ? v : Number(v); }
      window.setAutoBool = (k, v) => { window.__auto[k] = v }
      body.innerHTML = `
        <div class="frow"><label>Auto-save world</label>${sel('saveIntervalMin', [['0', 'Off'], ['5', 'Every 5 min'], ['10', 'Every 10 min'], ['15', 'Every 15 min'], ['30', 'Every 30 min'], ['60', 'Every hour']], a.saveIntervalMin || 0)}</div>
        <div class="frow"><label>Scheduled restart</label>${sel('restartMode', [['off', 'Off'], ['interval', 'Every N hours'], ['daily', 'Daily at a time']], a.restartMode || 'off')}</div>
        <div class="grid2">
          <div class="frow"><label>Restart every (hours)</label><input type="number" value="${a.restartEveryHours || 6}" oninput="setAuto('restartEveryHours', this.value)"></div>
          <div class="frow"><label>Daily time</label><input type="time" value="${a.restartDailyAt || '04:00'}" onchange="setAuto('restartDailyAt', this.value)"></div>
        </div>
        <div class="frow"><label>Warn players (min)</label><input type="number" value="${a.restartWarningMin ?? 5}" oninput="setAuto('restartWarningMin', this.value)"></div>
        <div class="frow"><label>World backups</label>${sel('backupIntervalHours', [['0', 'Off'], ['1', 'Hourly'], ['3', 'Every 3h'], ['6', 'Every 6h'], ['12', 'Every 12h'], ['24', 'Daily']], a.backupIntervalHours || 0)}</div>
        <div class="frow"><label>Restart above memory</label>${sel('restartAboveMemoryMB', [['0', 'Off'], ['4096', '4 GB'], ['8192', '8 GB'], ['12288', '12 GB'], ['16384', '16 GB']], a.restartAboveMemoryMB || 0)}</div>
        <div class="frow check"><input type="checkbox" id="a-crash" ${a.restartOnCrash ? 'checked' : ''} onchange="setAutoBool('restartOnCrash', this.checked)"><label for="a-crash">Restart automatically after a crash</label></div>
        <div class="frow check"><input type="checkbox" id="a-boot" ${a.autoStart ? 'checked' : ''} onchange="setAutoBool('autoStart', this.checked)"><label for="a-boot">Start with the launcher</label></div>
        <div class="savebar"><button class="cta" onclick="saveAuto()">Save automation</button></div>`
    }
    window.saveAuto = async () => {
      try { await request(sheetId, 'setAutomation', { automation: window.__auto }); sheetInfo.automation = window.__auto; toast('Automation saved') }
      catch (e) { toast(e.message, true) }
    }

    // ---------- desktop master-detail ----------
    const stClassOf = (row) => {
      const fresh = Date.now() - new Date(row.updated_at).getTime() < HEARTBEAT_MS * 4
      const state = fresh ? row.state : 'offline'
      return state === 'running' ? 'on' : (state === 'starting' || state === 'stopping') ? 'warm' : state === 'offline' ? 'dead' : ''
    }
    // performance reading from the published CPU load (the launcher also detects tick lag directly)
    const perfOf = (row) => {
      const fresh = Date.now() - new Date(row.updated_at).getTime() < HEARTBEAT_MS * 4
      if (!fresh || row.state !== 'running' || row.cpu_percent == null) return null
      if (row.cpu_percent >= 90) return ['poor', 'Struggling', 'var(--red)']
      if (row.cpu_percent >= 70) return ['fair', 'Busy', 'var(--amber)']
      return ['smooth', 'Smooth', 'var(--green)']
    }
    function renderDeskList(rows) {
      const el = $('dsideList')
      if (!el) return
      $('dStoreBtn').classList.toggle('sel', deskSel === 'store')
      el.innerHTML = rows.length ? rows.map((r) => `<div class="dsrow ${deskSel === r.server_id ? 'sel' : ''}" onclick="deskSelect('${r.server_id}')">
        <span class="tile" style="background:${gradOf(r.server_id)}">${esc((r.name || '?').charAt(0).toUpperCase())}<span class="st ${stClassOf(r)}"></span></span>
        <div style="flex:1;min-width:0"><div class="dsn">${esc(r.name || 'Server')}</div><div class="dsm">${stClassOf(r) === 'on' ? (r.players?.length ? r.players.length + ' online' : 'Online') : stClassOf(r) === 'dead' ? 'PC offline' : (r.state || 'stopped')}</div></div>
      </div>`).join('') : '<div class="loadrow">No servers yet.</div>'
    }
    window.deskSelect = (id) => {
      if (Object.keys(dirty).length && !confirm('Discard unsaved changes?')) return
      deskSel = id; dirty = {}
      if (id !== 'store') { sheetId = id; sheetInfo = null; sheetTab = 'console' }
      renderDeskList([...rowsById.values()])
      deskRenderDetail()
    }
    window.deskTabGo = (tab) => {
      if (Object.keys(dirty).length && !confirm('Discard unsaved changes?')) return
      sheetTab = tab; dirty = {}
      document.querySelectorAll('.dtabs button').forEach((b) => b.classList.toggle('on', b.dataset.t === tab))
      const body = $('dbody'); if (body) runTab(body)
    }
    function deskHero(row) {
      const fresh = Date.now() - new Date(row.updated_at).getTime() < HEARTBEAT_MS * 4
      const running = fresh && row.state === 'running'
      const transit = fresh && (row.state === 'starting' || row.state === 'stopping')
      const power = running || transit
        ? `<button class="dbtn stop" onclick="act('${row.server_id}','stop')" ${transit ? 'disabled' : ''}>${icons.stop} Stop</button>
           <button class="dbtn" onclick="act('${row.server_id}','restart')" ${transit ? 'disabled' : ''}>${icons.redo} Restart</button>`
        : `<button class="dbtn start" onclick="act('${row.server_id}','start')">${icons.play} Start</button>`
      const perf = perfOf(row)
      const stats = []
      if (perf) stats.push(`<div class="dstat"><div class="v" style="color:${perf[2]}">${perf[1]}</div><div class="l">Performance</div></div>`)
      if (running && row.started_at) stats.push(`<div class="dstat"><div class="v">${fmtUptime(Date.now() - new Date(row.started_at).getTime())}</div><div class="l">Uptime</div></div>`)
      if (running && row.memory_mb != null) stats.push(`<div class="dstat"><div class="v">${(row.memory_mb / 1024).toFixed(1)} GB</div><div class="l">Memory${row.cpu_percent != null ? ` · ${row.cpu_percent}% CPU` : ''}</div></div>`)
      stats.push(`<div class="dstat"><div class="v">${running ? (row.players?.length || 0) : '—'}</div><div class="l">Players</div></div>`)
      if (fresh && row.address) stats.push(`<div class="dstat"><div class="v" style="font-family:ui-monospace,Consolas,monospace;font-size:14px;cursor:pointer" onclick="copyAddr('${esc(row.address)}')">${esc(row.address)}</div><div class="l">Public address · copy</div></div>`)
      const label = running ? 'Online' : transit ? (row.state === 'starting' ? 'Starting…' : 'Stopping…') : !fresh ? 'PC offline' : 'Stopped'
      const chip = `<span class="chip ${stClassOf(row)}">${label}</span>`
      return `<div class="dhero"><div class="dhero-row">
        <span class="tile" style="background:${gradOf(row.server_id)}">${esc((row.name || '?').charAt(0).toUpperCase())}</span>
        <div style="min-width:0"><div class="row" style="gap:10px"><h2>${esc(row.name || 'Server')}</h2>${chip}</div>
          <div class="dhsub">${sheetInfo ? (isPal() ? 'Palworld' : 'Minecraft ' + esc(sheetInfo.kind) + ' ' + esc(sheetInfo.minecraftVersion || '')) + ' · port ' + sheetInfo.port : ' '}</div></div>
        <div class="dhero-acts">${power}</div></div>
        <div class="dstats">${stats.join('')}</div></div>`
    }
    function deskTabsBar() {
      const tabs = ['console', 'settings', 'players', ...(isModdable() ? ['mods'] : []), 'automation']
      const label = { console: 'Console', settings: 'Settings', players: 'Players', mods: 'Mods', automation: 'Automation' }
      return `<div class="dtabs">${tabs.map((t) => `<button data-t="${t}" class="${t === sheetTab ? 'on' : ''}" onclick="deskTabGo('${t}')">${label[t]}</button>`).join('')}</div>`
    }
    async function deskRenderDetail() {
      const main = $('dmain'); if (!main) return
      if (deskSel === 'store') {
        main.innerHTML = `<div class="dhero"><div class="dhero-row"><div style="min-width:0"><h2>New server &amp; billing</h2><div class="dhsub">Order a server, pay, and track your plans</div></div></div></div>
          <div class="dbody"><div id="dHost"></div><div id="dHosting"></div></div>`
        loadHostCard('dHost'); loadHosting('dHosting'); return
      }
      if (!deskSel) {
        main.innerHTML = `<div class="dwelcome"><div class="halo"><img src="../icon.png" alt=""></div><b>Pick a server</b>Choose one from the left to open its control panel.</div>`
        return
      }
      const row = rowsById.get(deskSel) || {}
      main.innerHTML = deskHero(row) + `<div class="dtabs"></div><div class="dbody" id="dbody"><div class="loadrow">Loading control panel…</div></div>`
      try {
        if (!sheetInfo) { sheetId = deskSel; sheetInfo = await request(deskSel, 'info') }
        main.innerHTML = deskHero(row) + deskTabsBar() + '<div class="dbody" id="dbody"></div>'
        await runTab($('dbody'))
      } catch (e) {
        const body = main.querySelector('.dbody'); if (body) body.innerHTML = `<div class="loadrow" style="color:var(--red)">${esc(e.message)}</div>`
      }
    }

    function applyLayout(rows) {
      // the desktop path doesn't call render(), so populate the shared lookup here
      rowsById.clear()
      rows.forEach((r) => rowsById.set(r.server_id, r))
      if (DESK()) {
        document.body.classList.add('desk')
        renderDeskList(rows)
        if (deskSel === null) deskSel = rows[0]?.server_id ?? 'store'
        // refresh the detail lightly: update hero stats / console without disturbing edits
        if (deskSel && deskSel !== 'store' && !rowsById.get(deskSel)) { deskSel = rows[0]?.server_id ?? 'store'; deskRenderDetail() }
        else if (!$('dbody') && !$('dHost')) deskRenderDetail()
        else deskLiveUpdate()
      } else {
        document.body.classList.remove('desk')
        render(rows)
        void loadHostCard(); void loadHosting()
      }
    }
    // keep hero/console fresh on desktop without clobbering the active tab's edits
    function deskLiveUpdate() {
      if (deskSel === 'store') { void loadHostCard(); void loadHosting(); return }
      if (!deskSel) return
      const row = rowsById.get(deskSel); if (!row) return
      const hero = $('dmain')?.querySelector('.dhero')
      if (hero) hero.outerHTML = deskHero(row)
      if (sheetTab === 'console') {
        const con = $('dmain')?.querySelector('.console')
        if (con) { const stick = con.scrollHeight - con.scrollTop - con.clientHeight < 40; con.textContent = row.console || 'No output yet.'; if (stick) con.scrollTop = con.scrollHeight }
      }
    }
    matchMedia('(min-width:900px)').addEventListener('change', () => { if (me) void refresh() })

    // keep an open mobile console tab live without disturbing other tabs' edits
    function paintMobileConsole() {
      if (DESK() || !sheetId || sheetTab !== 'console') return
      const con = document.querySelector('#sheetBody .console')
      if (con) {
        const stick = con.scrollHeight - con.scrollTop - con.clientHeight < 40
        con.textContent = (rowsById.get(sheetId) || {}).console || 'No output yet.'
        if (stick) con.scrollTop = con.scrollHeight
      }
    }

    async function refresh() {
      if (!me || document.hidden) return
      try {
        const rows = await fetchServers()
        applyLayout(rows)
        paintMobileConsole()
      } catch (e) {
        const target = DESK() ? $('dsideList') : $('servers')
        if (target) target.innerHTML = `<div class="empty"><b>Could not reach the cloud</b>${esc(e.message)}</div>`
      }
    }

    // ---------- realtime: the cloud pushes changes; polling stays as the safety net ----------
    let rtLive = false
    let paintQueued = false
    function schedulePaint() {
      if (paintQueued) return
      paintQueued = true
      setTimeout(() => {
        paintQueued = false
        if (!me || document.hidden) return
        applyLayout([...rowsById.values()].sort((a, b) => (a.name || '').localeCompare(b.name || '')))
        paintMobileConsole()
      }, 120)
    }
    function mergeStatus(row) {
      if (!row?.server_id) return
      const old = rowsById.get(row.server_id)
      if (!old) return void refresh() // brand-new server — a full fetch fills in owner names
      rowsById.set(row.server_id, { ...old, ...row })
      schedulePaint()
    }
    let hostingTimer = null
    function scheduleHosting() {
      clearTimeout(hostingTimer)
      hostingTimer = setTimeout(() => void loadHosting(), 250)
    }
    function startRealtime() {
      try {
        supabase
          .channel('panel-live')
          .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'server_status' }, (p) => mergeStatus(p.new))
          .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'server_status' }, (p) => mergeStatus(p.new))
          .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'server_requests', filter: `requester_id=eq.${me}` }, (p) => settleRequest(p.new))
          .on('postgres_changes', { event: '*', schema: 'public', table: 'hosting_orders' }, scheduleHosting)
          .subscribe((status) => {
            rtLive = status === 'SUBSCRIBED'
          })
      } catch {
        // realtime not enabled on this cloud — the polls above keep everything working
      }
    }

    /** "PC as a host" card — the launcher publishes its specs + per-game report. */
    async function loadHostCard(target = $('dHost') ? 'dHost' : 'host') {
      try {
        const { data } = await supabase.from('host_specs').select('report').eq('owner_id', me).maybeSingle()
        const report = data?.report
        if (!report?.specs) return
        const verdictChip = { great: ['on', 'Great'], good: ['acc', 'Good'], tight: ['warm', 'Tight'], no: ['dead', 'Not recommended'] }
        const rows = (report.games ?? []).map((g) => {
          const [cls, label] = verdictChip[g.verdict] ?? ['', g.verdict]
          return `<div class="row" style="gap:8px;padding:7px 0;border-top:1px solid var(--line)">
            <div style="flex:1;min-width:0">
              <div style="font-weight:650;font-size:13.5px">${esc(g.game)}</div>
              ${g.verdict !== 'no' ? `<div class="faint" style="font-size:12px">${esc(g.players)} players</div>` : ''}
            </div>
            <span class="chip ${cls}">${esc(label)}</span>
          </div>`
        }).join('')
        const hostEl = $(target); if (!hostEl) return
        const html = `<div class="card">
          <div class="row" style="gap:8px">
            <b style="font-size:14.5px;flex:1">Home PC as a host</b>
            <span class="pill">${esc(report.specs.cpuModel)} · ${esc(String(report.specs.ramGB))} GB · ${esc(report.specs.diskType)}</span>
          </div>
          ${rows}
        </div>`
        if (hostEl.__lastHtml !== html) { hostEl.__lastHtml = html; hostEl.innerHTML = html }
      } catch {
        // card is optional — table may not be migrated yet
      }
    }

    // ---------- hosting: plans, orders, admin approval ----------
    let isAdmin = false
    const plansCache = new Map()
    const REF = () => 'ELH-' + Math.random().toString(36).slice(2, 7).toUpperCase()
    const money = (n, c) => `${c === 'USD' ? '$' : ''}${Number(n).toFixed(2)}${c === 'USD' ? '' : ' ' + c}`
    const STATUS_LABEL = {
      awaiting_payment: ['warm', 'Awaiting payment'], pending_review: ['warm', 'Payment under review'],
      active: ['on', 'Active'], past_due: ['dead', 'Past due'], rejected: ['dead', 'Rejected'], cancelled: ['', 'Cancelled']
    }

    // ---- ordering with configuration (loader / version / modpack) ----
    let mcVersions = null
    async function loadMcVersions() {
      if (mcVersions) return mcVersions
      try {
        const r = await fetch('https://piston-meta.mojang.com/mc/game/version_manifest_v2.json')
        const j = await r.json()
        mcVersions = j.versions.filter((v) => v.type === 'release').map((v) => v.id).slice(0, 40)
      } catch { mcVersions = ['1.21.4', '1.21.1', '1.20.1'] }
      return mcVersions
    }
    async function modrinthSearch(query, type, mcVer, loader) {
      const facets = [[`project_type:${type}`]]
      if (mcVer) facets.push([`versions:${mcVer}`])
      if (loader && type === 'mod') facets.push([`categories:${loader}`])
      const url = `https://api.modrinth.com/v2/search?limit=12&index=relevance&query=${encodeURIComponent(query || '')}&facets=${encodeURIComponent(JSON.stringify(facets))}`
      const r = await fetch(url)
      return (await r.json()).hits || []
    }

    let order = null
    window.orderPlan = async (planId) => {
      const plan = plansCache.get(planId)
      if (!plan) return
      order = { plan, name: '', mode: 'fresh', loader: 'paper', version: '', versions: [], modpack: null, modpackName: '' }
      renderOrder()
      if (plan.game === 'minecraft') {
        order.versions = await loadMcVersions()
        order.version = order.versions[0] || ''
        renderOrder()
      }
    }
    window.closeOrder = () => { order = null; $('sheet').innerHTML = '' }
    window.setOrder = (k, v) => { order[k] = v; if (k === 'mode' || k === 'loader') renderOrder() }
    window.pickPack = (id, name) => { order.modpack = id; order.modpackName = name; renderOrder() }
    window.orderSearchPack = async (q) => {
      const box = $('packResults'); if (box) box.innerHTML = '<div class="loadrow">Searching…</div>'
      try {
        const hits = await modrinthSearch(q, 'modpack')
        if (box) box.innerHTML = hits.map((h) => `<button class="prow" style="width:100%;text-align:left;border:0;background:none" onclick="pickPack('${h.project_id}','${esc(h.title).replace(/'/g, '')}')">
          ${h.icon_url ? `<img src="${esc(h.icon_url)}" style="width:34px;height:34px;border-radius:8px">` : '<span class="p-tile" style="width:34px;height:34px">?</span>'}
          <div style="flex:1;min-width:0"><div class="pn">${esc(h.title)}</div><div class="pm">${(h.downloads || 0).toLocaleString()} downloads</div></div>
          ${order.modpack === h.project_id ? '<span class="chip on">✓</span>' : ''}</button>`).join('') || '<div class="loadrow">No modpacks found.</div>'
      } catch { if (box) box.innerHTML = '<div class="loadrow" style="color:var(--red)">Search failed.</div>' }
    }

    function renderOrder() {
      const o = order, plan = o.plan, mc = plan.game === 'minecraft'
      const money2 = money(plan.price_monthly, plan.currency)
      let cfg = ''
      if (mc) {
        cfg = `<div class="sheet-tabs" style="border:0;padding:0 0 12px">
            <button class="${o.mode === 'fresh' ? 'on' : ''}" onclick="setOrder('mode','fresh')">Fresh server</button>
            <button class="${o.mode === 'modpack' ? 'on' : ''}" onclick="setOrder('mode','modpack')">From a modpack</button>
          </div>`
        if (o.mode === 'fresh') {
          cfg += `<div class="grid2">
            <div class="frow"><label>Loader</label><select onchange="setOrder('loader',this.value)">
              ${['paper', 'vanilla', 'fabric', 'neoforge', 'forge'].map((k) => `<option value="${k}" ${o.loader === k ? 'selected' : ''}>${k[0].toUpperCase() + k.slice(1)}</option>`).join('')}
            </select></div>
            <div class="frow"><label>Version</label><select onchange="setOrder('version',this.value)">
              ${o.versions.map((v) => `<option ${o.version === v ? 'selected' : ''}>${v}</option>`).join('')}
            </select></div></div>
            <div class="frow"><div class="hint2">${o.loader === 'paper' ? 'Paper: fast, plugins.' : o.loader === 'vanilla' ? 'Vanilla: the official server.' : 'You can add mods after it is set up, from the Mods tab.'}</div></div>`
        } else {
          cfg += `<div class="searchbar">${icons.chipIc}<input placeholder="Search Modrinth modpacks…" oninput="orderSearchPack(this.value)"></div>
            <div id="packResults" class="plister">${o.modpack ? `<div class="hintline">Selected: <b>${esc(o.modpackName)}</b></div>` : '<div class="loadrow">Type to search modpacks.</div>'}</div>`
        }
      }
      $('sheet').innerHTML = `<div class="sheet-bg" onclick="closeOrder()"></div>
        <div class="sheet"><div class="sheet-grip"></div>
          <div class="sheet-top"><div class="tile" style="background:${gradOf(plan.id)};width:38px;height:38px;border-radius:11px;font-size:15px">${mc ? 'M' : 'P'}</div>
            <div style="flex:1"><div class="nm">${esc(plan.name)}</div><div class="sub">${mc ? 'Minecraft' : 'Palworld'} · ${plan.max_players} players · ${plan.memory_mb / 1024} GB · ${money2}/mo</div></div>
            <button class="iconbtn" onclick="closeOrder()">${icons.x}</button></div>
          <div class="sheet-body">
            <div class="frow"><label>Server name</label><input value="${esc(o.name)}" oninput="setOrder('name',this.value)" placeholder="My Server"></div>
            ${cfg}
            <div class="savebar"><button class="cta" onclick="submitOrder()">Create order · ${money2}/mo</button></div>
          </div></div>`
    }
    window.submitOrder = async () => {
      const o = order, name = o.name.trim()
      if (!name) return toast('Name your server first', true)
      const config = {}
      if (o.plan.game === 'minecraft') {
        if (o.mode === 'modpack') { if (!o.modpack) return toast('Pick a modpack, or choose Fresh server', true); config.modpack = o.modpack }
        else { config.loader = o.loader; config.version = o.version }
      }
      const base = { user_id: me, plan_id: o.plan.id, server_name: name, reference: REF() }
      let { error } = await supabase.from('hosting_orders').insert({ ...base, config })
      // older clouds without the config column: fall back so ordering still works
      if (error && /config|column|schema cache/i.test(error.message || '')) {
        ;({ error } = await supabase.from('hosting_orders').insert(base))
      }
      if (error) return toast(error.message, true)
      closeOrder(); toast('Order created — follow the payment steps'); void loadHosting()
    }
    window.markPaid = async (orderId) => {
      const { error } = await supabase.rpc('hosting_mark', { order_id: orderId, new_status: 'pending_review' })
      if (error) return toast(error.message, true)
      toast('Thanks — your payment is under review')
      void loadHosting()
    }
    window.cancelOrder = async (orderId) => {
      if (!confirm('Cancel this order?')) return
      await supabase.rpc('hosting_mark', { order_id: orderId, new_status: 'cancelled' })
      void loadHosting()
    }
    window.adminApprove = async (orderId) => {
      const days = parseInt(prompt('Approve for how many days?', '30') || '', 10)
      if (!days || days < 1) return
      const until = new Date(Date.now() + days * 86400000).toISOString()
      const { error } = await supabase.from('hosting_orders').update({ status: 'active', paid_until: until }).eq('id', orderId)
      if (error) return toast(error.message, true)
      toast('Approved — your launcher will provision it within a minute')
      void loadHosting()
    }
    window.adminReject = async (orderId) => {
      if (!confirm('Reject this order?')) return
      await supabase.from('hosting_orders').update({ status: 'rejected' }).eq('id', orderId)
      void loadHosting()
    }

    function payBlock(order, plan, settings) {
      if (!plan) return ''
      const memo = encodeURIComponent(order.reference)
      const pp = settings.paypal_me
        ? `https://paypal.me/${settings.paypal_me}/${plan.price_monthly}`
        : ''
      const links = []
      if (pp) links.push(`<a class="btn start" style="text-decoration:none" href="${pp}" target="_blank" rel="noreferrer">Pay ${money(plan.price_monthly, plan.currency)} with PayPal</a>`)
      if (plan.stripe_link) links.push(`<a class="btn" style="text-decoration:none" href="${esc(plan.stripe_link)}" target="_blank" rel="noreferrer">Pay by card</a>`)
      if (!links.length) return `<div class="hintline">Payment isn't set up yet — contact the host.</div>`
      return `<div class="hintline">Send exactly <b>${money(plan.price_monthly, plan.currency)}</b> and put your reference <b>${esc(order.reference)}</b> in the payment note.</div>
        <div class="acts">${links.join('')}</div>
        <div class="acts single"><button class="btn" onclick="markPaid('${order.id}')">I've paid — submit for review</button></div>`
    }

    async function loadHosting(target = $('dHosting') ? 'dHosting' : 'hosting') {
      try {
        const [{ data: prof }, { data: plans }, { data: settings }, { data: myOrders }] = await Promise.all([
          supabase.from('profiles').select('is_admin').eq('id', me).maybeSingle(),
          supabase.from('hosting_plans').select('*').eq('active', true).order('sort'),
          supabase.from('hosting_settings').select('*').eq('id', 1).maybeSingle(),
          supabase.from('hosting_orders').select('*').order('created_at', { ascending: false })
        ])
        isAdmin = Boolean(prof?.is_admin)
        const planList = plans ?? []
        const planMap = new Map(planList.map((p) => [p.id, p]))
        plansCache.clear(); planList.forEach((p) => plansCache.set(p.id, p))
        const cfg = settings ?? { paypal_me: '' }
        const orders = (myOrders ?? []).filter((o) => o.user_id === me)
        let html = ''

        // customer: my orders
        const liveOrders = orders.filter((o) => o.status !== 'cancelled' && o.status !== 'rejected')
        if (liveOrders.length) {
          html += `<div class="home-head">Your hosting</div>`
          html += liveOrders.map((o) => {
            const plan = planMap.get(o.plan_id)
            const settingUp = o.status === 'active' && !o.server_id
            const [cls, label] = settingUp ? ['warm', 'Setting up…'] : (STATUS_LABEL[o.status] ?? ['', o.status])
            const until = o.paid_until ? ` · renews ${new Date(o.paid_until).toLocaleDateString()}` : ''
            const pay = (o.status === 'awaiting_payment' || o.status === 'past_due') ? payBlock(o, plan, cfg) : ''
            const cancel = (o.status === 'awaiting_payment' || o.status === 'pending_review') ? `<button class="conbtn" onclick="cancelOrder('${o.id}')">Cancel order</button>` : ''
            const failed = /failed/i.test(o.note || '')
            const noteHtml = o.note ? `<div class="hintline"${failed ? ' style="color:var(--red)"' : ''}>${settingUp && !failed ? '⏳ ' : ''}${esc(o.note)}</div>` : ''
            const readyHint = o.status === 'active' && o.server_id ? `<div class="hintline">✓ Your server is live — manage it in the list above.</div>` : ''
            return `<div class="card">
              <div class="head"><div class="who"><div class="nm">${esc(o.server_name)}</div><div class="ln">${plan ? esc(plan.name) : o.plan_id}${until}</div></div><span class="chip ${cls}">${label}</span></div>
              ${noteHtml}${readyHint}${pay}${cancel}
            </div>`
          }).join('')
        }

        // customer: order a new server
        if (planList.length) {
          html += `<div class="home-head">${liveOrders.length ? 'Add another server' : 'Get a game server'}</div>`
          html += `<div class="card">` + planList.map((p) => `
            <div class="head" style="padding:8px 0;border-top:1px solid var(--line)">
              <div class="who"><div class="nm">${esc(p.name)}</div><div class="ln">${p.game === 'palworld' ? 'Palworld' : 'Minecraft'} · ${p.max_players} players · ${(p.memory_mb/1024)} GB</div></div>
              <button class="btn start" style="width:auto;padding:9px 14px" onclick="orderPlan('${p.id}')">${money(p.price_monthly, p.currency)}/mo</button>
            </div>`).join('') + `</div>`
        }

        // admin: orders needing action
        if (isAdmin) {
          const queue = (myOrders ?? []).filter((o) => o.status === 'pending_review' || o.status === 'active' || o.status === 'past_due')
          html += `<div class="home-head">Admin · orders</div>`
          if (!cfg.paypal_me) html += `<div class="card"><div class="hintline" style="color:var(--amber)">Set your PayPal.me handle in Supabase → hosting_settings so customers can pay.</div></div>`
          html += queue.length ? queue.map((o) => {
            const plan = planMap.get(o.plan_id)
            const [cls, label] = STATUS_LABEL[o.status] ?? ['', o.status]
            const actions = o.status === 'pending_review'
              ? `<div class="acts"><button class="btn start" onclick="adminApprove('${o.id}')">Approve</button><button class="btn stop" onclick="adminReject('${o.id}')">Reject</button></div>`
              : o.status === 'past_due'
                ? `<div class="acts single"><button class="btn start" onclick="adminApprove('${o.id}')">Renew</button></div>`
                : ''
            return `<div class="card"><div class="head"><div class="who"><div class="nm">${esc(o.server_name)}</div><div class="ln">${plan ? esc(plan.name) : o.plan_id} · ref ${esc(o.reference)}</div></div><span class="chip ${cls}">${label}</span></div>${actions}</div>`
          }).join('') : `<div class="card"><div class="hintline">No orders waiting.</div></div>`
        }

        // repaint only on real changes — this runs on the 8s poll, and a no-op
        // rewrite would flicker and swallow clicks mid-press
        const el = $(target)
        if (el && el.__lastHtml !== html) { el.__lastHtml = html; el.innerHTML = html }
      } catch {
        // tables not migrated yet — hosting section stays empty
      }
    }

    async function enter(session) {
      me = session.user.id
      const { data } = await supabase.from('profiles').select('username').eq('id', me).maybeSingle()
      if (data?.username) myName = `${data.username} (phone)`
      $('login').hidden = true
      $('topbar').hidden = false
      $('app').hidden = false
      $('dapp').hidden = false
      $('servers').innerHTML = '<div class="skel"></div><div class="skel"></div>'
      void refresh()
      void refreshBell()
      clearInterval(timer)
      timer = setInterval(refresh, 8000)
    }

    let signupMode = false
    $('modeToggle').addEventListener('click', () => {
      signupMode = !signupMode
      $('userField').hidden = !signupMode
      $('loginBtn').textContent = signupMode ? 'Create account' : 'Sign in'
      $('modeToggle').textContent = signupMode ? 'Have an account? Sign in' : 'New here? Create an account'
    })

    $('loginBtn').addEventListener('click', async () => {
      $('loginErr').textContent = ''
      $('loginBtn').disabled = true
      const email = $('email').value.trim()
      const password = $('password').value
      if (signupMode) {
        const username = $('username').value.trim()
        if (!username) {
          $('loginBtn').disabled = false
          $('loginErr').textContent = 'Pick a username first.'
          return
        }
        const { data, error } = await supabase.auth.signUp({ email, password, options: { data: { username } } })
        $('loginBtn').disabled = false
        if (error) $('loginErr').textContent = error.message
        else if (data.session) void enter(data.session)
        else $('loginErr').textContent = 'Almost there — confirm the email we just sent, then sign in.'
        return
      }
      const { data, error } = await supabase.auth.signInWithPassword({ email, password })
      $('loginBtn').disabled = false
      if (error) $('loginErr').textContent = error.message
      else void enter(data.session)
    })
    $('password').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('loginBtn').click() })

    $('signout').addEventListener('click', async () => {
      await supabase.auth.signOut()
      location.reload()
    })

    // ---------- push notifications ----------
    function urlB64(base64) {
      const padding = '='.repeat((4 - (base64.length % 4)) % 4)
      const raw = atob((base64 + padding).replace(/-/g, '+').replace(/_/g, '/'))
      return Uint8Array.from([...raw].map((c) => c.charCodeAt(0)))
    }

    async function refreshBell() {
      if (!('serviceWorker' in navigator) || !('PushManager' in window) || !me) return
      const bell = $('bell')
      bell.hidden = false
      try {
        const reg = await navigator.serviceWorker.ready
        const sub = await reg.pushManager.getSubscription()
        bell.classList.toggle('on', Boolean(sub))
        bell.title = sub ? 'Notifications on — tap to turn off' : 'Enable notifications'
      } catch {}
    }

    $('bell').addEventListener('click', async () => {
      try {
        const reg = await navigator.serviceWorker.ready
        const existing = await reg.pushManager.getSubscription()
        if (existing) {
          await supabase.from('push_subscriptions').delete().eq('endpoint', existing.endpoint)
          await existing.unsubscribe()
          toast('Notifications off')
          return
        }
        const perm = await Notification.requestPermission()
        if (perm !== 'granted') return toast('Notifications were blocked by the browser', true)
        const { data: cfg } = await supabase.from('push_config').select('public_key').eq('owner_id', me).maybeSingle()
        if (!cfg) return toast('Open ELauncher on your PC once, then try again', true)
        const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlB64(cfg.public_key) })
        const { error } = await supabase.from('push_subscriptions').upsert(
          { owner_id: me, endpoint: sub.endpoint, subscription: sub.toJSON(), label: navigator.userAgent.slice(0, 120) },
          { onConflict: 'endpoint' }
        )
        if (error) throw new Error(error.message)
        toast('Notifications on — this phone gets server alerts')
      } catch (e) {
        toast(e.message ?? 'Could not enable notifications', true)
      } finally {
        void refreshBell()
      }
    })

    document.addEventListener('visibilitychange', () => { if (!document.hidden) void refresh() })

    // installable app shell (Android turns this into a real WebAPK on install)
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {})

    const { data: { session } } = await supabase.auth.getSession()
    if (session) void enter(session)
    else $('login').hidden = false
  </script>
</body>
</html>
