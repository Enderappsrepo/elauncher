<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>ELauncher — Remote</title>
    <!-- absolute so they resolve from the staging build at /elauncher/next/ too,
         rather than being duplicated into it (the icons are ~600 KB) -->
    <link rel="icon" href="/elauncher/icon.png" />
    <link rel="apple-touch-icon" href="/elauncher/manage/icon-192.png" />
    <!-- No manifest link while staging: its start_url and scope resolve against
         the manifest's own location, so an installed staging PWA would open the
         old panel. Restored at cutover, when this build IS /elauncher/manage/. -->
    <script type="module" crossorigin src="/elauncher/next/assets/manage-BfT_PyKR.js"></script>
    <link rel="modulepreload" crossorigin href="/elauncher/next/assets/App-B_IF7UWd.js">
    <link rel="stylesheet" crossorigin href="/elauncher/next/assets/App-DH2rRXZA.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
