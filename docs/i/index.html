<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Server invite · ELauncher</title>
<link rel="icon" href="../icon.png" />
<style>
  :root {
    --bg: #0f1216;
    --card: #171b21;
    --raised: #1e242c;
    --line: #2a323c;
    --ink: #e8edf2;
    --soft: #a4b0bd;
    --faint: #6f7d8c;
    --accent: #4d7cfe;
    --accent-ink: #ffffff;
    --green: #3ba55d;
    --amber: #d8a340;
    --red: #d05353;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f2f4f7; --card: #ffffff; --raised: #f7f9fb; --line: #e2e7ee;
      --ink: #131820; --soft: #4d5a68; --faint: #7c8896;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
    font-family: var(--sans); display: grid; place-items: center; padding: 24px;
    line-height: 1.55;
  }
  .card {
    width: 100%; max-width: 460px; background: var(--card);
    border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
  }
  .banner { height: 78px; background: linear-gradient(135deg, #3a5bd9, #7b46c7); }
  .body { padding: 18px 22px 22px; }
  .top { display: flex; gap: 14px; align-items: center; margin-top: -44px; }
  .crest {
    width: 66px; height: 66px; border-radius: 18px; flex-shrink: 0;
    display: grid; place-items: center; font-size: 26px; font-weight: 700;
    background: var(--raised); border: 4px solid var(--card); color: var(--ink);
  }
  .eyebrow { font-size: .68rem; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); font-weight: 600; }
  h1 { margin: 2px 0 0; font-size: 1.35rem; line-height: 1.2; }
  .stats { display: flex; gap: 16px; margin: 14px 0 0; font-size: .84rem; color: var(--soft); }
  .stat { display: flex; align-items: center; gap: 6px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--faint); flex-shrink: 0; }
  .dot.on { background: var(--green); }
  .dot.sleep { background: var(--accent); }
  .dot.off { background: var(--faint); }
  p.desc { color: var(--soft); font-size: .92rem; margin: 14px 0 0; white-space: pre-wrap; }
  .btn {
    display: block; width: 100%; margin-top: 18px; padding: 11px 18px; border: 0;
    border-radius: 6px; background: var(--accent); color: var(--accent-ink);
    font: inherit; font-weight: 650; cursor: pointer;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn:disabled { opacity: .55; cursor: not-allowed; }
  .btn.ghost { background: var(--raised); color: var(--ink); border: 1px solid var(--line); }
  .btn:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  label.q { display: block; margin-top: 14px; font-size: .85rem; font-weight: 600; }
  .req { color: var(--red); }
  input, textarea, select {
    width: 100%; margin-top: 6px; padding: 9px 11px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--raised); color: var(--ink); font: inherit; font-size: .92rem;
  }
  textarea { min-height: 84px; resize: vertical; }
  .note { margin-top: 16px; padding: 12px 14px; border-radius: 6px; background: var(--raised); border-left: 3px solid var(--accent); font-size: .9rem; color: var(--soft); white-space: pre-wrap; }
  .note.good { border-left-color: var(--green); }
  .note.bad { border-left-color: var(--red); }
  .note strong { color: var(--ink); }
  .foot { margin-top: 18px; text-align: center; font-size: .76rem; color: var(--faint); }
  .foot a { color: var(--faint); }
  .hidden { display: none !important; }
  .spin { text-align: center; color: var(--faint); padding: 40px 0; }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="banner"></div>
  <div class="body">
    <div id="view" class="spin">Loading invite…</div>
  </div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'

const SUPABASE_URL = 'https://noodzwrbsibogeoukvye.supabase.co'
const SUPABASE_ANON_KEY = 'sb_publishable_DgVhX7zDLdO2ghE14jcrTw_o3yLxwrs'
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

const view = document.getElementById('view')
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))

/** ?c=CODE, or the last path segment so /i/AbC123 reads the same. */
function inviteCode() {
  const q = new URLSearchParams(location.search).get('c')
  if (q) return q.trim()
  const seg = location.pathname.replace(/\/+$/, '').split('/').pop()
  return seg && seg !== 'i' && !seg.endsWith('.html') ? seg : ''
}

const STATE = {
  running: ['on', 'Online'],
  sleeping: ['sleep', 'Asleep — joining wakes it'],
  starting: ['sleep', 'Starting…'],
  stopping: ['off', 'Stopping…'],
  stopped: ['off', 'Offline'],
  unknown: ['off', 'Status unknown']
}

const CLOSED_REASON = {
  unknown: 'This invite link does not exist. Check the link, or ask whoever sent it for a new one.',
  disabled: 'This invite has been turned off by the server owner.',
  expired: 'This invite has expired.',
  full: 'This invite has reached its limit of uses.'
}

let invite = null
let session = null

function header() {
  const [cls, label] = STATE[invite.state] ?? STATE.unknown
  const initial = esc((invite.serverName || '?').trim().charAt(0).toUpperCase())
  return `
    <div class="top">
      <div class="crest">${initial}</div>
    </div>
    <div style="margin-top:12px">
      <div class="eyebrow">${esc(invite.game || 'Game server')} · you've been invited to join</div>
      <h1>${esc(invite.serverName || 'A server')}</h1>
    </div>
    <div class="stats">
      <span class="stat"><span class="dot ${cls}"></span>${esc(label)}</span>
      <span class="stat">${Number(invite.players) || 0} online</span>
    </div>
    ${invite.headline ? `<p class="desc"><strong>${esc(invite.headline)}</strong></p>` : ''}
    ${invite.description ? `<p class="desc">${esc(invite.description)}</p>` : ''}`
}

function foot() {
  return `<div class="foot">Hosted with <a href="../">ELauncher</a></div>`
}

function renderClosed(reason) {
  view.innerHTML = `
    <div class="top"><div class="crest">·</div></div>
    <div style="margin-top:12px"><h1>Invite unavailable</h1></div>
    <div class="note bad">${esc(CLOSED_REASON[reason] ?? 'This invite is no longer usable.')}</div>
    ${foot()}`
}

function questionField(q) {
  const req = q.required ? ' <span class="req">*</span>' : ''
  const id = `q_${esc(q.id)}`
  if (q.type === 'textarea') {
    return `<label class="q" for="${id}">${esc(q.label)}${req}<textarea id="${id}" data-q="${esc(q.id)}" ${q.required ? 'required' : ''}></textarea></label>`
  }
  if (q.type === 'select') {
    const opts = (q.options || []).map((o) => `<option value="${esc(o)}">${esc(o)}</option>`).join('')
    return `<label class="q" for="${id}">${esc(q.label)}${req}<select id="${id}" data-q="${esc(q.id)}" ${q.required ? 'required' : ''}><option value="">Choose…</option>${opts}</select></label>`
  }
  return `<label class="q" for="${id}">${esc(q.label)}${req}<input id="${id}" data-q="${esc(q.id)}" ${q.required ? 'required' : ''} /></label>`
}

/** Signed out: the card is public, applying is not. */
function renderSignedOut() {
  view.innerHTML = `${header()}
    ${invite.needsApplication
      ? `<div class="note">This server reviews who joins. Sign in or create a free account to apply — the owner will see your answers and decide.</div>`
      : `<div class="note">Sign in or create a free account to join this server.</div>`}
    <button class="btn" id="signin">Sign in / create account</button>
    ${foot()}`
  document.getElementById('signin').onclick = () => renderAuth()
}

function renderAuth(mode = 'in', error = '') {
  const joining = mode === 'up'
  view.innerHTML = `${header()}
    ${error ? `<div class="note bad">${esc(error)}</div>` : ''}
    <label class="q" for="email">Email<input id="email" type="email" autocomplete="email" /></label>
    <label class="q" for="pw">Password<input id="pw" type="password" autocomplete="${joining ? 'new-password' : 'current-password'}" /></label>
    <button class="btn" id="go">${joining ? 'Create account' : 'Sign in'}</button>
    <button class="btn ghost" id="swap">${joining ? 'I already have an account' : 'Create an account instead'}</button>
    ${foot()}`
  document.getElementById('swap').onclick = () => renderAuth(joining ? 'in' : 'up')
  document.getElementById('go').onclick = async (e) => {
    const btn = e.currentTarget
    const email = document.getElementById('email').value.trim()
    const password = document.getElementById('pw').value
    if (!email || !password) return renderAuth(mode, 'Enter an email and password.')
    btn.disabled = true
    btn.textContent = joining ? 'Creating…' : 'Signing in…'
    const { data, error: err } = joining
      ? await supabase.auth.signUp({ email, password })
      : await supabase.auth.signInWithPassword({ email, password })
    if (err) return renderAuth(mode, err.message)
    if (joining && !data.session) {
      // the project has email confirmation on — there is nothing to apply with yet
      view.innerHTML = `${header()}
        <div class="note good"><strong>Check your email.</strong>
Confirm your address, then open this invite link again to finish applying.</div>${foot()}`
      return
    }
    session = data.session
    await route()
  }
}

function renderForm(error = '') {
  const qs = invite.questions || []
  view.innerHTML = `${header()}
    ${error ? `<div class="note bad">${esc(error)}</div>` : ''}
    ${qs.length
      ? `<div class="note">The owner asks a few things before letting people in. You'll get an email when they decide.</div>${qs.map(questionField).join('')}`
      : `<div class="note">You're signed in. Send a request and the owner will get back to you by email.</div>`}
    <button class="btn" id="apply">${qs.length ? 'Submit application' : 'Request to join'}</button>
    ${foot()}`
  document.getElementById('apply').onclick = async (e) => {
    const answers = {}
    for (const el of view.querySelectorAll('[data-q]')) {
      const q = qs.find((x) => String(x.id) === el.dataset.q)
      const value = el.value.trim()
      if (q?.required && !value) return renderForm(`"${q.label}" is required.`)
      answers[el.dataset.q] = value
    }
    e.currentTarget.disabled = true
    e.currentTarget.textContent = 'Sending…'
    const { data, error: err } = await supabase.rpc('apply_to_invite', { invite_code: invite.code, submitted: answers })
    if (err) return renderForm(err.message)
    if (!data?.ok) return renderClosed(data?.reason ?? 'disabled')
    renderSubmitted(data.status)
  }
}

function renderSubmitted(status) {
  const body = status === 'approved'
    ? `<div class="note good"><strong>You're already approved.</strong>
Check your email for the join instructions.</div>`
    : `<div class="note good"><strong>Application sent.</strong>
The owner has been notified and you'll get an email when they decide. You can close this page.</div>`
  view.innerHTML = `${header()}${body}${foot()}`
}

/** Show an existing application's outcome rather than a blank form. */
async function existingApplication() {
  const { data } = await supabase
    .from('server_applications')
    .select('status, owner_note')
    .eq('code', invite.code)
    .maybeSingle()
  return data ?? null
}

async function route() {
  if (invite.closed) return renderClosed(invite.closed)
  if (!session) return renderSignedOut()

  const existing = await existingApplication()
  if (existing?.status === 'approved') {
    return (view.innerHTML = `${header()}
      <div class="note good"><strong>You're in.</strong>
${esc(existing.owner_note || 'Check your email for the join instructions the owner sent.')}</div>${foot()}`)
  }
  if (existing?.status === 'denied') {
    return (view.innerHTML = `${header()}
      <div class="note bad"><strong>This application was declined.</strong>
${esc(existing.owner_note || 'The owner did not leave a reason.')}</div>
      <button class="btn ghost" id="again">Apply again</button>${foot()}`,
      (document.getElementById('again').onclick = () => renderForm()))
  }
  if (existing?.status === 'pending') return renderSubmitted('pending')
  renderForm()
}

async function boot() {
  const code = inviteCode()
  if (!code) return renderClosed('unknown')
  const [{ data: rpc, error }, { data: sess }] = await Promise.all([
    supabase.rpc('invite_view', { invite_code: code }),
    supabase.auth.getSession()
  ])
  session = sess?.session ?? null
  if (error) {
    view.innerHTML = `<div class="note bad">Couldn't load this invite: ${esc(error.message)}</div>`
    return
  }
  if (!rpc?.ok) return renderClosed(rpc?.reason ?? 'unknown')
  invite = rpc
  document.title = `Join ${rpc.serverName || 'a server'} · ELauncher`
  await route()
}

boot()
</script>
</body>
</html>
